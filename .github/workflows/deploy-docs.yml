name: Deploy docs to GitHub Pages

# Manual until the repository is public.
#
# GitHub Pages does not serve a site from a private repository on the Free plan at all, and
# even where it is available it has to be switched on in the repository's settings first. On
# every push this would therefore fail rather than deploy — a red mark on each docs commit,
# an email each time, and Actions minutes spent to produce it. Turn the push trigger back on
# in the same change that makes the repository public.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
