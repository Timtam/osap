name: Deploy docs to GitHub Pages

# Manual until GitHub Pages is switched on for this repository.
#
# The private-repository half of this is settled — the repository has been public since
# 2026-09-12 — but Pages still has to be enabled in the repository's settings, with "GitHub
# Actions" as the source, and it has not been. On every push this would therefore fail
# rather than deploy: a red mark on each docs commit, an email each time, and a runner spent
# to produce it. Turn the push trigger back on in the same change that enables Pages, and
# say so in the README so the site's address is somewhere a reader can find it.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
