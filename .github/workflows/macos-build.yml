# Builds the macOS application on a real Mac, because nobody on the project has one.
#
# The macOS backend is written blind. `check-macos.ps1` type-checks it from Windows, which
# catches wrong signatures but never links — so a missing framework, a bad `#[link]`, or an
# undefined Carbon symbol would go unnoticed until a tester's first launch. This job is
# where those show up, and it is the reason the port can be developed at all without Apple
# hardware.
#
# It also produces the artifact a tester downloads: a zipped .app with the modules and a
# README beside it.
#
# Not triggered on its own. `build.yml` calls this beside `windows-build.yml`, so one push is one
# run with both platforms' downloads in it. The trigger (and the history of why it is no longer
# a hand-kept list of "the macOS code": money was the reason, and it is gone) and the download's
# name live there, and so does the reason a newer push no longer cancels a superseded run. What
# remains is wall-clock, and this job runs beside the Windows one rather than ahead of it.
name: macOS build

on:
  workflow_call:
    # No choice of Mac any more. There used to be one on the manual trigger, which was really a
    # choice of which architecture the artifact would run on; a universal build makes the
    # question go away.
    inputs:
      artifact-prefix:
        description: 'automation-platform-<version>-<commit>, worked out by build.yml; this workflow adds -macos'
        required: true
        type: string
      commit:
        description: 'the seven-character commit in that name, which the package records as its build'
        required: true
        type: string

# `actions: read` is for looking up an earlier run and downloading its build; see "Reuse the
# last build" below. `build.yml` grants the same two to this call; asking here for more than
# it grants would stop the run before it starts.
permissions:
  contents: read
  actions: read

jobs:
  build:
    # Intel by default, because the machine the build has to RUN on is Intel and an arm64
    # binary will not start there at all — Rosetta translates Intel code for Apple silicon,
    # never the other way round. Both labels are standard runners and both draw on the same
    # included minutes, so this is a choice about who can run the result, not about cost.
    #
    # A universal binary needs both slices and `lipo`, which means two runs; see
    # A UNIVERSAL app, so it runs natively on Apple silicon as well as on Intel.
    #
    # Built on an Apple-silicon runner with both slices cross-compiled there, rather than on
    # two machines with the halves posted between them. Three reasons, all checked:
    #
    #   * wxdragon-sys cross-compiles by design — build.rs reads CARGO_CFG_TARGET_ARCH and
    #     forces CMAKE_OSX_ARCHITECTURES, as a define AND in the environment so the nested
    #     wxWidgets configure inherits it. It even carries a workaround for a library name you
    #     only ever see when cross-building macOS, so somebody has run this.
    #   * The other assumed blocker is not there at all: `ort` sits under
    #     cfg(windows) in crates/host/Cargo.toml, so ONNX Runtime is never resolved for a Mac.
    #     macOS OCR is Apple Vision. Nothing per-architecture goes into the bundle but the
    #     executable itself, which is why one `lipo` makes the whole thing universal.
    #   * Intel runners have a published end date and are stated to be the last x86_64 images.
    #     A job that cross-builds Intel from arm outlives them without changing.
    #
    # And the direction matters for what gets EXECUTED: the smoke run below can only run the
    # runner's own architecture. On Intel it re-ran the slice that already worked; here it
    # runs arm64, which no machine has ever executed.
    runs-on: macos-15
    env:
      # The plist promises 12.0 and nothing has ever enforced it. rustc's default floor
      # differs per architecture, so without this the two slices would disagree with each
      # other and with the plist they ship inside.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      # Full history, because the reuse check below asks git what has changed since the commit
      # the last build was made from, and a shallow clone does not have that commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip the build when the Rust has not moved since the last one.
      #
      # Most pushes to this repository are Luau. They trigger this job — deliberately, because
      # a module's macOS-only branch runs nowhere else — and the job then compiles the whole
      # application to produce a binary that is byte-for-byte the one it produced last time.
      # On a warm cargo cache that is a couple of minutes; on a cold one it is wxWidgets from
      # source, which is the better part of a month's included macOS allowance.
      #
      # The question is deliberately NOT "did this push touch crates/". A push's own diff says
      # nothing about the Rust that changed in the pushes before it whose runs never produced a
      # build (one still building has uploaded nothing yet; a failed or cancelled one never
      # will), so `lib.rs` can move several times without ever being compiled here. What
      # matters is whether anything under `crates/` differs from the commit the reusable build
      # was actually made from, and git can answer exactly that.
      #
      # WHICH earlier build: the newest run of `build.yml` (the workflow that calls this one;
      # runs belong to the caller, never to this file) that still holds a macOS download. Not
      # the newest SUCCESSFUL run, which is what this asked while macOS was a workflow of its
      # own. A run is now Windows and macOS together, so a Windows test going red would make
      # the whole run a failure and send every later push back to a full macOS build, over a
      # Mac binary nothing was wrong with. The download is the better witness anyway: it is
      # uploaded only after the build, the tests, both slices, the module load and the speech
      # run have all passed, which is exactly what makes a build worth reusing. The steps
      # after it (the import check, the capture probe, newer-macos) run again on a reused
      # binary, so a finding of theirs is found again rather than hidden. Matched by its
      # suffix, because the name carries the version and commit of the run that made it.
      #
      # Every failure here falls through to building. A missing run, an expired artifact, an
      # unfamiliar layout: none of them are worth a red mark, and all of them are worth a
      # build.
      - name: Reuse the last build when the Rust has not moved
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -u
          # Newest first. This very run is on the list too. On its first attempt it has no macOS
          # download yet and is passed over like any other run without one. On a re-run it can
          # hold the one an earlier attempt uploaded, which is then reused: harmless, since it
          # was built from this same commit and passed the same checks, and the upload below
          # replaces it (`overwrite`).
          run_id="" artifact=""
          for id in $(gh run list --workflow build.yml --branch "$BRANCH" --limit 20 \
              --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
              -q '[.artifacts[] | select(.expired | not) | .name | select(endswith("-macos"))] | first // empty' \
              2>/dev/null || true)
            if [ -n "${found:-}" ]; then run_id=$id; artifact=$found; break; fi
          done
          if [ -z "$run_id" ]; then echo "no earlier run with a macOS download still in it"; exit 0; fi
          echo "the newest earlier macOS build is $artifact, from run $run_id"
          prev=$(gh run view "$run_id" --json headSha -q .headSha 2>/dev/null || true)
          if [ -z "${prev:-}" ]; then echo "cannot read that run's commit"; exit 0; fi
          if ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "commit $prev is not in this clone"; exit 0
          fi
          if ! git diff --quiet "$prev" HEAD -- crates Cargo.toml Cargo.lock package-macos.sh; then
            echo "the Rust has moved since $prev — building"
            git diff --name-only "$prev" HEAD -- crates Cargo.toml Cargo.lock package-macos.sh
            exit 0
          fi
          echo "no Rust change since $prev; trying to reuse its build"
          mkdir -p reuse
          gh run download "$run_id" --dir reuse --name "$artifact" \
            2>/dev/null || { echo "could not download $artifact"; exit 0; }
          zip=$(find reuse -name '*.zip' | head -n1)
          if [ -z "${zip:-}" ]; then echo "no zip in that artifact"; exit 0; fi
          mkdir -p dist
          ditto -x -k "$zip" dist || { echo "could not unpack it"; exit 0; }
          if [ ! -d dist/AutomationPlatform ]; then echo "unfamiliar layout"; exit 0; fi
          # Which commit the executable in it was built from: that package's `binary=` line when
          # it was itself a reuse, its `commit=` otherwise (a package this job built names its
          # own commit, and the executable was compiled from the same checkout). Read before
          # the file is rewritten below.
          info=dist/AutomationPlatform/build-info.txt
          if [ ! -f "$info" ]; then echo "that build carries no build-info.txt"; exit 0; fi
          # Its Build: line is rewritten below, and under `bash -e` a missing file would fail the
          # job there rather than fall through to a build.
          if [ ! -f dist/AutomationPlatform/README.txt ]; then echo "that build has no README.txt"; exit 0; fi
          from=$(sed -n 's/^binary=//p' "$info" | head -n1)
          [ -n "$from" ] || from=$(sed -n 's/^commit=//p' "$info" | head -n1)
          if [ -z "$from" ]; then echo "that build's build-info.txt names no commit"; exit 0; fi
          # The binary is the old one; the MODULES are this commit's, which is the whole point
          # of the run. Staged the same way package-macos.sh stages them.
          rm -rf dist/AutomationPlatform/modules
          mkdir -p dist/AutomationPlatform/modules
          for dir in modules/*/; do
            name=$(basename "$dir")
            [ -f "$dir/module.toml" ] || continue
            cp -R "$dir" "dist/AutomationPlatform/modules/$name"
            rm -rf "dist/AutomationPlatform/modules/$name/calibration"
          done
          # And the probe, which `package-macos.sh` stages separately because it lives under
          # tools/ rather than modules/. This loop did not, so every reused build shipped an
          # artifact advertising "today's modules" with the tester's ONLY instrument missing
          # from it — and nothing downstream said so, because the smoke run asserts that
          # modules loaded, not that this one did.
          if [ -d tools/probe ]; then
            cp -R tools/probe dist/AutomationPlatform/modules/probe
          fi
          # And the build it is: this run's commit, because the download is named for it and its
          # modules are its. The old file would name the earlier run, and the tester would quote
          # a build whose modules he does not have. The executable's own commit is kept beside
          # it and in the README; the application says it too, as "binary built from", since
          # the commit is compiled into it. Beside the .app, so the signed bundle is untouched
          # and stays the application the tester has already granted permissions to.
          if [ "$from" = "$COMMIT" ]; then
            # A re-run of this same run, reusing what its first attempt uploaded.
            printf '%s\n' \
              "# The commit this package was made from. Automation Platform reads it at start and names it" \
              "# in every session's header in automation-platform.log and in the title of its Modules window." \
              "commit=$COMMIT" > "$info"
          else
            printf '%s\n' \
              "# The commit this package was made from. Automation Platform reads it at start and names it" \
              "# in every session's header in automation-platform.log and in the title of its Modules window." \
              "# Its executable is an earlier build's, reused because no Rust had changed since:" \
              "commit=$COMMIT" \
              "binary=$from" > "$info"
            sed -i '' "s/^Build: .*/Build: $COMMIT (the application itself was built from $from)/" \
              dist/AutomationPlatform/README.txt
          fi
          grep '^Build: ' dist/AutomationPlatform/README.txt || echo "::warning::the reused README has no Build: line"
          # Re-zipped so the artifact a tester downloads carries today's modules rather than
          # the ones the binary happened to ship with.
          rm -f dist/*.zip
          (cd dist && ditto -c -k --sequesterRsrc --keepParent AutomationPlatform \
            "AutomationPlatform-macos-$(date +%Y-%m-%d)-modules.zip")
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "reused the build from $prev: the package is build $COMMIT, its executable was built from $from"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outputs.reused != 'true' 

      # wxWidgets is compiled from source by wxdragon's build script; it is by far the
      # longest part of the job, and it only changes when the dependency does.
      # Without this the wxWidgets build runs every time, and that is the expensive part.
      # Worth knowing: Actions evicts a cache after 7 days without a hit, so a job that only
      # runs once a month is always cold — budget for the full build, not the cached one.
      - uses: Swatinem/rust-cache@v2
        with:
          # Two slices means two wxWidgets compiles, and they land in different
          # per-target directories. Both are worth keeping.
          key: macos-wx-universal
        if: steps.reuse.outputs.reused != 'true'

      - name: Install build tools
        run: brew install ninja cmake
        if: steps.reuse.outputs.reused != 'true'

      - name: Point bindgen at the Xcode toolchain's libclang
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
        if: steps.reuse.outputs.reused != 'true'

      - name: Build both slices
        run: |
          for t in $TARGETS; do
            rustup target add "$t"
            cargo build --release --target "$t"
          done
        if: steps.reuse.outputs.reused != 'true'

      # The platform-independent logic — dependency ordering, key parsing, the bundle-path
      # rule — on a machine where the bundle-path rule is not hypothetical.
      - name: Test
        if: steps.reuse.outputs.reused != 'true'
        # Targeted deliberately. A bare `cargo test --release` would build a THIRD copy of
        # wxWidgets, into target/release, because that is a different output directory from
        # target/<triple>/release — roughly tripling the cold cost while looking like a
        # one-word step. arm64 because that is the slice this runner can also execute.
        run: cargo test --release --target aarch64-apple-darwin

      # With this run's commit as the build, which package-macos.sh writes into build-info.txt
      # beside the .app and into the README.
      - name: Package
        env:
          COMMIT: ${{ inputs.commit }}
        run: ./package-macos.sh --universal --commit "$COMMIT"
        if: steps.reuse.outputs.reused != 'true'

      # `package-macos.sh` prints `lipo -archs` and carries on regardless, so a half-universal
      # bundle would ship looking fine. This is the assertion it does not make.
      - name: It has to actually contain both
        run: |
          exe="dist/AutomationPlatform/Automation Platform.app/Contents/MacOS/automation-platform"
          [ -f "$exe" ] || exe=$(find dist -type f -name automation-platform | head -n1)
          archs=$(lipo -archs "$exe")
          echo "architectures: $archs"
          case "$archs" in
            *arm64*) ;; *) echo "no arm64 slice — this would not run natively on an M-series Mac" >&2; exit 1 ;;
          esac
          case "$archs" in
            *x86_64*) ;; *) echo "no x86_64 slice — this would not run on an Intel Mac" >&2; exit 1 ;;
          esac

      # Load every shipped module once, on a Mac, because nothing else ever does.
      #
      # `cargo check` compiles the macOS Rust; it cannot execute a line of Luau. And a
      # module's macOS-only branch — anything inside `host.os.is("macos")` — never runs on
      # the Windows machine this is written on, so a module can load cleanly there for weeks
      # and then fail on a tester's first launch. That is exactly what happened: the
      # sforzando VoiceOver probe called `onActivate` after the overlay was bound, which the
      # runtime rejects, and the first anyone knew of it was a remote crash log.
      #
      # Headless, so no window and no tray. Accessibility is not granted on a CI runner, and
      # this used to say the event loop would therefore refuse to start. It does start — the
      # log says `listening for events (headless)` and then `headless: running the
      # CoreFoundation run loop`, and the observation cache reports epochs afterwards. The
      # difference matters, because it means timers fire here and a module can be given real
      # work rather than merely being loaded. The step below is the first thing to use that.
      #
      # This one still asks a single question: did every module load. And, in passing, whether
      # the log names this run's build, which is what a tester's report will be matched by.
      - name: Load the modules once, on a Mac
        env:
          COMMIT: ${{ inputs.commit }}
          REUSED: ${{ steps.reuse.outputs.reused }}
        run: |
          cd dist/AutomationPlatform
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform &
          pid=$!
          for _ in $(seq 1 40); do
            if grep -q "listening for events\|fatal:\|did not load" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          # Same question as the speech step asks, and for the same reason: every check below
          # reads lines already written, so a process that aborted after writing them looks
          # exactly like one that finished.
          kill -0 "$pid" 2>/dev/null || {
            echo "::error::the application is no longer running — it died during the module smoke run"
            cat automation-platform.log || true
            exit 1
          }
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          if ! grep -q "listening for events" automation-platform.log; then
            echo "::error::the event loop never started — the run got no further than loading"
            exit 1
          fi
          if grep -q "did not load" automation-platform.log; then
            echo "::error::a module failed to load on macOS"
            exit 1
          fi
          if ! grep -q "loading module:" automation-platform.log; then
            echo "::error::no module was even attempted — the smoke run proved nothing"
            exit 1
          fi
          # Named, not counted. The probe is what a blind tester records a plug-in with, and
          # it is staged by a different line from every other module — so it is the one that
          # can go missing while everything else still loads and this step still passes.
          if ! grep -q "com.tool.probe" automation-platform.log; then
            echo "::error::the window probe is not in this build — the tester's instrument is missing"
            exit 1
          fi
          # The probe starts the game-controller watcher while it loads, so this padless runner
          # is where the GameController source failing to start — a panic in it is caught into
          # this line — would first show. (A missing selector aborts instead; the "no longer
          # running" check above is what catches that.)
          if grep -q "gamepad watcher failed" automation-platform.log; then
            echo "::error::the game-controller watcher did not start — see the gamepad lines above"
            exit 1
          fi
          # The build the tester will quote: this run's commit, read from build-info.txt beside
          # the .app, followed by "(binary built from …)" when the executable was reused. A
          # warning rather than a failure: a wrong build number is worth seeing, not worth the
          # download. `-modified` would mean the checkout had changed before the compile: this
          # run's checkout when it compiled, the earlier run's when it reused that executable, and
          # only in the first case does this checkout's status say anything about it.
          header=$(grep '\[host\] version' automation-platform.log | tail -n1 || true)
          echo "log header: $header"
          case "$header" in
            *", build $COMMIT"*) ;;
            *) echo "::warning::the log does not name this run's commit ($COMMIT) as the build: $header" ;;
          esac
          case "$header" in
            *-modified*)
              if [ "$REUSED" = "true" ]; then
                echo "::warning::the reused executable was compiled from a checkout with uncommitted changes, in the run that built it: $header"
              else
                echo "::warning::the executable was compiled from a checkout with uncommitted changes: $header"
                git -C "$GITHUB_WORKSPACE" status --short || true
              fi ;;
          esac

      # Speech, which is the one new subsystem a runner can actually exercise.
      #
      # Every accessibility call needs a TCC grant a runner does not have, so that half can
      # only be compiled here. Speaking needs no grant at all — and the macOS speech path was
      # rewritten from scratch (`avspeech.rs`, replacing `tts`) and has never run anywhere but
      # a build machine. Compiling proves the calls exist; it cannot prove the WIRING, which is
      # where the mistakes are: which voice a line is handed to, whether choosing one takes
      # effect, whether the list is even populated when somebody asks.
      #
      # It also stands between a blind tester and the worst outcome there is. On this objc2
      # version a selector that does not exist aborts the process instead of returning
      # nothing, so a wrong guess about when an API arrived does not degrade — it takes the
      # application with it, and he would get nothing at all out of a session.
      #
      # Loaded by path rather than from the bundle, deliberately: this must not ship. It
      # speaks on purpose, and an application that says something unprompted at every start-up
      # is exactly what this project does not do.
      - name: Speech, on a Mac
        run: |
          cd dist/AutomationPlatform
          rm -f automation-platform.log
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform \
            "$GITHUB_WORKSPACE/tools/speech-probe" &
          pid=$!
          for _ in $(seq 1 30); do
            if grep -q "SPEECH PROBE: still alive\|fatal:" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          # Asked BEFORE the kill, because this is the assertion the step is really for. Every
          # grep below is satisfied by lines already on disk, so an abort during the say left a
          # log indistinguishable from a healthy run — and an abort during the say is the one
          # failure this whole step exists to catch.
          kill -0 "$pid" 2>/dev/null || {
            echo "::error::the application is no longer running — it died during the speech probe"
            cat automation-platform.log || true
            exit 1
          }
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          # Three assertions, and the first matters most: reaching "done" at all means the
          # process was still alive after asking AVFoundation everything this platform asks it.
          if ! grep -q "SPEECH PROBE: still alive after speaking" automation-platform.log; then
            echo "::error::the speech probe did not report back after speaking — the process may have died in the AVFoundation call"
            exit 1
          fi
          if ! grep -q "SPEECH PROBE: spoke through" automation-platform.log; then
            echo "::error::no voice was ever chosen on a machine with system voices installed"
            exit 1
          fi
          if grep -q "REFUSED\|THREW\|WHICH IS NOT WHAT WAS CHOSEN" automation-platform.log; then
            echo "::error::a speech call was refused, threw, or did not honour the choice"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          # Named for the version and the commit, e.g. automation-platform-0.1.0-865c4a3-macos,
          # beside the run's -windows download of the same name. "Reuse the last build" above
          # finds earlier ones by that -macos ending, so it is not to be changed on its own.
          #
          # Just "macos", with no architecture. It used to be named by the machine it runs on,
          # because an Intel and an arm64 build are not interchangeable and a download called
          # "macos" that will not launch is a bad half hour for whoever tries it. This one is
          # universal, and "It has to actually contain both" above refuses it otherwise, so
          # there is one Mac download and it runs on either.
          #
          # `overwrite`, because the name belongs to the run, not to the attempt. The import
          # check and the capture probe below run after this upload and can go red on their
          # own; without it, "Re-run failed jobs" would stop here on the download the first
          # attempt left behind and never reach them again.
          name: ${{ inputs.artifact-prefix }}-macos
          path: dist/*.zip
          if-no-files-found: error
          overwrite: true

      # The two capture steps run AFTER the upload, on purpose: either can go red on a finding
      # about the next Mac rather than about this build, and that must not also cost the download.
      #
      # `CGWindowListCreateImage` and `CGDisplayCreateImageForRect` are obsoleted in the macOS 15
      # SDK. capture.rs looks them up by name at run time instead of importing them, because an
      # import the running macOS no longer exports stops the application from launching at all —
      # before the log has a single line in it. This is the check that the lookup is the only
      # way in: one ordinary call to either, anywhere, and the import is back.
      - name: The binary does not import the obsoleted capture functions
        run: |
          exe=dist/AutomationPlatform/AutomationPlatform.app/Contents/MacOS/automation-platform
          nm -u "$exe" > imports.txt
          if grep -E '_CG(WindowListCreateImage|DisplayCreateImageForRect)$' imports.txt; then
            echo "::error::the binary imports an obsoleted capture function — on a macOS that has dropped it, the application would not launch"
            exit 1
          fi
          if ! grep -q '_CGPreflightScreenCaptureAccess$' imports.txt; then
            echo "::error::the import list does not even contain a capture function that IS called — the check above is not looking at the right binary"
            exit 1
          fi
          echo "neither obsoleted capture function is imported"

      # The one question about ScreenCaptureKit no document answers and a runner can: does its
      # completion handler arrive while the pump thread is the thread waiting for it? capture.rs
      # gives up after a deadline, so a "no" hangs nothing — it silently moves every capture onto
      # the older functions, which a newer macOS may not have. No Screen Recording grant is needed
      # to ask: a refusal comes back through the same handler an image does.
      - name: Screen capture, on a Mac
        run: |
          cd dist/AutomationPlatform
          rm -f automation-platform.log
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform \
            "$GITHUB_WORKSPACE/tools/capture-probe" &
          pid=$!
          for _ in $(seq 1 40); do
            if grep -q "CAPTURE PROBE: still alive\|fatal:" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          alive=1
          kill -0 "$pid" 2>/dev/null || alive=0
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          if [ "$alive" != 1 ]; then
            echo "::error::the application is no longer running — it died during the capture probe"
            exit 1
          fi
          if ! grep -q "CAPTURE PROBE: still alive after capturing" automation-platform.log; then
            echo "::error::the capture probe did not report back after capturing"
            exit 1
          fi
          if ! grep -q "screen capture paths on this macOS:" automation-platform.log; then
            echo "::error::no capture ever reached capture.rs — the probe's reads were refused before asking the system"
            exit 1
          fi
          if grep -q "CAPTURE PROBE: .*THREW" automation-platform.log; then
            echo "::error::a capture call threw"
            exit 1
          fi
          if grep -q "ScreenCaptureKit did not answer" automation-platform.log; then
            echo "::error::ScreenCaptureKit's answer did not arrive while the pump thread waited for it — on a macOS without the older functions, nothing would read the screen"
            exit 1
          fi
          if ! grep -q "ScreenCaptureKit captureImageInRect present" automation-platform.log; then
            echo "::warning::this runner's macOS has no captureImageInRect (older than 15.2), so the ScreenCaptureKit path was not exercised"
          fi
          echo "----- what served the captures -----"
          grep "screen capture paths\|screen captures are coming from\|ScreenCaptureKit refused\|first screen capture\|first capture for reading text\|CAPTURE PROBE:" automation-platform.log || true

  # The artifact above, run once on the newest macOS GitHub offers. Nothing is built here: this
  # is the very file a tester downloads.
  #
  # The next tester's Mac is new enough to run a macOS no build of this has met, and what that
  # risks does not compile away: whether the two older capture functions still exist there
  # (capture.rs looks them up by name and says which it found), whether ScreenCaptureKit answers
  # while the pump thread waits, whether a module or a speech call that works on 15 aborts on a
  # newer system. A separate job, so a red result here is a finding about that macOS rather than
  # a reason the download was not made.
  #
  # And on macOS 14, for the opposite reason: it is the one system here WITHOUT ScreenCaptureKit's
  # rectangle capture (that arrived in 15.2), so it is where every capture goes through the two
  # older functions looked up by name. Every other runner answers from ScreenCaptureKit and never
  # calls them — and the Mac mini the tester uses runs 14.5.
  newer-macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-macos
          path: artifact

      - name: Unpack it the way a tester does
        run: |
          sw_vers
          zip=$(find artifact -name '*.zip' | head -n1)
          [ -n "$zip" ] || { echo "::error::no zip in the artifact"; exit 1; }
          mkdir -p dist
          ditto -x -k "$zip" dist

      - name: Load, capture and speak, on the newer macOS
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          cd dist/AutomationPlatform
          # One launch per question, as in the build job: a fresh log each time, and the liveness
          # question asked before the kill, because every grep afterwards reads lines already
          # written.
          launch() {
            rm -f automation-platform.log
            AUTOMATION_PLATFORM_HEADLESS=1 \
              ./AutomationPlatform.app/Contents/MacOS/automation-platform "$@" &
            pid=$!
            for _ in $(seq 1 40); do
              if grep -q "$WAIT_FOR\|fatal:" automation-platform.log 2>/dev/null; then
                break
              fi
              sleep 1
            done
            alive=1
            kill -0 "$pid" 2>/dev/null || alive=0
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "----- automation-platform.log ($*) -----"
            cat automation-platform.log || true
            if [ "$alive" != 1 ]; then
              echo "::error::the application died on macOS $(sw_vers -productVersion) ($*)"
              exit 1
            fi
          }

          WAIT_FOR="listening for events"
          launch
          grep -q "listening for events" automation-platform.log \
            || { echo "::error::the event loop never started on the newer macOS"; exit 1; }
          if grep -q "did not load" automation-platform.log; then
            echo "::error::a module failed to load on the newer macOS"
            exit 1
          fi
          # The build as the downloaded zip names it. The build job reads build-info.txt from the
          # folder it zipped; this is the only place that reads it from the zip itself. A warning,
          # as there: a wrong build number is worth seeing, not worth a red mark.
          header=$(grep '\[host\] version' automation-platform.log | tail -n1 || true)
          echo "log header: $header"
          case "$header" in
            *", build $COMMIT"*) ;;
            *) echo "::warning::the downloaded package does not name this run's commit ($COMMIT) as its build: $header" ;;
          esac

          WAIT_FOR="CAPTURE PROBE: still alive"
          launch "$GITHUB_WORKSPACE/tools/capture-probe"
          grep -q "CAPTURE PROBE: still alive after capturing" automation-platform.log \
            || { echo "::error::the capture probe did not report back on the newer macOS"; exit 1; }
          if grep -q "ScreenCaptureKit did not answer" automation-platform.log; then
            echo "::error::ScreenCaptureKit did not answer while the pump thread waited, on the newer macOS"
            exit 1
          fi
          echo "----- what served the captures -----"
          grep "os macos\|screen recording:\|screen capture paths\|screen captures are coming from\|ScreenCaptureKit refused\|first screen capture\|first capture for reading text\|CAPTURE PROBE:" automation-platform.log || true

          WAIT_FOR="SPEECH PROBE: still alive"
          launch "$GITHUB_WORKSPACE/tools/speech-probe"
          grep -q "SPEECH PROBE: still alive after speaking" automation-platform.log \
            || { echo "::error::the speech probe did not report back on the newer macOS"; exit 1; }
