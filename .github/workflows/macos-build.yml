# Builds the macOS application on a real Mac, because nobody on the project has one.
#
# The macOS backend is written blind. `check-macos.ps1` type-checks it from Windows, which
# catches wrong signatures but never links — so a missing framework, a bad `#[link]`, or an
# undefined Carbon symbol would go unnoticed until a tester's first launch. This job is
# where those show up, and it is the reason the port can be developed at all without Apple
# hardware.
#
# It also produces the artifact a tester downloads: a zipped .app with the modules and a
# README beside it.
name: macOS build

# Deliberately narrow triggers, and the reason is money rather than taste.
#
# In a PRIVATE repository, Actions minutes come out of the account's monthly allowance and a
# macOS minute costs about ten Linux minutes ($0.062 against $0.006 at the January 2026
# prices). A Free plan's 2,000 included minutes are therefore around 200 minutes of macOS
# time a month — and the first build of this project compiles wxWidgets from source, which
# is the better part of that on its own. Public repositories pay nothing for standard
# runners, so this gets less delicate the moment the repo is public.
#
# So: automatic only when the macOS code itself changes, plus a button. Widening this back
# to every push is a decision about the month's budget, not a convenience.
on:
  push:
    branches: [main, master]
    paths:
      # Everything `crates/macos-check` borrows by #[path], and nothing else. That list is
      # the definition of "macOS code" in this repo, and it is easy to extend the borrow
      # and forget this — which is exactly what happened to the speech path: it shipped and
      # was never linked on a Mac, because the only job that links lives behind this list.
      - 'crates/host/src/backend/macos/**'
      - 'crates/host/src/speech/**'
      # Not borrowed by macos-check (it cannot be — wxdragon), but it carries a macOS
      # branch of its own now, and this job is the only place that ever compiles it.
      #
      # `crates/host/src/lib.rs` is deliberately NOT here, and the reasoning is worth keeping
      # so nobody has to redo it. It is the biggest file in the crate and changes on most
      # pushes, while a run of this job has cost anywhere between 1.6 and 15.7 minutes (the
      # spread is unexplained — a warm rust-cache is not a reliable predictor), so listing it
      # would spend a large and unpredictable share of the month's macOS minutes. What it buys
      # is small: lib.rs holds exactly ONE macOS-gated block against ten in gui.rs, and the
      # rest is plain Rust that compiles anywhere. When a change there touches something this
      # job actually exercises — module loading, or the headless path it runs modules through
      # — dispatch the job by hand. That is a real gap, chosen with the price in front of us
      # rather than overlooked.
      - 'crates/host/src/gui.rs'
      - 'crates/host/src/appcfg.rs'
      - 'crates/host/src/portable.rs'
      - 'crates/host/src/logging.rs'
      - 'crates/host/Cargo.toml'
      - 'crates/macos-check/**'
      # The Luau too, now that a Mac actually loads it: a module's macOS-only branch is
      # never executed anywhere else, so this job is its only gate.
      - 'modules/**'
      # And the dev tools, because this job packages one of them into the bundle and loads
      # it, and now runs a second by path. A job that does not watch what it runs is a gap
      # this repo has found three times: the documentation job and its Python checker, the
      # Windows job and its two probes, and now this one.
      - 'tools/**'
      - 'package-macos.sh'
      - '.github/workflows/macos-build.yml'
  # No inputs any more. There used to be a choice of Mac, which was really a choice of which
  # architecture the artifact would run on; a universal build makes the question go away.
  workflow_dispatch:

# A superseded run is wasted allowance.
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

# `actions: read` is for looking up the last successful run and downloading its build; see
# "Reuse the last build" below.
permissions:
  contents: read
  actions: read

jobs:
  build:
    # Intel by default, because the machine the build has to RUN on is Intel and an arm64
    # binary will not start there at all — Rosetta translates Intel code for Apple silicon,
    # never the other way round. Both labels are standard runners and both draw on the same
    # included minutes, so this is a choice about who can run the result, not about cost.
    #
    # A universal binary needs both slices and `lipo`, which means two runs; see
    # A UNIVERSAL app, so it runs natively on Apple silicon as well as on Intel.
    #
    # Built on an Apple-silicon runner with both slices cross-compiled there, rather than on
    # two machines with the halves posted between them. Three reasons, all checked:
    #
    #   * wxdragon-sys cross-compiles by design — build.rs reads CARGO_CFG_TARGET_ARCH and
    #     forces CMAKE_OSX_ARCHITECTURES, as a define AND in the environment so the nested
    #     wxWidgets configure inherits it. It even carries a workaround for a library name you
    #     only ever see when cross-building macOS, so somebody has run this.
    #   * The other assumed blocker is not there at all: `ort` sits under
    #     cfg(windows) in crates/host/Cargo.toml, so ONNX Runtime is never resolved for a Mac.
    #     macOS OCR is Apple Vision. Nothing per-architecture goes into the bundle but the
    #     executable itself, which is why one `lipo` makes the whole thing universal.
    #   * Intel runners have a published end date and are stated to be the last x86_64 images.
    #     A job that cross-builds Intel from arm outlives them without changing.
    #
    # And the direction matters for what gets EXECUTED: the smoke run below can only run the
    # runner's own architecture. On Intel it re-ran the slice that already worked; here it
    # runs arm64, which no machine has ever executed.
    runs-on: macos-15
    env:
      # The plist promises 12.0 and nothing has ever enforced it. rustc's default floor
      # differs per architecture, so without this the two slices would disagree with each
      # other and with the plist they ship inside.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      # Full history, because the reuse check below asks git what has changed since the commit
      # the last build was made from, and a shallow clone does not have that commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip the build when the Rust has not moved since the last one.
      #
      # Most pushes to this repository are Luau. They trigger this job — deliberately, because
      # a module's macOS-only branch runs nowhere else — and the job then compiles the whole
      # application to produce a binary that is byte-for-byte the one it produced last time.
      # On a warm cargo cache that is a couple of minutes; on a cold one it is wxWidgets from
      # source, which is the better part of a month's included macOS allowance.
      #
      # The question is deliberately NOT "did this push touch crates/". A push's own diff says
      # nothing about the Rust that changed in the pushes before it which did not trigger this
      # job at all — this workflow only fires on a narrow set of paths, so `lib.rs` can move
      # several times without ever being compiled here. What matters is whether anything under
      # `crates/` differs from the commit the reusable build was actually made from, and git
      # can answer exactly that.
      #
      # Every failure here falls through to building. A missing run, an expired artifact, an
      # unfamiliar layout: none of them are worth a red mark, and all of them are worth a
      # build.
      - name: Reuse the last build when the Rust has not moved
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          run_id=$(gh run list --workflow macos-build.yml --status success \
            --branch "${{ github.ref_name }}" --limit 1 --json databaseId \
            -q '.[0].databaseId' 2>/dev/null || true)
          if [ -z "${run_id:-}" ]; then echo "no earlier successful run"; exit 0; fi
          prev=$(gh run view "$run_id" --json headSha -q .headSha 2>/dev/null || true)
          if [ -z "${prev:-}" ]; then echo "cannot read that run's commit"; exit 0; fi
          if ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "commit $prev is not in this clone"; exit 0
          fi
          if ! git diff --quiet "$prev" HEAD -- crates Cargo.toml Cargo.lock package-macos.sh; then
            echo "the Rust has moved since $prev — building"
            git diff --name-only "$prev" HEAD -- crates Cargo.toml Cargo.lock package-macos.sh
            exit 0
          fi
          echo "no Rust change since $prev; trying to reuse its build"
          mkdir -p reuse
          gh run download "$run_id" --dir reuse --name AutomationPlatform-macos-universal             2>/dev/null || { echo "no universal artifact in that run"; exit 0; }
          zip=$(find reuse -name '*.zip' | head -n1)
          if [ -z "${zip:-}" ]; then echo "no zip in that artifact"; exit 0; fi
          mkdir -p dist
          ditto -x -k "$zip" dist || { echo "could not unpack it"; exit 0; }
          if [ ! -d dist/AutomationPlatform ]; then echo "unfamiliar layout"; exit 0; fi
          # The binary is the old one; the MODULES are this commit's, which is the whole point
          # of the run. Staged the same way package-macos.sh stages them.
          rm -rf dist/AutomationPlatform/modules
          mkdir -p dist/AutomationPlatform/modules
          for dir in modules/*/; do
            name=$(basename "$dir")
            [ -f "$dir/module.toml" ] || continue
            cp -R "$dir" "dist/AutomationPlatform/modules/$name"
            rm -rf "dist/AutomationPlatform/modules/$name/calibration"
          done
          # Re-zipped so the artifact a tester downloads carries today's modules rather than
          # the ones the binary happened to ship with.
          rm -f dist/*.zip
          (cd dist && ditto -c -k --sequesterRsrc --keepParent AutomationPlatform \
            "AutomationPlatform-macos-$(date +%Y-%m-%d)-modules.zip")
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "reused the build from $prev"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outputs.reused != 'true' 

      # wxWidgets is compiled from source by wxdragon's build script; it is by far the
      # longest part of the job, and it only changes when the dependency does.
      # Without this the wxWidgets build runs every time, and that is the expensive part.
      # Worth knowing: Actions evicts a cache after 7 days without a hit, so a job that only
      # runs once a month is always cold — budget for the full build, not the cached one.
      - uses: Swatinem/rust-cache@v2
        with:
          # Two slices means two wxWidgets compiles, and they land in different
          # per-target directories. Both are worth keeping.
          key: macos-wx-universal
        if: steps.reuse.outputs.reused != 'true'

      - name: Install build tools
        run: brew install ninja cmake
        if: steps.reuse.outputs.reused != 'true'

      - name: Point bindgen at the Xcode toolchain's libclang
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
        if: steps.reuse.outputs.reused != 'true'

      - name: Build both slices
        run: |
          for t in $TARGETS; do
            rustup target add "$t"
            cargo build --release --target "$t"
          done
        if: steps.reuse.outputs.reused != 'true'

      # The platform-independent logic — dependency ordering, key parsing, the bundle-path
      # rule — on a machine where the bundle-path rule is not hypothetical.
      - name: Test
        if: steps.reuse.outputs.reused != 'true'
        # Targeted deliberately. A bare `cargo test --release` would build a THIRD copy of
        # wxWidgets, into target/release, because that is a different output directory from
        # target/<triple>/release — roughly tripling the cold cost while looking like a
        # one-word step. arm64 because that is the slice this runner can also execute.
        run: cargo test --release --target aarch64-apple-darwin

      - name: Package
        run: ./package-macos.sh --universal
        if: steps.reuse.outputs.reused != 'true'

      # `package-macos.sh` prints `lipo -archs` and carries on regardless, so a half-universal
      # bundle would ship looking fine. This is the assertion it does not make.
      - name: It has to actually contain both
        run: |
          exe="dist/AutomationPlatform/Automation Platform.app/Contents/MacOS/automation-platform"
          [ -f "$exe" ] || exe=$(find dist -type f -name automation-platform | head -n1)
          archs=$(lipo -archs "$exe")
          echo "architectures: $archs"
          case "$archs" in
            *arm64*) ;; *) echo "no arm64 slice — this would not run natively on an M-series Mac" >&2; exit 1 ;;
          esac
          case "$archs" in
            *x86_64*) ;; *) echo "no x86_64 slice — this would not run on an Intel Mac" >&2; exit 1 ;;
          esac

      # Load every shipped module once, on a Mac, because nothing else ever does.
      #
      # `cargo check` compiles the macOS Rust; it cannot execute a line of Luau. And a
      # module's macOS-only branch — anything inside `host.os.is("macos")` — never runs on
      # the Windows machine this is written on, so a module can load cleanly there for weeks
      # and then fail on a tester's first launch. That is exactly what happened: the
      # sforzando VoiceOver probe called `onActivate` after the overlay was bound, which the
      # runtime rejects, and the first anyone knew of it was a remote crash log.
      #
      # Headless, so no window and no tray. Accessibility is not granted on a CI runner, and
      # this used to say the event loop would therefore refuse to start. It does start — the
      # log says `listening for events (headless)` and then `headless: running the
      # CoreFoundation run loop`, and the observation cache reports epochs afterwards. The
      # difference matters, because it means timers fire here and a module can be given real
      # work rather than merely being loaded. The step below is the first thing to use that.
      #
      # This one still asks a single question: did every module load.
      - name: Load the modules once, on a Mac
        run: |
          cd dist/AutomationPlatform
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform &
          pid=$!
          for _ in $(seq 1 40); do
            if grep -q "listening for events\|fatal:\|did not load" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          if grep -q "did not load" automation-platform.log; then
            echo "::error::a module failed to load on macOS"
            exit 1
          fi
          if ! grep -q "loading module:" automation-platform.log; then
            echo "::error::no module was even attempted — the smoke run proved nothing"
            exit 1
          fi

      # Speech, which is the one new subsystem a runner can actually exercise.
      #
      # Every accessibility call needs a TCC grant a runner does not have, so that half can
      # only be compiled here. Speaking needs no grant at all — and the macOS speech path was
      # rewritten from scratch (`avspeech.rs`, replacing `tts`) and has never run anywhere but
      # a build machine. Compiling proves the calls exist; it cannot prove the WIRING, which is
      # where the mistakes are: which voice a line is handed to, whether choosing one takes
      # effect, whether the list is even populated when somebody asks.
      #
      # It also stands between a blind tester and the worst outcome there is. On this objc2
      # version a selector that does not exist aborts the process instead of returning
      # nothing, so a wrong guess about when an API arrived does not degrade — it takes the
      # application with it, and he would get nothing at all out of a session.
      #
      # Loaded by path rather than from the bundle, deliberately: this must not ship. It
      # speaks on purpose, and an application that says something unprompted at every start-up
      # is exactly what this project does not do.
      - name: Speech, on a Mac
        run: |
          cd dist/AutomationPlatform
          rm -f automation-platform.log
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform \
            "$GITHUB_WORKSPACE/tools/speech-probe" &
          pid=$!
          for _ in $(seq 1 30); do
            if grep -q "SPEECH PROBE: done\|fatal:" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          # Three assertions, and the first matters most: reaching "done" at all means the
          # process was still alive after asking AVFoundation everything this platform asks it.
          if ! grep -q "SPEECH PROBE: done" automation-platform.log; then
            echo "::error::the speech probe never finished — the speech path did not survive a Mac"
            exit 1
          fi
          if ! grep -q "SPEECH PROBE: spoke through" automation-platform.log; then
            echo "::error::no voice was ever chosen on a machine with system voices installed"
            exit 1
          fi
          if grep -q "REFUSED\|THREW\|WHICH IS NOT WHAT WAS CHOSEN" automation-platform.log; then
            echo "::error::a speech call was refused, threw, or did not honour the choice"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          # Named by the machine it runs on, because the two are not interchangeable and a
          # download called "macos" that will not launch is a bad half hour for whoever
          # tries it.
          name: AutomationPlatform-macos-universal
          path: dist/*.zip
          if-no-files-found: error
