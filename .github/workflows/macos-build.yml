# Builds the macOS application on a real Mac, because nobody on the project has one.
#
# The macOS backend is written blind. `check-macos.ps1` type-checks it from Windows, which
# catches wrong signatures but never links — so a missing framework, a bad `#[link]`, or an
# undefined Carbon symbol would go unnoticed until a tester's first launch. This job is
# where those show up, and it is the reason the port can be developed at all without Apple
# hardware.
#
# It also produces the artifact a tester downloads: a zipped .app with the modules and a
# README beside it.
name: macOS build

# Deliberately narrow triggers, and the reason is money rather than taste.
#
# In a PRIVATE repository, Actions minutes come out of the account's monthly allowance and a
# macOS minute costs about ten Linux minutes ($0.062 against $0.006 at the January 2026
# prices). A Free plan's 2,000 included minutes are therefore around 200 minutes of macOS
# time a month — and the first build of this project compiles wxWidgets from source, which
# is the better part of that on its own. Public repositories pay nothing for standard
# runners, so this gets less delicate the moment the repo is public.
#
# So: automatic only when the macOS code itself changes, plus a button. Widening this back
# to every push is a decision about the month's budget, not a convenience.
on:
  push:
    branches: [main, master]
    paths:
      - 'crates/host/src/backend/macos/**'
      - 'crates/host/Cargo.toml'
      - 'crates/macos-check/**'
      - 'package-macos.sh'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

# A superseded run is wasted allowance.
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple silicon, which is what a tester in 2026 is overwhelmingly likely to have — and
    # the arm64 build is the one whose Retina coordinate handling we are least sure of.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # wxWidgets is compiled from source by wxdragon's build script; it is by far the
      # longest part of the job, and it only changes when the dependency does.
      # Without this the wxWidgets build runs every time, and that is the expensive part.
      # Worth knowing: Actions evicts a cache after 7 days without a hit, so a job that only
      # runs once a month is always cold — budget for the full build, not the cached one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-wx

      - name: Install build tools
        run: brew install ninja cmake

      - name: Point bindgen at the Xcode toolchain's libclang
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release

      # The platform-independent logic — dependency ordering, key parsing, the bundle-path
      # rule — on a machine where the bundle-path rule is not hypothetical.
      - name: Test
        run: cargo test --release

      - name: Package
        run: ./package-macos.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: AutomationPlatform-macos
          path: dist/*.zip
          if-no-files-found: error
