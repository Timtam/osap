# Builds the macOS application on a real Mac, because nobody on the project has one.
#
# The macOS backend is written blind. `check-macos.ps1` type-checks it from Windows, which
# catches wrong signatures but never links — so a missing framework, a bad `#[link]`, or an
# undefined Carbon symbol would go unnoticed until a tester's first launch. This job is
# where those show up, and it is the reason the port can be developed at all without Apple
# hardware.
#
# It also produces the artifact a tester downloads: one zip of a folder with the .app in it
# and the modules, the documentation and a README beside it.
#
# Not triggered on its own. `build.yml` calls this beside `windows-build.yml`, so one push is one
# run with both platforms' downloads in it. The trigger (and the history of why it is no longer
# a hand-kept list of "the macOS code": money was the reason, and it is gone) and the download's
# name live there, and so does the reason a newer push no longer cancels a superseded run. What
# remains is wall-clock, and this job runs beside the Windows one rather than ahead of it.
name: macOS build

on:
  workflow_call:
    # No choice of Mac any more. There used to be one on the manual trigger, which was really a
    # choice of which architecture the artifact would run on; a universal build makes the
    # question go away.
    inputs:
      artifact-prefix:
        description: 'automation-platform-<version>-<commit>, worked out by build.yml; this workflow adds -macos.zip'
        required: true
        type: string
      commit:
        description: 'the seven-character commit in that name, which the package README names as its build'
        required: true
        type: string

# `actions: read` is for looking up an earlier run and downloading its build; see "Reuse the
# last build" below. `build.yml` grants the same two to this call; asking here for more than
# it grants would stop the run before it starts.
permissions:
  contents: read
  actions: read

jobs:
  build:
    # Intel by default, because the machine the build has to RUN on is Intel and an arm64
    # binary will not start there at all — Rosetta translates Intel code for Apple silicon,
    # never the other way round. Both labels are standard runners and both draw on the same
    # included minutes, so this is a choice about who can run the result, not about cost.
    #
    # A universal binary needs both slices and `lipo`, which means two runs; see
    # A UNIVERSAL app, so it runs natively on Apple silicon as well as on Intel.
    #
    # Built on an Apple-silicon runner with both slices cross-compiled there, rather than on
    # two machines with the halves posted between them. Three reasons, all checked:
    #
    #   * wxdragon-sys cross-compiles by design — build.rs reads CARGO_CFG_TARGET_ARCH and
    #     forces CMAKE_OSX_ARCHITECTURES, as a define AND in the environment so the nested
    #     wxWidgets configure inherits it. It even carries a workaround for a library name you
    #     only ever see when cross-building macOS, so somebody has run this.
    #   * The other assumed blocker is not there at all. On a Mac `ort` is built with
    #     `load-dynamic` (crates/host/Cargo.toml): nothing of ONNX Runtime is compiled or linked
    #     into the executable, which opens the library at run time, and the library is
    #     Microsoft's own universal dylib, fetched below and put into the bundle as it is. macOS
    #     OCR is Apple Vision; that neural recogniser only reads beside it, for comparison. So the
    #     executable is still the one per-architecture thing that is BUILT, which is why one
    #     `lipo` makes the whole thing universal.
    #   * Intel runners have a published end date and are stated to be the last x86_64 images.
    #     A job that cross-builds Intel from arm outlives them without changing.
    #
    # And the direction matters for what gets EXECUTED: the smoke run below can only run the
    # runner's own architecture. On Intel it re-ran the slice that already worked; here it
    # runs arm64, which no machine has ever executed.
    runs-on: macos-15
    # Whether the executable was reused from an earlier run rather than built here; the text
    # recognition measurement below runs only for one built here (or in a run started by hand).
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    env:
      # The plist's floor (MIN_MACOS in package-macos.sh), which nothing else enforces. rustc's
      # default floor differs per architecture, so without this the two slices would disagree
      # with each other and with the plist they ship inside.
      MACOSX_DEPLOYMENT_TARGET: '12.3'
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      # Full history, because the reuse check below asks git what has changed since the commit
      # the last build was made from, and a shallow clone does not have that commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip the build when the Rust has not moved since the last one.
      #
      # Most pushes to this repository are Luau. They trigger this job — deliberately, because
      # a module's macOS-only branch runs nowhere else — and the job then compiles the whole
      # application to produce a binary that is byte-for-byte the one it produced last time.
      # On a warm cargo cache that is a couple of minutes; on a cold one it is wxWidgets from
      # source, which is the better part of a month's included macOS allowance.
      #
      # The question is deliberately NOT "did this push touch crates/". A push's own diff says
      # nothing about the Rust that changed in the pushes before it whose runs never produced a
      # build (one still building has uploaded nothing yet; a failed or cancelled one never
      # will), so `lib.rs` can move several times without ever being compiled here. What
      # matters is whether anything under `crates/` differs from the commit the reusable build
      # was actually made from, and git can answer exactly that.
      #
      # WHICH earlier build: the newest run of `build.yml` (the workflow that calls this one;
      # runs belong to the caller, never to this file) that still holds a macOS download. Not
      # the newest SUCCESSFUL run, which is what this asked while macOS was a workflow of its
      # own. A run is now Windows and macOS together, so a Windows test going red would make
      # the whole run a failure and send every later push back to a full macOS build, over a
      # Mac binary nothing was wrong with. The download is the better witness anyway: it is
      # uploaded only after the build, the tests, both slices, the module load and the speech
      # run have all passed, which is exactly what makes a build worth reusing. The steps
      # after it (the import check, the capture probe, newer-macos) run again on a reused
      # binary, so a finding of theirs is found again rather than hidden. Matched by its
      # ending, `-macos.zip`, because the name carries the version and commit of the run that
      # made it. Runs from before 2026-09-27 named it `-macos` and held a zip inside GitHub's.
      # Such a download is still recognised, so that the log says why it is not used, and then
      # built past rather than read: it was packaged without the documentation, by a
      # package-macos.sh that has changed since, and that change alone would send the check
      # below to a build.
      #
      # Every failure here falls through to building. A missing run, an expired artifact, an
      # unfamiliar layout: none of them are worth a red mark, and all of them are worth a
      # build.
      - name: Reuse the last build when the Rust has not moved
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -u
          # Newest first. This very run is on the list too. On its first attempt it has no macOS
          # download yet and is passed over like any other run without one. On a re-run it can
          # hold the one an earlier attempt uploaded, which is then reused: harmless, since it
          # was built from this same commit and passed the same checks, and the upload below
          # replaces it (`overwrite`).
          run_id="" artifact="" artifact_id=""
          for id in $(gh run list --workflow build.yml --branch "$BRANCH" --limit 20 \
              --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
              -q '[.artifacts[] | select(.expired | not) | select(.name | endswith("-macos.zip") or endswith("-macos"))] | first // empty | "\(.id) \(.name)"' \
              2>/dev/null || true)
            if [ -n "${found:-}" ]; then run_id=$id; artifact_id=${found%% *}; artifact=${found#* }; break; fi
          done
          if [ -z "$run_id" ]; then echo "no earlier run with a macOS download still in it"; exit 0; fi
          echo "the newest earlier macOS build is $artifact, from run $run_id"
          case "$artifact" in
            *-macos.zip) ;;
            *) echo "that is the older kind of download, a zip inside a zip without the documentation — building"; exit 0 ;;
          esac
          prev=$(gh run view "$run_id" --json headSha -q .headSha 2>/dev/null || true)
          if [ -z "${prev:-}" ]; then echo "cannot read that run's commit"; exit 0; fi
          if ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "commit $prev is not in this clone"; exit 0
          fi
          # tools/onnxruntime-mac.txt fixes the ONNX Runtime the bundle carries: another one is
          # another package, Rust or not.
          if ! git diff --quiet "$prev" HEAD -- crates Cargo.toml Cargo.lock package-macos.sh tools/onnxruntime-mac.txt; then
            echo "the Rust has moved since $prev — building"
            git diff --name-only "$prev" HEAD -- crates Cargo.toml Cargo.lock package-macos.sh tools/onnxruntime-mac.txt
            exit 0
          fi
          echo "no Rust change since $prev; trying to reuse its build"
          # The download as it was uploaded: the zip ditto made, unpacked here by ditto, the way it
          # was made. Fetched through the REST API rather than with `gh run download`, which
          # unpacks whatever it fetches with an unzip of its own: that one writes the extended
          # attributes ditto stored for the bundle out as loose `__MACOSX` files, and a symlink
          # as a file holding its target.
          mkdir -p reuse dist
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "reuse/$artifact" \
            2>/dev/null || { echo "could not download $artifact"; exit 0; }
          ditto -x -k "reuse/$artifact" dist || { echo "could not unpack it"; exit 0; }
          if [ ! -d dist/AutomationPlatform ]; then echo "unfamiliar layout"; exit 0; fi
          # Its Build: line is read and rewritten below, and under `bash -e` a missing file would
          # fail the job there rather than fall through to a build.
          if [ ! -f dist/AutomationPlatform/README.txt ]; then echo "that build has no README.txt"; exit 0; fi
          # Which commit the executable in it was built from. A package with a build-info.txt was
          # itself a reuse, and the file's `binary=` line names the executable's commit. One
          # without was built by the run that uploaded it, from that run's checkout, so its
          # executable is that run's commit; its README's Build: line says the same, and is asked,
          # because a package that does not say so is not one this job made the way it is
          # assumed here. Read before the file is rewritten below.
          info=dist/AutomationPlatform/build-info.txt
          if [ -f "$info" ]; then
            from=$(sed -n 's/^binary=//p' "$info" | head -n1)
            if [ -z "$from" ]; then echo "that build's build-info.txt names no executable (binary=)"; exit 0; fi
          else
            from="${prev:0:7}"
            if ! grep -qx "Build: $from" dist/AutomationPlatform/README.txt; then
              echo "that build's README does not name its run's commit $from as the build"; exit 0
            fi
          fi
          # The binary is the old one; the MODULES are this commit's, which is the whole point
          # of the run. Staged the same way package-macos.sh stages them.
          rm -rf dist/AutomationPlatform/modules
          mkdir -p dist/AutomationPlatform/modules
          for dir in modules/*/; do
            name=$(basename "$dir")
            [ -f "$dir/module.toml" ] || continue
            cp -R "$dir" "dist/AutomationPlatform/modules/$name"
            rm -rf "dist/AutomationPlatform/modules/$name/calibration"
          done
          # And the probe, which `package-macos.sh` stages separately because it lives under
          # tools/ rather than modules/. This loop did not, so every reused build shipped an
          # artifact advertising "today's modules" with the tester's ONLY instrument missing
          # from it — and nothing downstream said so, because the smoke run asserts that
          # modules loaded, not that this one did.
          if [ -d tools/probe ]; then
            cp -R tools/probe dist/AutomationPlatform/modules/probe
          fi
          # The documentation goes too: it is the earlier commit's. This commit's takes its place
          # once the site has been built ("The documentation, into the reused package" below), so
          # a reused download carries this run's documentation as it carries this run's modules.
          rm -rf dist/AutomationPlatform/docs
          # And the build it is: this run's commit, because the download is named for it and its
          # modules are its. The executable knows only its own, and the tester would quote a
          # build whose modules he does not have. So build-info.txt beside the .app names this
          # one, and the application gives it as the build, followed by the executable's own as
          # "binary built from"; the README says both. This is the one package that carries the
          # file. Beside the .app, so the signed bundle is untouched and stays the application
          # the tester has already granted permissions to. `binary=` is always written: the
          # application takes the file only when that line names the executable beside it, so
          # that a file left over from an older download unpacked over the folder names nothing.
          if [ "$from" = "$COMMIT" ]; then
            # The executable is this commit's own: a re-run of this run reusing what its first
            # attempt built, or a re-run of an older run that found a later run's package whose
            # executable it had built. It names this build itself, and the package needs no
            # file to say it. The README's Build: line is set back to this build alone, because
            # in the second case it is the later run's, naming the later build.
            rm -f "$info"
            sed -i '' "s/^Build: .*/Build: $COMMIT/" dist/AutomationPlatform/README.txt
          else
            printf '%s\n' \
              "# The commit this package was made from. Automation Platform reads it at start and names it" \
              "# in every session's header in automation-platform.log and in the title of its Modules window." \
              "# Its executable is an earlier build's, reused because no Rust had changed since:" \
              "commit=$COMMIT" \
              "binary=$from" > "$info"
            sed -i '' "s/^Build: .*/Build: $COMMIT (the application itself was built from $from)/" \
              dist/AutomationPlatform/README.txt
          fi
          grep '^Build: ' dist/AutomationPlatform/README.txt || echo "::warning::the reused README has no Build: line"
          # Not zipped here: "Zip the download" below zips whichever package this job ends up
          # with, once this commit's documentation is in it.
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "reused the build from $prev: the package is build $COMMIT, its executable was built from $from"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outputs.reused != 'true' 

      # wxWidgets is compiled from source by wxdragon's build script; it is by far the
      # longest part of the job, and it only changes when the dependency does.
      # Without this the wxWidgets build runs every time, and that is the expensive part.
      # Worth knowing: Actions evicts a cache after 7 days without a hit, so a job that only
      # runs once a month is always cold — budget for the full build, not the cached one.
      - uses: Swatinem/rust-cache@v2
        with:
          # Two slices means two wxWidgets compiles, and they land in different
          # per-target directories. Both are worth keeping.
          key: macos-wx-universal
        if: steps.reuse.outputs.reused != 'true'

      - name: Install build tools
        run: brew install ninja cmake
        if: steps.reuse.outputs.reused != 'true'

      - name: Point bindgen at the Xcode toolchain's libclang
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
        if: steps.reuse.outputs.reused != 'true'

      - name: Build both slices
        run: |
          for t in $TARGETS; do
            rustup target add "$t"
            cargo build --release --target "$t"
          done
        if: steps.reuse.outputs.reused != 'true'

      # The platform-independent logic — dependency ordering, key parsing, the bundle-path
      # rule — on a machine where the bundle-path rule is not hypothetical.
      - name: Test
        if: steps.reuse.outputs.reused != 'true'
        # Targeted deliberately. A bare `cargo test --release` would build a THIRD copy of
        # wxWidgets, into target/release, because that is a different output directory from
        # target/<triple>/release — roughly tripling the cold cost while looking like a
        # one-word step. arm64 because that is the slice this runner can also execute.
        run: cargo test --release --target aarch64-apple-darwin

      # The documentation ships inside the download and works offline from the folder, as it does
      # in the Windows one: the same site, built the same way, and turned into pages that work
      # from a folder by the same docs-offline.ps1, which package-macos.sh runs with the
      # runner's PowerShell 7. Built whether or not the executable is reused, because a reused
      # package's documentation is replaced with this commit's like its modules are. The
      # packaging would go on without it; "Zip the download" below is what refuses a download
      # that lacks it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build the documentation
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # ONNX Runtime for the neural text recogniser the package carries (package-macos.sh
      # --onnxruntime, crates/host/src/backend/paddle_ocr.rs): Microsoft's own universal build,
      # the archive tools/onnxruntime-mac.txt names — the one place its version, address, size
      # and checksum are fixed. Read here, so that the cache below is keyed by them; fetched and
      # checked in the step after it.
      #
      # None of the names here begins with ORT_: ort-sys's build script reads variables of that
      # shape, and one set by accident would change what the executable is built against.
      - name: Which ONNX Runtime the package carries
        id: onnxruntime-pin
        if: steps.reuse.outputs.reused != 'true'
        run: |
          pin=tools/onnxruntime-mac.txt
          # `tr -d '\r'`: the file is edited on Windows, and a value ending in a carriage return
          # would fail the size check below on an archive that is right.
          value() { sed -n "s/^$1=//p" "$pin" | tr -d '\r' | head -n1; }
          version=$(value version) archive=$(value archive) url=$(value url) size=$(value size) sha=$(value sha256)
          for v in version archive url size; do
            [ -n "${!v}" ] || { echo "::error::$pin has no $v= line"; exit 1; }
          done
          {
            echo "version=$version"
            echo "archive=$archive"
            echo "url=$url"
            echo "size=$size"
            echo "sha256=$sha"
            echo "key=onnxruntime-mac-$version-${sha:-unpinned}"
          } >> "$GITHUB_OUTPUT"
          echo "ONNX Runtime $version: $archive, $size bytes, sha256 ${sha:-(none)}"

      # The archive itself, kept between runs: 55 MB fetched from GitHub on every Rust build
      # otherwise. Keyed by the version and the checksum, so another pin is another archive.
      - name: Cache the ONNX Runtime archive
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: onnxruntime-mac/${{ steps.onnxruntime-pin.outputs.archive }}
          key: ${{ steps.onnxruntime-pin.outputs.key }}

      # Fetched when the cache had none, checked, unpacked, and asked what the package will carry:
      # both slices (the application is universal, and a slice the dylib lacks is a Mac on which
      # the recogniser does not load), the size, the macOS each slice is built for (`minos`), and
      # whether either slice imports a Core ML symbol strongly that macOS 13.3 does not have —
      # `MLComputePlan` and `MLOptimizationHints` are macOS 14.4 and later, and a strong import of
      # either would refuse the whole library below that, which is the opposite of what the 13.3
      # floor promises. Weak imports are fine: they resolve to nothing where they are missing.
      #
      # And the archive's SHA-256 against the one tools/onnxruntime-mac.txt pins: one that differs
      # is refused, and so is a pin file without one — the error then names the archive's own, for
      # a new version's pin (GitHub lists no digest for 1.22.0).
      - name: ONNX Runtime for the neural recogniser
        id: onnxruntime
        if: steps.reuse.outputs.reused != 'true'
        env:
          ONNXRUNTIME_MAC_ARCHIVE: ${{ steps.onnxruntime-pin.outputs.archive }}
          ONNXRUNTIME_MAC_URL: ${{ steps.onnxruntime-pin.outputs.url }}
          ONNXRUNTIME_MAC_SIZE: ${{ steps.onnxruntime-pin.outputs.size }}
          ONNXRUNTIME_MAC_SHA256: ${{ steps.onnxruntime-pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p onnxruntime-mac
          tgz="onnxruntime-mac/$ONNXRUNTIME_MAC_ARCHIVE"
          if [ -f "$tgz" ]; then
            echo "from the cache: $tgz"
          else
            curl -fsSL --retry 3 -o "$tgz" "$ONNXRUNTIME_MAC_URL"
          fi
          got_size=$(stat -f %z "$tgz")
          if [ "$got_size" != "$ONNXRUNTIME_MAC_SIZE" ]; then
            echo "::error::$ONNXRUNTIME_MAC_ARCHIVE is $got_size bytes, and tools/onnxruntime-mac.txt says $ONNXRUNTIME_MAC_SIZE"
            exit 1
          fi
          got_sha=$(shasum -a 256 "$tgz" | cut -d' ' -f1)
          if [ -z "$ONNXRUNTIME_MAC_SHA256" ]; then
            echo "::error::tools/onnxruntime-mac.txt pins no SHA-256 for $ONNXRUNTIME_MAC_ARCHIVE; this one is sha256=$got_sha — pin it there once it is known to be Microsoft's"
            exit 1
          elif [ "$got_sha" != "$ONNXRUNTIME_MAC_SHA256" ]; then
            echo "::error::$ONNXRUNTIME_MAC_ARCHIVE has SHA-256 $got_sha, and tools/onnxruntime-mac.txt says $ONNXRUNTIME_MAC_SHA256"
            exit 1
          fi
          rm -rf onnxruntime-mac/unpacked
          mkdir -p onnxruntime-mac/unpacked
          tar -xzf "$tgz" -C onnxruntime-mac/unpacked
          dir=$(find onnxruntime-mac/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1)
          lib="$dir/lib/libonnxruntime.dylib"
          [ -e "$lib" ] || { echo "::error::no lib/libonnxruntime.dylib in $ONNXRUNTIME_MAC_ARCHIVE"; find "$dir" -maxdepth 2; exit 1; }
          archs=$(lipo -archs "$lib")
          echo "architectures: $archs; size $(du -hL "$lib" | cut -f1)"
          for a in x86_64 arm64; do
            case " $archs " in
              *" $a "*) ;;
              *) echo "::error::ONNX Runtime has no $a slice ($archs): the recogniser would not load on those Macs"; exit 1 ;;
            esac
          done
          for a in x86_64 arm64; do
            echo "--- $a: the macOS it is built for"
            vtool -arch "$a" -show-build "$lib" 2>/dev/null | grep -E 'platform|minos|sdk' \
              || otool -arch "$a" -l "$lib" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' \
              || echo "(neither vtool nor otool said)"
            # The application does not open the library below the macOS it is built for, and
            # keeps that floor itself (RUNTIME_MACOS in crates/host/src/backend/paddle_ocr.rs):
            # another minos here is a floor to move there too.
            minos=$(vtool -arch "$a" -show-build "$lib" 2>/dev/null | awk '$1 == "minos" { print $2; exit }' || true)
            if [ -n "$minos" ] && [ "$minos" != 13.3 ]; then
              echo "::warning::the $a slice of ONNX Runtime is built for macOS $minos, and the application keeps 13.3 as its floor (RUNTIME_MACOS)"
            fi
            # Into a file, and searched there: `grep -q` stops reading at its first match, and
            # under pipefail a listing still being written into the pipe then fails the step
            # (SIGPIPE) for a library that has the symbol. Listed apart from the search, so that
            # an nm that fails fails the step rather than finding nothing; and the entry point the
            # application asks for has to be in what it listed, or the search below looked at the
            # wrong thing.
            listing="onnxruntime-mac/nm-$a.txt"
            nm -m -arch "$a" "$lib" > "$listing"
            grep -q '_OrtGetApiBase$' "$listing" \
              || { echo "::error::nm lists no OrtGetApiBase in the $a slice — the check below would prove nothing"; exit 1; }
            strong=$(grep -E '\(undefined\) external .*(MLComputePlan|MLOptimizationHints)' "$listing" || true)
            if [ -n "$strong" ]; then
              echo "$strong"
              echo "::error::the $a slice of ONNX Runtime imports a Core ML symbol of macOS 14.4 strongly — it would not load on macOS 13.3 to 14.3"
              exit 1
            fi
          done
          echo "dir=$PWD/$dir" >> "$GITHUB_OUTPUT"

      # With this run's commit as the build, which package-macos.sh writes into the README's
      # `Build:` line; the executable names the same commit, compiled into it. `--no-zip`,
      # because "Zip the download" below zips whichever package this job ends up with, under
      # the download's name. `--onnxruntime`: the neural recogniser goes in, with its licences.
      - name: Package
        env:
          COMMIT: ${{ inputs.commit }}
          ONNXRUNTIME_MAC_DIR: ${{ steps.onnxruntime.outputs.dir }}
        run: ./package-macos.sh --universal --commit "$COMMIT" --no-zip --onnxruntime "$ONNXRUNTIME_MAC_DIR"
        if: steps.reuse.outputs.reused != 'true'

      # The reuse step took the earlier build's documentation out; this puts this commit's in, by
      # the conversion package-macos.sh runs for a package it makes.
      - name: The documentation, into the reused package
        if: steps.reuse.outputs.reused == 'true'
        shell: pwsh
        run: ./docs-offline.ps1 -Out dist/AutomationPlatform/docs

      # `package-macos.sh` prints `lipo -archs` and carries on regardless, so a half-universal
      # bundle would ship looking fine. This is the assertion it does not make.
      - name: It has to actually contain both
        run: |
          exe="dist/AutomationPlatform/Automation Platform.app/Contents/MacOS/automation-platform"
          [ -f "$exe" ] || exe=$(find dist -type f -name automation-platform | head -n1)
          archs=$(lipo -archs "$exe")
          echo "architectures: $archs"
          case "$archs" in
            *arm64*) ;; *) echo "no arm64 slice — this would not run natively on an M-series Mac" >&2; exit 1 ;;
          esac
          case "$archs" in
            *x86_64*) ;; *) echo "no x86_64 slice — this would not run on an Intel Mac" >&2; exit 1 ;;
          esac

      # What a tester downloads: ONE zip, made here by ditto and uploaded as it is (see the upload
      # below), named for the download, e.g. automation-platform-0.1.0-865c4a3-macos.zip. ditto,
      # because it keeps what the bundle needs, permissions, symlinks and extended attributes,
      # so the signature still holds after unpacking (see the note on it in package-macos.sh).
      # It is the zip Finder's own Compress makes, so Archive Utility unpacks it with a
      # double-click.
      #
      # Made before the smoke runs below, which write their logs into this folder, and after
      # either path has staged it, so a reused package goes out with this commit's modules and
      # documentation rather than the ones its executable shipped with.
      #
      # The documentation is asserted here rather than in the packaging, which goes on without
      # it, as package.ps1 does: a download that quietly lacks what its README points at is not
      # what should leave this job.
      - name: Zip the download
        env:
          ZIP: ${{ inputs.artifact-prefix }}-macos.zip
        run: |
          if [ ! -f dist/AutomationPlatform/docs/index.html ]; then
            echo "::error::the package has no documentation (docs/index.html) — the Windows download has it, and so must this one"
            exit 1
          fi
          # What goes out, for the record: build-info.txt is among it only when the executable
          # was reused from an earlier run.
          ls -1 dist/AutomationPlatform
          rm -f dist/*.zip
          (cd dist && ditto -c -k --sequesterRsrc --keepParent AutomationPlatform "$ZIP")
          echo "wrote dist/$ZIP ($(du -sh "dist/$ZIP" | cut -f1))"
          # About 80 MB is what the download may grow to with ONNX Runtime in it (the maintainer,
          # 2026-10-02): more is worth seeing, never a reason to hold the download back.
          bytes=$(stat -f %z "dist/$ZIP")
          if [ "$bytes" -gt 80000000 ]; then
            echo "::warning::the macOS download is $bytes bytes, more than the 80 MB it was allowed to grow to"
          fi

      # Load every shipped module once, on a Mac, because nothing else ever does.
      #
      # `cargo check` compiles the macOS Rust; it cannot execute a line of Luau. And a
      # module's macOS-only branch — anything inside `host.os.is("macos")` — never runs on
      # the Windows machine this is written on, so a module can load cleanly there for weeks
      # and then fail on a tester's first launch. That is exactly what happened: the
      # sforzando VoiceOver probe called `onActivate` after the overlay was bound, which the
      # runtime rejects, and the first anyone knew of it was a remote crash log.
      #
      # Headless, so no window and no tray. Accessibility is not granted on a CI runner, and
      # this used to say the event loop would therefore refuse to start. It does start — the
      # log says `listening for events (headless)` and then `headless: running the
      # CoreFoundation run loop`, and the observation cache reports epochs afterwards. The
      # difference matters, because it means timers fire here and a module can be given real
      # work rather than merely being loaded. The step below is the first thing to use that.
      #
      # This one still asks a single question: did every module load. And, in passing, whether
      # the log names this run's build, which is what a tester's report will be matched by.
      - name: Load the modules once, on a Mac
        env:
          COMMIT: ${{ inputs.commit }}
          REUSED: ${{ steps.reuse.outputs.reused }}
        run: |
          cd dist/AutomationPlatform
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform &
          pid=$!
          for _ in $(seq 1 40); do
            if grep -q "listening for events\|fatal:\|did not load" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          # Same question as the speech step asks, and for the same reason: every check below
          # reads lines already written, so a process that aborted after writing them looks
          # exactly like one that finished.
          kill -0 "$pid" 2>/dev/null || {
            echo "::error::the application is no longer running — it died during the module smoke run"
            cat automation-platform.log || true
            exit 1
          }
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          if ! grep -q "listening for events" automation-platform.log; then
            echo "::error::the event loop never started — the run got no further than loading"
            exit 1
          fi
          if grep -q "did not load" automation-platform.log; then
            echo "::error::a module failed to load on macOS"
            exit 1
          fi
          if ! grep -q "loading module:" automation-platform.log; then
            echo "::error::no module was even attempted — the smoke run proved nothing"
            exit 1
          fi
          # Named, not counted. The probe is what a blind tester records a plug-in with, and
          # it is staged by a different line from every other module — so it is the one that
          # can go missing while everything else still loads and this step still passes.
          if ! grep -q "com.tool.probe" automation-platform.log; then
            echo "::error::the window probe is not in this build — the tester's instrument is missing"
            exit 1
          fi
          # The probe starts the game-controller watcher while it loads, so this padless runner
          # is where the GameController source failing to start — a panic in it is caught into
          # this line — would first show. (A missing selector aborts instead; the "no longer
          # running" check above is what catches that.)
          if grep -q "gamepad watcher failed" automation-platform.log; then
            echo "::error::the game-controller watcher did not start — see the gamepad lines above"
            exit 1
          fi
          # The build the tester will quote: this run's commit. The executable's own when this job
          # built it; when it was reused, the one build-info.txt beside the .app names, followed
          # by "(binary built from …)". A warning rather than a failure: a wrong build number is
          # worth seeing, not worth the download. `-modified` would mean the checkout had changed
          # before the compile: this run's checkout when it compiled, the earlier run's when it
          # reused that executable, and only in the first case does this checkout's status say
          # anything about it.
          header=$(grep '\[host\] version' automation-platform.log | tail -n1 || true)
          echo "log header: $header"
          case "$header" in
            *", build $COMMIT"*) ;;
            *) echo "::warning::the log does not name this run's commit ($COMMIT) as the build: $header" ;;
          esac
          case "$header" in
            *-modified*)
              if [ "$REUSED" = "true" ]; then
                echo "::warning::the reused executable was compiled from a checkout with uncommitted changes, in the run that built it: $header"
              else
                echo "::warning::the executable was compiled from a checkout with uncommitted changes: $header"
                git -C "$GITHUB_WORKSPACE" status --short || true
              fi ;;
          esac
          # App Translocation, asked of the real Security framework by name (portable.rs). Started
          # directly rather than through LaunchServices, this run is never translocated, so the
          # answer has to be a plain "no"; anything else means the lookup or the call did not work
          # on this macOS. A warning: the application runs either way, as it did before it asked.
          # `-m1`: the header and the [env] block both carry the line, and an annotation ends at
          # the first newline (not `| head`, which would keep the `||` from ever firing).
          if ! grep -q '\[host\] translocated: no$' automation-platform.log; then
            echo "::warning::the log does not say 'translocated: no': $(grep -m1 'translocated:' automation-platform.log || echo 'no translocated line at all')"
          fi

      # Speech, which is the one new subsystem a runner can actually exercise.
      #
      # Every accessibility call needs a TCC grant a runner does not have, so that half can
      # only be compiled here. Speaking needs no grant at all — and the macOS speech path was
      # rewritten from scratch (`avspeech.rs`, replacing `tts`) and has never run anywhere but
      # a build machine. Compiling proves the calls exist; it cannot prove the WIRING, which is
      # where the mistakes are: which voice a line is handed to, whether choosing one takes
      # effect, whether the list is even populated when somebody asks.
      #
      # It also stands between a blind tester and the worst outcome there is. On this objc2
      # version a selector that does not exist aborts the process instead of returning
      # nothing, so a wrong guess about when an API arrived does not degrade — it takes the
      # application with it, and he would get nothing at all out of a session.
      #
      # Loaded by path rather than from the bundle, deliberately: this must not ship. It
      # speaks on purpose, and an application that says something unprompted at every start-up
      # is exactly what this project does not do.
      - name: Speech, on a Mac
        run: |
          cd dist/AutomationPlatform
          rm -f automation-platform.log
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform \
            "$GITHUB_WORKSPACE/tools/speech-probe" &
          pid=$!
          for _ in $(seq 1 30); do
            if grep -q "SPEECH PROBE: still alive\|fatal:" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          # Asked BEFORE the kill, because this is the assertion the step is really for. Every
          # grep below is satisfied by lines already on disk, so an abort during the say left a
          # log indistinguishable from a healthy run — and an abort during the say is the one
          # failure this whole step exists to catch.
          kill -0 "$pid" 2>/dev/null || {
            echo "::error::the application is no longer running — it died during the speech probe"
            cat automation-platform.log || true
            exit 1
          }
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          # Three assertions, and the first matters most: reaching "done" at all means the
          # process was still alive after asking AVFoundation everything this platform asks it.
          if ! grep -q "SPEECH PROBE: still alive after speaking" automation-platform.log; then
            echo "::error::the speech probe did not report back after speaking — the process may have died in the AVFoundation call"
            exit 1
          fi
          if ! grep -q "SPEECH PROBE: spoke through" automation-platform.log; then
            echo "::error::no voice was ever chosen on a machine with system voices installed"
            exit 1
          fi
          if grep -q "REFUSED\|THREW\|WHICH IS NOT WHAT WAS CHOSEN" automation-platform.log; then
            echo "::error::a speech call was refused, threw, or did not honour the choice"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          # The zip itself, as the download: `archive: false` uploads the one file as it is,
          # and the artifact is then that file, named after it and downloaded as it. Uploaded
          # the ordinary way, GitHub zipped the zip again, and a tester got a zip inside a zip,
          # whose inner one macOS's own unarchiver did not unpack properly. Uploading the folder
          # instead is no way out: GitHub's zip does not keep permissions, so the executable
          # would arrive unable to run.
          #
          # Named for the version and the commit, e.g. automation-platform-0.1.0-865c4a3-macos.zip,
          # beside the run's -windows download of the same name. "Reuse the last build" above
          # finds earlier ones by that -macos.zip ending, and newer-macos below downloads this one
          # by its name, so it is not to be changed on its own.
          #
          # Just "macos", with no architecture. It used to be named by the machine it runs on,
          # because an Intel and an arm64 build are not interchangeable and a download called
          # "macos" that will not launch is a bad half hour for whoever tries it. This one is
          # universal, and "It has to actually contain both" above refuses it otherwise, so
          # there is one Mac download and it runs on either.
          #
          # `overwrite`, because the name belongs to the run, not to the attempt. The import
          # check and the capture probe below run after this upload and can go red on their
          # own; without it, "Re-run failed jobs" would stop here on the download the first
          # attempt left behind and never reach them again. `name` is what it deletes by, so
          # it is the file's name here too, although with `archive: false` the upload itself
          # takes the name from the file.
          path: dist/${{ inputs.artifact-prefix }}-macos.zip
          archive: false
          name: ${{ inputs.artifact-prefix }}-macos.zip
          if-no-files-found: error
          overwrite: true

      # The two capture steps run AFTER the upload, on purpose: either can go red on a finding
      # about the next Mac rather than about this build, and that must not also cost the download.
      #
      # `CGWindowListCreateImage` and `CGDisplayCreateImageForRect` are obsoleted in the macOS 15
      # SDK. capture.rs looks them up by name at run time instead of importing them, because an
      # import the running macOS no longer exports stops the application from launching at all —
      # before the log has a single line in it. This is the check that the lookup is the only
      # way in: one ordinary call to either, anywhere, and the import is back. And that ONNX
      # Runtime, which the application opens itself, is in the bundle and not among what the
      # executable links.
      - name: The binary imports nothing a supported macOS lacks, and links no ONNX Runtime
        run: |
          exe=dist/AutomationPlatform/AutomationPlatform.app/Contents/MacOS/automation-platform
          nm -u "$exe" > imports.txt
          if grep -E '_CG(WindowListCreateImage|DisplayCreateImageForRect)$' imports.txt; then
            echo "::error::the binary imports an obsoleted capture function — on a macOS that has dropped it, the application would not launch"
            exit 1
          fi
          # The same for what `ocr-bench` (backend/macos/ocr/bench.rs) uses from macOS 14 on: Core
          # ML's `MLAllComputeDevices` and its three device classes, and Vision's compute-stage
          # names. It looks the function up by name, the classes up in the runtime and the stage
          # names out of Vision's own answer, because an import of any of them would stop the
          # application from launching on macOS 12 and 13. One ordinary use, anywhere, and the
          # import is back.
          if grep -E '_MLAllComputeDevices$|_OBJC_CLASS_\$_ML(CPU|GPU|NeuralEngine)ComputeDevice$|_VNComputeStage(Main|PostProcessing)$' imports.txt; then
            echo "::error::the binary imports a Core ML or Vision symbol that macOS 12 and 13 do not have — there, the application would not launch"
            exit 1
          fi
          if ! grep -q '_CGPreflightScreenCaptureAccess$' imports.txt; then
            echo "::error::the import list does not even contain a capture function that IS called — the check above is not looking at the right binary"
            exit 1
          fi
          echo "neither obsoleted capture function is imported"
          # ONNX Runtime is opened by the application itself, at run time, from the bundle
          # (backend/paddle_ocr.rs); the executable must never name it among the libraries it
          # loads. It would, without anyone writing so: ort-sys asks pkg-config first even with
          # `load-dynamic` (its build.rs), and a Homebrew onnxruntime on a runner would be linked
          # in — and then the application would not start on any Mac without that file.
          # package-macos.sh refuses such an executable before anything is packaged, and so
          # before the upload; this asks the bundle that went out once more.
          if otool -L "$exe" | grep -i onnxruntime; then
            echo "::error::the executable links ONNX Runtime — it would not start on a Mac without that library; it must only open it at run time"
            exit 1
          fi
          # And what it opens has to be there: the dylib, with both slices, and the model.
          app=dist/AutomationPlatform/AutomationPlatform.app
          dylib="$app/Contents/Frameworks/libonnxruntime.dylib"
          if [ ! -f "$dylib" ] || [ ! -f "$app/Contents/Resources/ppocr-rec.onnx" ]; then
            echo "::error::the bundle lacks ONNX Runtime ($dylib) or the model (Contents/Resources/ppocr-rec.onnx): the neural recogniser would not load anywhere"
            ls -l "$app/Contents/Frameworks" "$app/Contents/Resources" || true
            exit 1
          fi
          archs=$(lipo -archs "$dylib")
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::the bundle's ONNX Runtime is not universal ($archs)"; exit 1 ;;
          esac
          echo "the executable does not link ONNX Runtime; the bundle carries it ($archs, $(du -h "$dylib" | cut -f1)) and the model ($(du -h "$app/Contents/Resources/ppocr-rec.onnx" | cut -f1))"

      # The one question about ScreenCaptureKit no document answers and a runner can: does its
      # completion handler arrive while the pump thread is the thread waiting for it? capture.rs
      # gives up after a deadline, so a "no" hangs nothing — it silently moves every capture onto
      # the older functions, which a newer macOS may not have. No Screen Recording grant is needed
      # to ask: a refusal comes back through the same handler an image does.
      - name: Screen capture, on a Mac
        run: |
          cd dist/AutomationPlatform
          rm -f automation-platform.log
          AUTOMATION_PLATFORM_HEADLESS=1 \
            ./AutomationPlatform.app/Contents/MacOS/automation-platform \
            "$GITHUB_WORKSPACE/tools/capture-probe" &
          pid=$!
          for _ in $(seq 1 40); do
            if grep -q "CAPTURE PROBE: still alive\|fatal:" automation-platform.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          alive=1
          kill -0 "$pid" 2>/dev/null || alive=0
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- automation-platform.log -----"
          cat automation-platform.log || true
          if [ "$alive" != 1 ]; then
            echo "::error::the application is no longer running — it died during the capture probe"
            exit 1
          fi
          if ! grep -q "CAPTURE PROBE: still alive after capturing" automation-platform.log; then
            echo "::error::the capture probe did not report back after capturing"
            exit 1
          fi
          # A call that raised says so first: it is not a callback that never came.
          if grep -q "CAPTURE PROBE: .*THREW" automation-platform.log; then
            echo "::error::a capture call threw: $(grep 'CAPTURE PROBE: .*THREW' automation-platform.log)"
            exit 1
          fi
          # The answers from the screen-capture thread: a snapshotAsync and a change wait, always
          # asked, and a text read of the snapshot taken on the pump when there is one. The probe
          # says how many came of how many were asked without raising; a missing one is a thread
          # that never called back. A snapshot that failed on the pump is its own error, not a
          # missing callback.
          if grep -q "CAPTURE PROBE: snapshot 200x60 returned nil" automation-platform.log; then
            echo "::error::the snapshot on the pump thread returned nil: $(grep 'CAPTURE PROBE: snapshot 200x60' automation-platform.log)"
            exit 1
          fi
          counts=$(grep -o "CAPTURE PROBE: snapshot callbacks [0-9]* of [0-9]* answered" automation-platform.log | head -n1 | awk '{print $5, $7}')
          set -- $counts
          if [ -z "$counts" ] || [ "$1" != "$2" ]; then
            echo "::error::a snapshot callback never came: $(grep 'CAPTURE PROBE: snapshot callbacks' automation-platform.log || echo 'no count at all')"
            exit 1
          fi
          if ! grep -q "screen capture paths on this macOS:" automation-platform.log; then
            echo "::error::no capture ever reached capture.rs — the probe's reads were refused before asking the system"
            exit 1
          fi
          if grep -q "ScreenCaptureKit did not answer" automation-platform.log; then
            echo "::error::ScreenCaptureKit's answer did not arrive while the pump thread waited for it — on a macOS without the older functions, nothing would read the screen"
            exit 1
          fi
          if ! grep -q "ScreenCaptureKit captureImageInRect present" automation-platform.log; then
            echo "::warning::this runner's macOS has no captureImageInRect (older than 15.2), so the ScreenCaptureKit path was not exercised"
          fi
          echo "----- what served the captures -----"
          grep "screen capture paths\|screen captures are coming from\|ScreenCaptureKit refused\|first screen capture\|first capture for reading text\|CAPTURE PROBE:" automation-platform.log || true

  # What Apple Vision's text recognition costs, measured by the download itself:
  # `automation-platform ocr-bench` reads fixed pictures it carries (crates/host/src/ocr/bench.rs,
  # docs/building-on-macos.md), and the real plug-in captures the package carries beside the
  # .app (`ocr-pictures`) — no screen capture, no window, no permission, no speech — and prints
  # what one pass costs under today's settings and under each variant, the neural recogniser
  # among them, what a whole read costs under each way of reading a small region, how many passes
  # a read makes, the first pass in a process and on a thread, a pass after idle, two at once, and
  # Vision beside the recogniser. Each section's table goes to the run's summary page as soon as
  # the section is done, and so do the closing lines, which name the cheapest way of reading
  # that reads every picture right; a leg that dies part-way still shows what it measured. The
  # whole output is kept as an artifact of its own per leg, to compare runs with
  # `gh run download`.
  #
  # Why: a tester's Intel MacBook Air (macOS 15) took 143 to 786 ms for a small read-out, against
  # 22 to 42 ms on Windows and 25 to 56 ms on a warm Mac mini M1. The arm64 runners are virtual
  # machines on Apple silicon, and whether Vision finds a Neural Engine in them is one of the
  # lines the benchmark prints. The Intel runner has none, like the Air, and it is the only place
  # CI ever EXECUTES the universal binary's x86_64 slice. None of them is a 10 W laptop, so what
  # to compare is each variant against `prod` in the same run, never milliseconds between
  # machines.
  #
  # A measurement, not a gate: a leg goes red only when the benchmark did not finish — the
  # executable died in it — or when the neural recogniser did not load although the bundle
  # carries it, the Mac's counterpart of package.ps1's check that DirectML is in the Windows
  # package, or when a process that loaded it ended by a signal or with a status other than 0
  # after its work: the run itself, one of its children ("at exit after reading" in the report),
  # or the exit backstop's line on standard error; a misread picture is a warning. Nothing is
  # built here: each leg unpacks the download and runs it, so it costs the run itself (168 s of it
  # idle on purpose) and the time to fetch and unpack the zip. 45 minutes, where the first run
  # took seven: the benchmark grew from ten
  # pictures to forty-one and from one way of reading to twelve, its sections are estimated at 20 to
  # 30 minutes on the Intel runner, and the first run of this size is what its rounds are set by.
  # Only for an executable this run built, because a reused one measured again shows runner noise
  # and nothing else, and in any run started by hand: on every build with Rust changes, the
  # maintainer's choice (TODO.md, "Text recognition on the Mac, measured").
  ocr-bench:
    needs: build
    if: needs.build.outputs.reused != 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # As in newer-macos below: the zip kept as the file it is, and unpacked by one ditto.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}-macos.zip
          path: artifact
          skip-decompress: true

      # `id`, so that the steps after the measurement still run when it went red — the short runs
      # without ONNX Runtime matter most when the recogniser did not load — but not when there is
      # nothing unpacked to run.
      - name: Unpack it the way a tester does
        id: unpack
        run: |
          zip=$(find artifact -type f | head -n1)
          [ -n "$zip" ] || { echo "::error::the download is empty"; exit 1; }
          mkdir -p dist
          ditto -x -k "$zip" dist
          # Said here, so that a download without the application is not later reported as a
          # benchmark that "did not finish".
          if [ ! -x dist/AutomationPlatform/AutomationPlatform.app/Contents/MacOS/automation-platform ]; then
            echo "::error::one unpacking of the download does not give the application, ready to run"
            find dist -maxdepth 3
            exit 1
          fi

      - name: Text recognition, measured
        env:
          LEG: ${{ matrix.os }}
        run: |
          cd dist/AutomationPlatform
          # The runner image, so that two runs of one leg can be told apart by it as well.
          runner="macOS $(sw_vers -productVersion) on $(uname -m), runner image ${ImageOS:-?} ${ImageVersion:-?}"
          echo "$runner"
          out="ocr-bench-$LEG.txt"
          # How a process ended, from its status in bash: one a signal ended is 128 and its number.
          ended() { if [ "$1" -gt 128 ]; then echo "died of signal $(( $1 - 128 ))"; else echo "ended with status $1"; fi; }
          # The real captures beside the .app, as the tester's script passes them.
          pictures=()
          [ -d ocr-pictures ] && pictures=(--pictures ocr-pictures)
          # Standard error through `tee`: into the log as it comes, so that it is there even when
          # the job's time limit stops the step, and into a file, so that it can be searched — the
          # children's messages land there too, and so would the exit backstop's line. Standard
          # output goes past the pipe on descriptor 3; the pipe's status is tee's (no pipefail
          # here), the run's own is the first in PIPESTATUS.
          err="ocr-bench-$LEG.stderr.txt"
          {
            ./AutomationPlatform.app/Contents/MacOS/automation-platform ocr-bench \
              "${pictures[@]}" --out "$out" --summary "$GITHUB_STEP_SUMMARY" 2>&1 >&3 3>&- | tee "$err" >&2
            status=${PIPESTATUS[0]}
          } 3>&1
          echo "CI: $runner" >> "$out"
          if ! grep -q '^OCR BENCH: done' "$out" 2>/dev/null; then
            echo "::error::the text recognition benchmark did not finish on $LEG ($(ended "$status"))"
            exit 1
          fi
          fail=0
          # Every process of the benchmark that loaded ONNX Runtime releases it before it ends
          # (backend/paddle_ocr.rs, `release`): 1.22's teardown in exit() aborts on an environment
          # still alive. The run's own end after its report is that teardown; its children's are in
          # the report ("at exit after reading", below), and the backstop says when exit() began
          # with the environment unreleased.
          if [ "$status" != 0 ]; then
            echo "::error::the benchmark finished its report on $LEG and then $(ended "$status") at exit (exit status $status) — the end of a process that loaded ONNX Runtime"
            fail=1
          fi
          if grep -q "ONNX Runtime's environment unreleased" "$err"; then
            echo "::error::a process of the benchmark on $LEG reached exit() with ONNX Runtime unreleased, and the backstop ended it: $(grep -m1 "ONNX Runtime's environment unreleased" "$err")"
            fail=1
          fi
          # A process that found a call still inside ONNX Runtime half a second into its release
          # ends without the teardown, cleanly, and says so: no fault of the end, but a call stuck.
          if grep -q '^OCR BENCH: ONNX Runtime could not be released' "$err"; then
            echo "::warning::a process of the benchmark on $LEG still had a call inside ONNX Runtime at its end: $(grep -m1 '^OCR BENCH: ONNX Runtime could not be released' "$err")"
          fi
          # Today's request misreading a picture, or Vision refusing it, is a finding about Vision
          # on this machine, not a reason to fail: the tables say which picture, and what was read
          # instead. Only prod's rows: a variant reading wrong is what the variants are there to show.
          # The engine table's prod row, one pass of today's request:
          if grep -qE '^\| prod \|.*(wrong|refused|\| no: )' "$out"; then
            echo "::warning::today's request read a picture wrong, or was refused, on $LEG — see the engine and pipeline tables"
          fi
          # And the pipeline's, a whole read as the application reads it — with the neural
          # recogniser where it loaded, as on Windows — judged as the closing lines judge it: every
          # picture with text exactly, text on one without any as invented, in the one line the
          # benchmark prints for it whatever the verdicts. Text the recogniser invents where Vision
          # reads nothing is Windows' behaviour too (ocr/merge.rs); the warning keeps it in sight.
          prod=$(sed -n "s/^OCR BENCH: pipeline | the application's reading (prod) //p" "$out" | head -n1)
          case "$prod" in
            ""|"reads every picture it read right") ;;
            *) echo "::warning::the application's reading on $LEG $prod" ;;
          esac
          # Which reading prod was on this leg, and what the ladder before it (old) made of the same
          # pictures: notes beside the warning, so that the annotations say what changed.
          sed -n 's/^OCR BENCH: pipeline | prod reads as the application does on this Mac: //p' "$out" | head -n1 \
            | while IFS= read -r line; do echo "::notice::$LEG: prod reads as $line"; done
          old=$(sed -n "s/^OCR BENCH: pipeline | the ladder before it (old) //p" "$out" | head -n1)
          if [ -n "$old" ]; then
            echo "::notice::$LEG: the ladder before it (old) $old"
          fi
          # The closing lines are on the summary page already; each goes to the run's annotations
          # as well, so that the one naming a way of reading is there even when the first says
          # that none does.
          grep '^OCR BENCH: closing' "$out" || true
          sed -n 's/^OCR BENCH: closing | //p' "$out" | while IFS= read -r line; do
            echo "::notice::$LEG: $line"
          done
          # The neural recogniser has to load wherever the bundle carries it: Microsoft builds it
          # for macOS 13.3, and every runner here is newer. "Not measured in this run" with the
          # library in the bundle is a library that does not load, a process that died trying —
          # or one that loaded it, read, and died at its exit, which the report says as "at exit
          # after reading" and which is a fault of the end, not of the loading.
          if [ -f AutomationPlatform.app/Contents/Frameworks/libonnxruntime.dylib ] \
            && grep -q '^OCR BENCH: paddle | the neural recogniser is not measured in this run' "$out"; then
            why=$(sed -n 's/^OCR BENCH: paddle | the neural recogniser is not measured in this run: //p' "$out" | head -n1)
            case "$why" in
              *"at exit after reading"*)
                echo "::error::the neural recogniser loaded and read on $LEG, and the process that loaded it then did not end cleanly: $why" ;;
              *)
                echo "::error::the neural recogniser did not load on $LEG although the bundle carries ONNX Runtime: $why" ;;
            esac
            fail=1
          fi
          # A first-pass child of the recogniser's that read and then died or hung at its exit is
          # the same fault; so is one killed by a signal before its answer — one that made the
          # environment, could not make the session and said "no", then aborted at exit, among
          # them. Not every child: a Vision probe that dies is a finding the probes are there for.
          first='^OCR BENCH: first passes \| neural recogniser.*(at exit after reading|died of signal)'
          if grep -qE "$first" "$out"; then
            echo "::error::a process that loaded the neural recogniser on $LEG did not end cleanly: $(grep -m1 -E "$first" "$out")"
            fail=1
          fi
          exit $fail

      # Only on macos-15, the arm64 leg: the two ways the neural recogniser is missing on a tester's
      # Mac, made on copies of the bundle, each signed again ad hoc as package-macos.sh signs one —
      # without ONNX Runtime at all, and with only its x86_64 half, which is in the bundle and which
      # this Mac's dlopen refuses. A short run of each has to finish and say the recogniser is not
      # available, with the reason: Vision reads alone then, and nothing else may change. Run even
      # when the measurement above went red, which is when they say the most.
      #
      # And a third copy, the evidence TODO.md asks for about a tester's download: the bundle as it
      # is, with only the library carrying the quarantine flag a browser sets. `--paddle-probe`
      # there has to come back — `ok`, or "not available" with the reason — within two minutes; a
      # Gatekeeper prompt on the runner's screen that held `dlopen` would not. That is a warning,
      # not a failure: it is about the next tester's Mac, not this build. An `ok` followed by a
      # signal or another status than 0 is a failure, as everywhere a process loaded the library;
      # the short runs load nothing of it, and have to end with 0 after "done" as well.
      - name: Without ONNX Runtime, with a half this Mac cannot load, and quarantined
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' && matrix.os == 'macos-15' }}
        run: |
          cd dist
          fail=0
          ended() { if [ "$1" -gt 128 ]; then echo "died of signal $(( $1 - 128 ))"; else echo "ended with status $1"; fi; }
          copy=copy-quarantined-onnxruntime
          rm -rf "$copy"
          mkdir -p "$copy"
          ditto AutomationPlatform/AutomationPlatform.app "$copy/AutomationPlatform.app"
          fw="$copy/AutomationPlatform.app/Contents/Frameworks/libonnxruntime.dylib"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$fw"
          xattr -p com.apple.quarantine "$fw" || true
          status=0
          # Bounded by perl's alarm, which outlives the exec: macOS has no `timeout`.
          perl -e 'alarm shift; exec @ARGV' 120 \
            "$copy/AutomationPlatform.app/Contents/MacOS/automation-platform" ocr-bench --paddle-probe \
            > ocr-bench-quarantined-onnxruntime.txt 2>&1 || status=$?
          echo "----- quarantined-onnxruntime (exit status $status) -----"
          cat ocr-bench-quarantined-onnxruntime.txt
          if ! grep -qE '^OCR BENCH: paddle probe \| (ok:|not available)' ocr-bench-quarantined-onnxruntime.txt; then
            echo "::warning::with only ONNX Runtime quarantined, --paddle-probe did not answer within 120 s (exit status $status): a tester's quarantined download may hold the recogniser's loading, or show a prompt"
          elif grep -q '^OCR BENCH: paddle probe | ok:' ocr-bench-quarantined-onnxruntime.txt && [ "$status" != 0 ]; then
            # It loaded and read; what follows is its end, which has to be as clean as the read.
            echo "::error::with only ONNX Runtime quarantined, --paddle-probe read and then $(ended "$status") at exit (exit status $status)"
            fail=1
          fi
          if grep -q "ONNX Runtime's environment unreleased" ocr-bench-quarantined-onnxruntime.txt; then
            echo "::error::with only ONNX Runtime quarantined, --paddle-probe reached exit() with ONNX Runtime unreleased, and the backstop ended it"
            fail=1
          fi
          # "Not available" ends with 1 by design, so its status says nothing about its end; an
          # abort does, after either answer: this process does nothing but ONNX Runtime.
          if grep -q 'libc++abi: terminating' ocr-bench-quarantined-onnxruntime.txt; then
            echo "::error::with only ONNX Runtime quarantined, --paddle-probe aborted: $(grep -m1 'libc++abi: terminating' ocr-bench-quarantined-onnxruntime.txt)"
            fail=1
          fi
          for kind in without-onnxruntime x86_64-onnxruntime; do
            copy="copy-$kind"
            rm -rf "$copy"
            mkdir -p "$copy"
            ditto AutomationPlatform/AutomationPlatform.app "$copy/AutomationPlatform.app"
            fw="$copy/AutomationPlatform.app/Contents/Frameworks/libonnxruntime.dylib"
            case "$kind" in
              without-onnxruntime) rm -f "$fw" ;;
              x86_64-onnxruntime)
                lipo "$fw" -thin x86_64 -output "$fw.thin"
                mv "$fw.thin" "$fw"
                codesign --force --sign - "$fw" ;;
            esac
            codesign --force --deep --sign - "$copy/AutomationPlatform.app"
            out="$PWD/ocr-bench-$kind.txt"
            status=0
            "$copy/AutomationPlatform.app/Contents/MacOS/automation-platform" ocr-bench --quick --quiet --out "$out" \
              || status=$?
            echo "----- $kind: what it said of the neural recogniser -----"
            grep -E '^OCR BENCH: (paddle \||probe \| paddle)' "$out" || true
            if ! grep -q '^OCR BENCH: done' "$out" 2>/dev/null; then
              echo "::error::a short benchmark run $kind did not finish ($(ended "$status"))"
              fail=1
              continue
            fi
            # Nothing of ONNX Runtime loads here, so nothing may go wrong at the end either.
            if [ "$status" != 0 ]; then
              echo "::error::a short benchmark run $kind finished its report and then $(ended "$status") at exit (exit status $status)"
              fail=1
            fi
            if ! grep -qE '^OCR BENCH: paddle \| the neural recogniser is not measured in this run: .*not available: .+' "$out"; then
              echo "::error::a short benchmark run $kind did not say that the neural recogniser is not available, and why"
              fail=1
            fi
          done
          exit $fail

      # The three copies' whole output, beside the leg's own: their `paddle` lines are in the log
      # above, and the rest of what the short runs measured is here.
      - uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.os == 'macos-15' }}
        with:
          name: ocr-bench-macos-15-copies
          path: |
            dist/ocr-bench-without-onnxruntime.txt
            dist/ocr-bench-x86_64-onnxruntime.txt
            dist/ocr-bench-quarantined-onnxruntime.txt
          if-no-files-found: ignore
          overwrite: true

      # The tester's script (package-macos.sh), on the one path that is harmless here: it looks
      # for a running application, starts the benchmark quietly with --help, and ends with a
      # sound. A script error, a misspelt zsh construct, would otherwise first show on the
      # tester's Mac. Waited for at most a minute: a runner without a sound device is not the
      # script's fault, so a hang in the sound is a warning.
      - name: The tester's script runs
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          cd dist/AutomationPlatform
          zsh measure-text-recognition.command --help > script.out 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            cat script.out
            echo "::warning::measure-text-recognition.command did not end within 60 s (the closing sound, on a runner with no sound device?)"
            exit 0
          fi
          rc=0
          wait "$pid" || rc=$?
          cat script.out
          if [ "$rc" != 0 ]; then
            echo "::error::measure-text-recognition.command failed with exit status $rc"
            exit 1
          fi
          grep -q 'ocr-bench \[--quick\]' script.out \
            || { echo "::error::measure-text-recognition.command did not pass --help through to ocr-bench"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # The whole output of one leg, to compare runs with `gh run download`. `archive: false`
          # uploads the file as it is, named after it, as the build job's download is.
          path: dist/AutomationPlatform/ocr-bench-${{ matrix.os }}.txt
          archive: false
          name: ocr-bench-${{ matrix.os }}.txt
          if-no-files-found: warn
          overwrite: true

  # The artifact above, run once on the newest macOS GitHub offers. Nothing is built here: this
  # is the very file a tester downloads.
  #
  # The next tester's Mac is new enough to run a macOS no build of this has met, and what that
  # risks does not compile away: whether the two older capture functions still exist there
  # (capture.rs looks them up by name and says which it found), whether ScreenCaptureKit answers
  # while the pump thread waits, whether a module or a speech call that works on 15 aborts on a
  # newer system. A separate job, so a red result here is a finding about that macOS rather than
  # a reason the download was not made.
  #
  # And on macOS 14, for the opposite reason: it is the one system here WITHOUT ScreenCaptureKit's
  # rectangle capture (that arrived in 15.2), so it is where every capture goes through the two
  # older functions looked up by name. Every other runner answers from ScreenCaptureKit and never
  # calls them — and the Mac mini the tester uses runs 14.5.
  newer-macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # By the file's name, which is the download's (see the upload in the build job). Kept as the
      # file it is: download-artifact unpacks anything served as a zip unless told not to, with an
      # unzip that keeps no permissions, and the executable would arrive unable to run. Saved
      # under the name the server gives it, or as `artifact` when it gives none, so the step
      # below takes whichever one file is there.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}-macos.zip
          path: artifact
          skip-decompress: true

      # One ditto, as Archive Utility's double-click is one unpacking: what comes out has to be
      # the folder itself, with the application, the documentation and nothing zipped inside.
      # `id`: the steps after it run whenever it did, so that a red one among them does not hide
      # what the others would have said.
      - name: Unpack it the way a tester does
        id: unpack
        run: |
          sw_vers
          ls -l artifact
          zip=$(find artifact -type f | head -n1)
          [ -n "$zip" ] || { echo "::error::the download is empty"; exit 1; }
          mkdir -p dist
          ditto -x -k "$zip" dist
          ls -1 dist/AutomationPlatform || true
          if [ ! -x dist/AutomationPlatform/AutomationPlatform.app/Contents/MacOS/automation-platform ]; then
            echo "::error::one unpacking of the download does not give the application, ready to run"
            find dist -maxdepth 3
            exit 1
          fi
          if find dist -maxdepth 2 -name '*.zip' | grep -q .; then
            echo "::error::there is a zip inside the download: $(find dist -maxdepth 2 -name '*.zip')"
            exit 1
          fi
          if [ ! -f dist/AutomationPlatform/docs/index.html ]; then
            echo "::error::the download has no documentation (docs/index.html)"
            exit 1
          fi
          # The signature is what a tester's granted permissions hang on, and ditto is what is
          # meant to keep it through the zip. An error, where it was a warning while the bundle
          # held nothing but the executable: an ad-hoc signed build that fails this still runs
          # here, but the bundle now carries ONNX Runtime, signed apart before the bundle, and a
          # nested library whose signature does not hold is one Apple silicon refuses to load.
          # Recorded here and made the job's error by the last step, so that the steps between
          # still say what loads, captures, speaks and recognises on this macOS.
          sig_ok=1
          codesign --verify --deep --strict dist/AutomationPlatform/AutomationPlatform.app || sig_ok=0
          echo "sig_ok=$sig_ok" >> "$GITHUB_OUTPUT"
          if [ -f dist/AutomationPlatform/build-info.txt ]; then
            echo "build-info.txt (the executable was reused from an earlier run):"
            cat dist/AutomationPlatform/build-info.txt
          fi

      - name: Load, capture and speak, on the newer macOS
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          cd dist/AutomationPlatform
          # One launch per question, as in the build job: a fresh log each time, and the liveness
          # question asked before the kill, because every grep afterwards reads lines already
          # written.
          launch() {
            rm -f automation-platform.log
            AUTOMATION_PLATFORM_HEADLESS=1 \
              ./AutomationPlatform.app/Contents/MacOS/automation-platform "$@" &
            pid=$!
            for _ in $(seq 1 40); do
              if grep -q "$WAIT_FOR\|fatal:" automation-platform.log 2>/dev/null; then
                break
              fi
              sleep 1
            done
            alive=1
            kill -0 "$pid" 2>/dev/null || alive=0
            # measure-text-recognition.command will not start while the application runs, and it
            # finds it by `pgrep -f` on the executable's path; asked here, where one does run.
            # `pgrep -x` is said beside it: it compares the process name, which macOS cuts to 16
            # characters, and "automation-platform" has 19.
            if [ "$alive" = 1 ] && [ -z "$PGREP_ASKED" ]; then
              PGREP_ASKED=1
              if pgrep -f 'AutomationPlatform\.app/Contents/MacOS/automation-platform' >/dev/null; then
                echo "pgrep -f finds the running application"
              else
                echo "::warning::pgrep -f does not find the running application — measure-text-recognition.command would start beside it"
              fi
              if pgrep -x automation-platform >/dev/null; then
                echo "pgrep -x automation-platform finds it as well"
              else
                echo "pgrep -x automation-platform does not find it (the process name is cut at 16 characters)"
              fi
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "----- automation-platform.log ($*) -----"
            cat automation-platform.log || true
            if [ "$alive" != 1 ]; then
              echo "::error::the application died on macOS $(sw_vers -productVersion) ($*)"
              exit 1
            fi
          }

          WAIT_FOR="listening for events"
          launch
          grep -q "listening for events" automation-platform.log \
            || { echo "::error::the event loop never started on the newer macOS"; exit 1; }
          if grep -q "did not load" automation-platform.log; then
            echo "::error::a module failed to load on the newer macOS"
            exit 1
          fi
          # The build as the downloaded package names it: the executable's own commit, or the one
          # build-info.txt names when the build job reused an earlier executable. The build job
          # asks the folder it zipped; this is the only place that asks the download itself. A
          # warning, as there: a wrong build number is worth seeing, not worth a red mark.
          header=$(grep '\[host\] version' automation-platform.log | tail -n1 || true)
          echo "log header: $header"
          case "$header" in
            *", build $COMMIT"*) ;;
            *) echo "::warning::the downloaded package does not name this run's commit ($COMMIT) as its build: $header" ;;
          esac
          # The App Translocation question on this macOS, as in the build job's module run: the
          # two Security framework functions are looked up by name, and this is where a macOS
          # that no longer has them would first say so.
          if ! grep -q '\[host\] translocated: no$' automation-platform.log; then
            echo "::warning::the log does not say 'translocated: no' on macOS $(sw_vers -productVersion): $(grep -m1 'translocated:' automation-platform.log || echo 'no translocated line at all')"
          fi

          WAIT_FOR="CAPTURE PROBE: still alive"
          launch "$GITHUB_WORKSPACE/tools/capture-probe"
          grep -q "CAPTURE PROBE: still alive after capturing" automation-platform.log \
            || { echo "::error::the capture probe did not report back on the newer macOS"; exit 1; }
          if grep -q "CAPTURE PROBE: snapshot 200x60 \(THREW\|returned nil\)" automation-platform.log; then
            echo "::error::the snapshot on the pump thread failed on the newer macOS: $(grep 'CAPTURE PROBE: snapshot 200x60' automation-platform.log)"
            exit 1
          fi
          # An asynchronous ask that raised is not counted as asked, so it is looked for here.
          if grep -q "CAPTURE PROBE: \(snapshotAsync\|change wait\|read of the snapshot\) THREW" automation-platform.log; then
            echo "::error::a snapshot call threw on the newer macOS: $(grep 'CAPTURE PROBE: .*THREW' automation-platform.log)"
            exit 1
          fi
          counts=$(grep -o "CAPTURE PROBE: snapshot callbacks [0-9]* of [0-9]* answered" automation-platform.log | head -n1 | awk '{print $5, $7}')
          set -- $counts
          if [ -z "$counts" ] || [ "$1" != "$2" ]; then
            echo "::error::a snapshot callback never came on the newer macOS: $(grep 'CAPTURE PROBE: snapshot callbacks' automation-platform.log || echo 'no count at all')"
            exit 1
          fi
          if grep -q "ScreenCaptureKit did not answer" automation-platform.log; then
            echo "::error::ScreenCaptureKit did not answer while the pump thread waited, on the newer macOS"
            exit 1
          fi
          echo "----- what served the captures -----"
          grep "os macos\|screen recording:\|screen capture paths\|screen captures are coming from\|ScreenCaptureKit refused\|first screen capture\|first capture for reading text\|CAPTURE PROBE:" automation-platform.log || true

          WAIT_FOR="SPEECH PROBE: still alive"
          launch "$GITHUB_WORKSPACE/tools/speech-probe"
          grep -q "SPEECH PROBE: still alive after speaking" automation-platform.log \
            || { echo "::error::the speech probe did not report back on the newer macOS"; exit 1; }

      # Whether the neural recogniser's library loads on this macOS: `ocr-bench --paddle-probe`
      # makes it from the bundle and reads one picture, and says `ok` or `not available` with the
      # reason, in one line (no window, no permission, no file). Microsoft builds ONNX Runtime 1.22
      # for macOS 13.3, so on both of these — 14, the oldest runner there is, and 26, the newest —
      # "not available" is an error: a finding about that macOS, as everything in this job is. So
      # is an `ok` from a process that then ends by a signal or with another status than 0.
      # Below 13.3 the application does not open it, and Vision reads alone; no runner is that
      # old, and whether 13.3 to 13.x loads it is not seen either (TODO.md).
      - name: The neural recogniser loads on this macOS
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          cd dist/AutomationPlatform
          if [ ! -f AutomationPlatform.app/Contents/Frameworks/libonnxruntime.dylib ]; then
            echo "::error::the download carries no ONNX Runtime (Contents/Frameworks/libonnxruntime.dylib)"
            exit 1
          fi
          status=0
          said=$(./AutomationPlatform.app/Contents/MacOS/automation-platform ocr-bench --paddle-probe 2>&1) || status=$?
          echo "$said"
          case "$said" in
            *"OCR BENCH: paddle probe | ok:"*) ;;
            *)
              echo "::error::the neural recogniser does not load on macOS $(sw_vers -productVersion) (exit status $status): $(printf '%s\n' "$said" | grep -m1 'paddle probe' || echo 'no probe line at all')"
              exit 1 ;;
          esac
          # It loaded and read. Its end has to be as clean: ONNX Runtime 1.22's teardown in exit()
          # aborts on an environment still alive, which the probe releases first (backend/
          # paddle_ocr.rs) — the first run with the library said "ok" here and then died of signal 6.
          case "$said" in
            *"ONNX Runtime's environment unreleased"*)
              echo "::error::--paddle-probe reached exit() with ONNX Runtime unreleased on macOS $(sw_vers -productVersion), and the backstop ended it"
              exit 1 ;;
          esac
          if [ "$status" != 0 ]; then
            if [ "$status" -gt 128 ]; then how="died of signal $(( status - 128 ))"; else how="ended with status $status"; fi
            echo "::error::the neural recogniser loaded and read on macOS $(sw_vers -productVersion), and then --paddle-probe $how at exit (exit status $status)"
            exit 1
          fi

      - name: The signature verified
        if: ${{ !cancelled() && steps.unpack.outputs.sig_ok == '0' }}
        run: |
          echo "::error::the application's signature does not verify after unpacking the download (codesign --verify --deep --strict, in the unpack step's log)"
          exit 1
