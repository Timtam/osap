# Builds the whole application on Windows and publishes what a tester downloads.
#
# The macOS job exists because nobody here has a Mac. This one exists for a different reason:
# the Windows build works on the developer's machine by definition, but three things about it
# are invisible there.
#
#   * `crates/prism-sys` compiles a C++ library from a vendored submodule, and its smoke tests
#     are the only thing standing between a lost linker flag and an application that starts,
#     exits 0, and says NOTHING. Until now those tests ran only where somebody ran them.
#   * The build depends on tools nobody declared: MSVC, the Windows SDK's midl.exe, the C++
#     ATL component, libclang. A machine that has them by accident cannot tell you that.
#   * `package.ps1` is what a tester actually receives, and it had been shipping two DLLs that
#     are no longer needed and a README that was no longer true. It is worth exercising.
#
# Measured on a stock `windows-latest` (which is currently the windows-2025-vs2026 image, the
# same one prism itself builds on): prism-sys alone, cold, from clone to green tests, 209 s.
# The rest of this job is wxWidgets, which wxdragon compiles from source and which the cache
# below exists for.
#
# Not triggered on its own. `build.yml` calls this beside `macos-build.yml`, so one push is one
# run with both platforms' downloads in it. The trigger (including why the dev tools under
# `tools/` are watched) and the download's name live there, and so does the reason a newer push
# does not cancel a run.
name: Windows build

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: 'automation-platform-<version>-<commit>, worked out by build.yml; this workflow adds -windows'
        required: true
        type: string
      commit:
        description: 'the seven-character commit in that name, which the package README names as its build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # NOT recursive: prism nests godot-cpp, 8 MB this configuration never builds.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      # wxWidgets is compiled from source by wxdragon's build script and is by far the longest
      # part of this job. Actions evicts a cache after 7 days without a hit, so a job that
      # only runs when these paths change can well be cold — budget for the full build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-wx

      # rust-cache deliberately does not keep a WORKSPACE crate's OUT_DIR, and prism-sys's
      # OUT_DIR is a 13 MB static library that takes half a minute to produce. Keyed on the
      # submodule's commit and the build script, which are the only two things that change it.
      - name: Cache the compiled prism
        uses: actions/cache@v4
        with:
          path: target/*/build/prism-sys-*/out
          key: prism-${{ hashFiles('.gitmodules', 'crates/prism-sys/build.rs') }}-${{ hashFiles('crates/prism-sys/vendor/include/prism.h') }}

      # Nothing else is arranged on purpose. If the build script cannot find midl.exe, ATL or
      # libclang on a stock image, that is worth failing over: it is exactly what a new
      # contributor would hit, and a green tick bought with setup steps they do not know about
      # would hide it.
      - name: Build
        run: cargo build --release

      # The whole suite, not just the host's. prism-sys's tests are the point of this job:
      # they assert the backend NAMES, because zero backends is a clean build and a mute
      # application, and nothing else in this repository can catch that.
      - name: Test
        run: cargo test --release -- --nocapture

      # A hole in the capability gate is silent by nature, which is why this is a job step and
      # not a unit test. `host.include` handed included files the UNGATED host table for as
      # long as includes existed and nothing ever failed, because every module that used the
      # route was entitled to what it reached; an adversarial review of an unrelated commit
      # found it. The defect was not inside a function but BETWEEN two of them — in which
      # table one handed the other — so only a real load of a real module can see it.
      - name: The capability gate still holds
        shell: pwsh
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          $env:AUTOMATION_PLATFORM_HEADLESS = '1'
          $log = 'target/release/automation-platform.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'target/release/automation-platform.exe' `
                 -ArgumentList "$PWD/tools/capability-probe" -PassThru
          for ($i = 0; $i -lt 40; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'HEADLESS TIMER' -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $log)) { throw 'the probe produced no log at all' }
          Get-Content $log
          $verdict = Select-String -Path $log -Pattern 'CAPABILITY PROBE:'
          if (-not $verdict) { throw 'the probe never reported a verdict — it did not run' }
          if ($verdict.Line -match 'HOLE') { throw "the capability gate is open: $($verdict.Line)" }
          # The probe reports this from inside a timer callback, so a missing line means
          # `host.timer` is dead headless — which is how both CI jobs were blind to
          # everything a real overlay does until 2026-09-03.
          if (-not (Select-String -Path $log -Pattern 'HEADLESS TIMER: fired' -Quiet)) {
            throw 'host.timer did not fire in headless mode — the event loop is not ticking'
          }
          # Which build the executable says it is: the commit compiled into it
          # (crates/app/src/main.rs), since neither target/release nor the package has a
          # build-info.txt beside it. It is the build a tester's log will name, and it should be
          # this run's, unmodified. A warning rather than a failure: a wrong build number is worth
          # seeing, not worth the download. `-modified` would mean something in the checkout
          # had changed before the executable was compiled; the status below says what.
          $header = Select-String -Path $log -Pattern '\[host\] version' | Select-Object -Last 1
          Write-Host "log header: $($header.Line)"
          if (-not $header -or $header.Line -notmatch ", build $env:COMMIT") {
            Write-Host "::warning::the executable does not name this run's commit ($env:COMMIT) as its build: $($header.Line)"
          } elseif ($header.Line -match '-modified') {
            Write-Host "::warning::the executable was compiled from a checkout with uncommitted changes: $($header.Line)"
            git status --short
            # Its exit code would be the step's, and this is only a diagnostic.
            $global:LASTEXITCODE = 0
          }

      # The instrument the macOS tester works with. It is not built here — it is Luau — so
      # nothing else would notice a syntax error in it, and he would find out by pressing the
      # key and getting nothing. Loading it is enough: `activate` runs, which is where every
      # `host.include` and every top-level statement is executed.
      - name: The probe still loads
        shell: pwsh
        run: |
          $env:AUTOMATION_PLATFORM_HEADLESS = '1'
          $log = 'target/release/automation-platform.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'target/release/automation-platform.exe' `
                 -ArgumentList "$PWD/tools/probe" -PassThru
          for ($i = 0; $i -lt 40; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '\[probe\] ready' -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $log)) { throw 'the probe produced no log at all' }
          Get-Content $log
          if (Select-String -Path $log -Pattern 'did not load' -Quiet) {
            throw 'the probe module did not load — the tester would press the key and get nothing'
          }
          if (-not (Select-String -Path $log -Pattern '\[probe\] ready' -Quiet)) {
            throw 'the probe loaded but never said it was ready'
          }
          # The probe starts the game-controller watcher, so this runner — which has no pad — is
          # where a dynamic XInput load or the gamepad thread's window failing would first show.
          # "0 pads" is the expected answer here.
          if (Select-String -Path $log -Pattern 'gamepad watcher failed' -Quiet) {
            throw 'the game-controller watcher did not start — see the gamepad lines above'
          }

      # Desktop duplication on the runner: a window painted in four known colours, read through
      # GDI and through duplication (crates/host/src/backend/dxgi.rs, `dxgi_live`).
      #
      # INFORMATIONAL for now, twice over: the test itself only fails on what would be our own
      # fault (a picture of the wrong size) and prints `::warning::` for everything the
      # environment decides, and the step may fail without failing the job. Whether GDI capture
      # works in this runner's session at all has never been seen (TODO.md, M19), nor whether
      # duplication works on its display adapter (M12). After a few green runs this becomes
      # an assertion.
      - name: Desktop duplication, live (informational)
        continue-on-error: true
        run: cargo test --release -p host dxgi_live -- --ignored --nocapture

      # The capture smoke module twice: as it is (GDI), and from a copy whose manifest asks for
      # desktop duplication — the whole path from the manifest through the resolution, the
      # bindings and the capture thread, in the real application. Informational like the step
      # above, for the same two reasons: the warnings say what would have failed.
      #
      # The probe's first reads come while duplication is still opening (device creation on a
      # cold runner may take seconds) and so go the standard way; its late reads, five seconds
      # on, are the ones that show duplication itself answered. Hence the wait for "late reads
      # done", and the warning when the log shows no read that duplication answered.
      - name: The capture probe, both ways (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:AUTOMATION_PLATFORM_HEADLESS = '1'
          $log = 'target/release/automation-platform.log'
          $dup = Join-Path $env:RUNNER_TEMP 'capture-probe-duplication'
          Remove-Item $dup -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item tools/capture-probe $dup -Recurse
          Add-Content (Join-Path $dup 'module.toml') "`n[screen]`ncapture = `"duplication`"`n"
          foreach ($run in @(@{ Name = 'standard'; Dir = "$PWD/tools/capture-probe" }, @{ Name = 'duplication'; Dir = $dup })) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath 'target/release/automation-platform.exe' -ArgumentList $run.Dir -PassThru
            for ($i = 0; $i -lt 40; $i++) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'CAPTURE PROBE: late reads done' -Quiet)) { break }
              Start-Sleep -Milliseconds 500
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "---- capture probe, $($run.Name) ----"
            if (-not (Test-Path $log)) { Write-Host "::warning::capture probe ($($run.Name)): no log at all"; continue }
            # Kept for the next step, which is not informational: the next run writes over $log.
            Copy-Item $log (Join-Path $env:RUNNER_TEMP "capture-probe-$($run.Name).log") -Force
            Get-Content $log | Select-String -Pattern 'CAPTURE PROBE|\[capture\]|\[pump\]' | ForEach-Object { $_.Line }
            if (-not (Select-String -Path $log -Pattern 'still alive after capturing' -Quiet)) {
              Write-Host "::warning::capture probe ($($run.Name)): it never said it was still alive after capturing"
            }
            if (-not (Select-String -Path $log -Pattern 'CAPTURE PROBE: late reads done' -Quiet)) {
              Write-Host "::warning::capture probe ($($run.Name)): it never finished its late reads"
            }
            if (Select-String -Path $log -Pattern 'CAPTURE PROBE:.*THREW' -Quiet) {
              Write-Host "::warning::capture probe ($($run.Name)): a capture call raised"
            }
            if (Select-String -Path $log -Pattern 'CAPTURE PROBE: snapshot 200x60 returned nil' -Quiet) {
              Write-Host "::warning::capture probe ($($run.Name)): the snapshot on the pump returned nil"
            }
            if (-not (Select-String -Path $log -Pattern 'CAPTURE PROBE: snapshot callbacks (\d+) of \1 answered' -Quiet)) {
              Write-Host "::warning::capture probe ($($run.Name)): a snapshot callback never came"
            }
            if (Select-String -Path $log -Pattern '\[pump\] one iteration took' -Quiet) {
              Write-Host "::warning::capture probe ($($run.Name)): the pump stalled"
            }
            if ($run.Name -eq 'duplication' -and -not (Select-String -Path $log -Pattern 'reads the screen through desktop duplication' -Quiet)) {
              Write-Host "::warning::capture probe (duplication): the log never says the module resolved to desktop duplication"
            }
            # Resolving to it is not reading through it: every read may still have fallen back.
            # Either line below is only written for a read duplication actually answered.
            $compared = Select-String -Path $log -Pattern 'first desktop duplication read compared with the standard way' -Quiet
            $counted = Select-String -Path $log -Pattern 'and [1-9][0-9]* desktop duplication read\(s\)' -Quiet
            if ($run.Name -eq 'duplication' -and -not ($compared -or $counted)) {
              Write-Host "::warning::capture probe (duplication): no read was answered through desktop duplication; every one fell back to the standard way"
            }
          }

      # No text recognition on the event loop (crates/host/src/loop_guard.rs): a release build
      # writes this line the first time a capture for a read or a recognition runs on the loop's
      # thread, where no call may make one. Not informational, unlike the probe above: the line is
      # a bug in the host whatever the runner can capture. Both runs' logs, kept by the step
      # above; a run without one has said so there.
      - name: Nothing recognised text on the event loop
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $found = $false
          foreach ($name in @('standard', 'duplication')) {
            $log = Join-Path $env:RUNNER_TEMP "capture-probe-$name.log"
            if (-not (Test-Path $log)) { Write-Host "::warning::no capture-probe log of the $name run to look at"; continue }
            $hit = Select-String -Path $log -Pattern '\[loop\] text recognition on the event loop' | Select-Object -First 1
            if ($hit) {
              Write-Host "::error::text recognition ran on the event loop ($name run): $($hit.Line)"
              $found = $true
            }
          }
          if ($found) { exit 1 }
          Write-Host "nothing recognised text on the event loop"

      # The guard (crates/host/src/vm_guard.rs, stops.rs): the capture probe's callbacks are
      # short, and its reads wait in their timers' handlers, which counts on no clock — so a
      # `[guard] [<module>] stopped` line is a bug, in the host or in the probe. So is a call that
      # could not wait and held the event loop instead (`could not wait here`, task.rs), and a
      # `recognize` that raised, which is what it does where it cannot wait: the probe makes every
      # call in a handler of its own, and a capture that failed is a reading, not a raise. A
      # reading the probe got "failed" is said: the runner may not have captured.
      - name: No module was stopped, and every call waited
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $found = $false
          foreach ($name in @('standard', 'duplication')) {
            $log = Join-Path $env:RUNNER_TEMP "capture-probe-$name.log"
            if (-not (Test-Path $log)) { Write-Host "::warning::no capture-probe log of the $name run to look at"; continue }
            $stop = Select-String -Path $log -Pattern '\[guard\] \[[^\]]*\] stopped' | Select-Object -First 1
            if ($stop) {
              Write-Host "::error::the guard stopped a module ($name run): $($stop.Line)"
              $found = $true
            }
            $held = Select-String -Path $log -Pattern 'could not wait here' | Select-Object -First 1
            if ($held) {
              Write-Host "::error::a call could not wait and held the event loop ($name run): $($held.Line)"
              $found = $true
            }
            $threw = Select-String -Path $log -Pattern 'CAPTURE PROBE: (late )?recognize .*THREW' | Select-Object -First 1
            if ($threw) {
              Write-Host "::error::a recognize in a handler raised instead of waiting ($name run): $($threw.Line)"
              $found = $true
            }
            $failed = Select-String -Path $log -Pattern 'CAPTURE PROBE:.*answered a failed reading' | Select-Object -First 1
            if ($failed) { Write-Host "::warning::the capture probe got a failed reading ($name run): $($failed.Line)" }
          }
          if ($found) { exit 1 }
          Write-Host "no module was stopped, and every call waited"

      # The documentation ships inside the artifact and works offline from the folder, so a
      # tester with no internet still has it. `package.ps1` packages without it rather than
      # failing — a tester without docs still has a working application — but an artifact that
      # quietly lacks what its own README points at is not what should leave here.
      #
      # The macOS job builds the same site the same way and runs the same conversion, so both
      # downloads carry the same pages.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build the documentation
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # With this run's commit as the build, which package.ps1 writes into the README's `Build:`
      # line. The executable names the commit compiled into it, which "The capability gate still
      # holds" above compared with this one, and the package carries no build-info.txt to say
      # otherwise. Checked, because the download's name promises it.
      - name: Package
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          ./package.ps1 -NoBuild -Commit $env:COMMIT
          if (-not (Select-String -Path dist/AutomationPlatform/README.txt -Pattern "^Build: $env:COMMIT$" -Quiet)) {
            throw "README.txt in the package does not say Build: $env:COMMIT"
          }

      # What a tester downloads. The same staging `package.ps1` produces locally, so a problem
      # in it shows up here rather than in somebody's hands.
      #
      # Named for the version and the commit, e.g. automation-platform-0.1.0-865c4a3-windows,
      # beside the run's -macos.zip download of the same name.
      #
      # The folder, which GitHub zips on the way up: one zip, with the folder's contents at its
      # top, and Explorer's "Extract all" puts them into a folder named after the download.
      # Nothing in it needs what GitHub's zip loses and the macOS download has to keep (Unix
      # permissions, a signed bundle's extended attributes), so it goes up as the folder rather
      # than as a zip made here and uploaded as it is, which is what the macOS job does.
      #
      # `overwrite`, because the name belongs to the run, not to the attempt: re-running this job
      # would otherwise stop right here on the download the first attempt already left in the
      # run, having built everything again for nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-windows
          path: dist/AutomationPlatform
          if-no-files-found: error
          overwrite: true

      # The neural recogniser measured on its own, as the Mac's plan asks of Windows: `ocr-bench
      # --paddle` reads every picture the executable carries and the real plug-in captures in
      # crates/host/bench-data/ocr/real with it alone, beside what Windows.Media.Ocr reads and what
      # Windows answers (docs/building-on-macos.md, "Measuring text recognition") — no window, no
      # capture, no hook, no speech; about 20 s. Started by Start-Process and waited for, because
      # the executable is a windowed one, which PowerShell would not wait for otherwise. The whole
      # output is uploaded below, named for the version and the commit like the downloads.
      #
      # A measurement, not a gate, and so after the download's upload, as the macOS job's capture
      # steps are: it goes red only when the run did not finish, and that must not also cost the
      # download. A picture that must be read and that the recogniser reads wrong is a warning —
      # for now: field-empty, mel-position and k8-voices are known to be, and the recogniser has no
      # detector, so what it makes of ink that is not text is in the output too. Ten minutes at
      # most, against the 20 seconds or so it takes: the job has no limit of its own but
      # GitHub's six hours, and nothing else would end a run that hangs.
      - name: The neural recogniser, measured
        shell: pwsh
        timeout-minutes: 10
        env:
          PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          $out = "$env:PREFIX-ocr-bench-windows-paddle.txt"
          $p = Start-Process -FilePath 'target/release/automation-platform.exe' -NoNewWindow -Wait -PassThru `
                 -ArgumentList @('ocr-bench', '--paddle', '--pictures', 'crates/host/bench-data/ocr/real', '--quiet', '--out', $out)
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no output file at all' }
          if (-not (Test-Path $out) -or -not (Select-String -Path $out -Pattern '^OCR BENCH: done' -Quiet)) {
            throw "ocr-bench --paddle did not finish (exit code $($p.ExitCode))"
          }
          $must = Select-String -Path $out -Pattern '^OCR BENCH: paddle \| small pictures that must be read: (.*)$' | Select-Object -First 1
          if (-not $must) {
            Write-Host "::warning::ocr-bench --paddle printed no line about the pictures that must be read"
          } elseif ($must.Line -notmatch 'wrong: none$') {
            Write-Host "::warning::the neural recogniser reads a picture that must be read wrong: $($must.Matches[0].Groups[1].Value)"
          }
          $invented = Select-String -Path $out -Pattern '^OCR BENCH: paddle \| pictures without text: (.*)$' | Select-Object -First 1
          if ($invented) { Write-Host "pictures without text: $($invented.Matches[0].Groups[1].Value)" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # The file as it is, named after itself (`archive: false`), as the macOS job keeps its
          # benchmark's output.
          path: ${{ inputs.artifact-prefix }}-ocr-bench-windows-paddle.txt
          archive: false
          name: ${{ inputs.artifact-prefix }}-ocr-bench-windows-paddle.txt
          if-no-files-found: warn
          overwrite: true
