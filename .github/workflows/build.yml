# One run per push, Windows and macOS side by side, and both downloads in that one run.
#
# The two platforms used to be two workflows, "Windows build" and "macOS build", each with its
# own trigger and so its own run. Every commit had two entries in the Actions tab, the pair of
# downloads for one version had to be found by matching commits between them, and sometimes
# there was no pair at all, because one path filter fired and the other did not. Now this file
# is the only thing a push triggers. It calls the two platform workflows as jobs of THIS run:
# both start once the naming job and the OCR decision below have finished (two small Linux jobs,
# side by side), and neither waits for the other.
#
# Called rather than copied into one file. Each platform's file is mostly the explanation of why
# its steps exist, and that stays next to the steps, in `windows-build.yml` and
# `macos-build.yml`. What the two now share is here: the trigger, the permissions, the name
# the downloads carry and whether the run measures text recognition. Neither file triggers on
# its own any more. A manual run is this workflow's "Run workflow" button, and it builds both.
name: Build

# Whenever anything either platform builds, loads or packages changes. This is the union of the
# two lists the separate workflows had, so a change that only one platform uses (a packaging
# script, say) now builds both. That is deliberate: every run that succeeds carries both
# downloads.
#
# The macOS half used to watch a hand-kept list of "the macOS code", and the reason was money
# rather than taste. In a private repository Actions minutes come out of the account's monthly
# allowance and a macOS minute costs about ten Linux minutes; a Free plan's 2,000 included
# minutes are around 200 minutes of macOS time a month, and this project's first build compiles
# wxWidgets from source. That list cost what such lists always cost: the speech path shipped
# and was never linked on a Mac, because the only job that links lived behind it, and
# `crates/host/src/lib.rs` (where every Lua binding is declared) was left out on purpose, with
# the note that a change there needed a hand-dispatched run somebody would have to remember.
# Public repositories pay nothing for standard runners, so the reason is gone and so is the
# list (since 2026-09-12).
on:
  push:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'modules/**'
      # The dev tools the jobs LOAD, not only the code they compile. Watching what a job runs is
      # not automatic: the documentation job ran a Python checker it did not watch until
      # 2026-09-03, and the Windows job had the same gap. `tools/capability-probe` is its gate,
      # `tools/probe` is the only instrument the macOS tester has, and `tools/capture-probe` and
      # `tools/speech-probe` are what the smoke steps load. A syntax error in any of them would
      # ship unnoticed and cost him a session.
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.ps1'
      - 'package-macos.sh'
      # Both packaging scripts run it to put the documentation into the downloads, so it is
      # watched like them.
      - 'docs-offline.ps1'
      - '.github/workflows/build.yml'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:
    # Off unless ticked: a run started by hand measures text recognition only when asked to. See
    # the `ocr` job below.
    inputs:
      ocr-bench:
        description: 'Measure text recognition: the macOS ocr-bench legs and the Windows ocr-bench --paddle step'
        type: boolean
        default: false

# No concurrency group, on purpose: every push runs to the end, so every commit that builds gets
# both downloads, even when the next push lands while it is still building. The macOS workflow used
# to cancel a superseded run to save allowance, which a public repository no longer spends; with
# both platforms in one run, that cancel would now take the Windows download with it too.
# `cancel-in-progress: false` would not help either: a group holds at most one waiting run, and
# a newer push replaces the one that waits.
#
# If a group is ever wanted, it goes here or on a calling job below, never inside the two called
# files. They see THIS run's `github` context, so a group there is not per-platform the way it
# reads, and one equal to a group of this run's would cancel the run it belongs to.

# The least a job needs. The macOS job is given one more below; a called workflow can only
# narrow what its caller grants, never widen it.
permissions:
  contents: read

jobs:
  # The name both downloads carry: automation-platform-<version>-<commit>-windows and
  # automation-platform-<version>-<commit>-macos.zip (the macOS download is the zip file itself,
  # see its upload in macos-build.yml, and is named after it). Worked out once, here, so the two
  # cannot disagree, and handed to each platform as the part before its suffix.
  #
  # The version is the application's, from crates/app/Cargo.toml, the package that builds the
  # executable. Neither packaging script reads a version (both take one as an argument and fall
  # back to the date), and it is written down in three more places that nothing keeps in step:
  # the log's `version` line is the host crate's, the Info.plist that package-macos.sh writes
  # falls back to a fixed version (this run does not pass one), and the Windows application
  # manifest has its own. Each is compared, and a disagreement is said out loud: it would mean a
  # download named one version whose application says another.
  #
  # The commit is the first seven characters of the one this run builds. Seven, not whatever
  # `git rev-parse --short` would choose, so the name has one shape from run to run.
  #
  # The same seven characters are also handed over on their own, as `commit`: both packaging
  # scripts write them into the package's README as its `Build:` line, and the application
  # names the same build in its log header and its window title, from the commit compiled into
  # it, so a report can be matched to the download it came from. They matter most on macOS,
  # where the job may reuse an earlier run's executable; the executable then knows only its own
  # commit, and the job writes this one into a build-info.txt beside the .app, which the
  # application names instead.
  version:
    name: Name the downloads
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.name.outputs.prefix }}
      commit: ${{ steps.name.outputs.commit }}
    steps:
      # Only the four files a version is written in: this job reads them and nothing else, and
      # both platform jobs are waiting for it.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            crates/app/Cargo.toml
            crates/host/Cargo.toml
            crates/app/windows/automation-platform.exe.manifest
            package-macos.sh
          sparse-checkout-cone-mode: false

      - name: Read the version
        id: name
        run: |
          set -eu
          version() {
            python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$1"
          }
          app=$(version crates/app/Cargo.toml)
          # Refused here rather than at the upload, which rejects a name with `:` or `/` in it but
          # says so only after both platforms have built. `version.workspace = true`, for one,
          # reads back as a table, not a version.
          case "$app" in
            ''|*[!A-Za-z0-9.+-]*)
              echo "::error::crates/app/Cargo.toml's version '$app' cannot go into a download's name"
              exit 1 ;;
          esac
          host=$(version crates/host/Cargo.toml)
          if [ "$app" != "$host" ]; then
            echo "::warning::crates/app/Cargo.toml says $app but crates/host/Cargo.toml says $host. The downloads are named $app; the application's log will say $host."
          fi
          # What Finder shows as the Mac app's version: the fallback in package-macos.sh's
          # Info.plist, since this run calls it without --version.
          plist=$(sed -n 's/.*CFBundleShortVersionString<\/key><string>\${version:-\([^}]*\)}.*/\1/p' package-macos.sh)
          if [ "$plist" != "$app" ]; then
            echo "::warning::package-macos.sh writes '$plist' into the Info.plist as the app's version, but the downloads are named $app."
          fi
          # Four numbers, so 0.1.0 is 0.1.0.0, and a pre-release or build suffix has no place in it.
          manifest=$(python3 -c 'import sys, xml.etree.ElementTree as E; print(E.parse(sys.argv[1]).getroot().find("{urn:schemas-microsoft-com:asm.v1}assemblyIdentity").get("version"))' \
            crates/app/windows/automation-platform.exe.manifest) || manifest="(unreadable)"
          if [ "$manifest" != "${app%%[-+]*}.0" ]; then
            echo "::warning::crates/app/windows/automation-platform.exe.manifest gives the assembly version '$manifest', but the downloads are named $app."
          fi
          commit="${GITHUB_SHA:0:7}"
          prefix="automation-platform-$app-$commit"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "this run's downloads: $prefix-windows and $prefix-macos.zip, both build $commit"

  # Whether this run measures text recognition: the macOS job `ocr-bench`, three Macs for up to
  # 45 minutes each, and the Windows build's `ocr-bench --paddle` step. Decided once, here, and
  # handed to both platforms as their `ocr-bench` input, so that the two cannot disagree.
  #
  # Until 2026-10-18 the Macs measured on every build with Rust changes and in every run started
  # by hand, and Windows on every build. Since then (the maintainer's choice: faster builds) a
  # run measures only when something the measurements run has changed, and a run started by hand
  # only when its `ocr-bench` box is ticked. A push is judged by its own commits, before..after,
  # against the list below. When they cannot be compared — a new branch, a force push, a `before`
  # this clone does not have, git failing — the run measures, and says why: a skip is only ever
  # because nothing on the list changed.
  #
  # The macOS job keeps its own rule beside this one: on a push it measures only an executable
  # it built, never one reused from an earlier run (macos-build.yml, the `ocr-bench` job).
  ocr:
    name: Decide on the OCR measurements
    runs-on: ubuntu-latest
    outputs:
      measure: ${{ steps.decide.outputs.measure }}
    steps:
      # Every commit, so that the push's `before` is there to compare with, and no file's content:
      # a sparse checkout fetches without blobs, and the only ones read, Cargo's, are fetched when
      # `git show` asks for them. The one file checked out is there because a checkout needs one.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.ocr-bench }}
          BEFORE: ${{ github.event.before }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -u
          # What the two measurements run, the only place this is written down. A change to a
          # file under any of these measures. Left out on purpose: the screen capture paths, since
          # both read pictures and capture nothing; lib.rs's `ocr_bench`, which only forwards to
          # the backend's; and the small helpers outside OCR they call: build_info.rs (the
          # header), portable.rs (the output file's folder) and the sysctl reads in
          # backend/macos/perm.rs (the machine).
          measured=(
            # The bench's pictures, statistics and report (ocr/bench.rs), and the reading it
            # measures as the application's own: the ladder, the policy, the crop, the merge, the
            # plan, the costs and the neural recogniser's pre-processing.
            crates/host/src/ocr
            # Vision, the Mac's recogniser, and the Vision half of the bench, a child of ocr.rs.
            crates/host/src/backend/macos/ocr.rs
            crates/host/src/backend/macos/ocr
            # The neural recogniser on both platforms, and the half of the bench that is
            # `--paddle` and `--paddle-probe`.
            crates/host/src/backend/paddle_ocr.rs
            crates/host/src/backend/paddle_ocr
            # Windows.Media.Ocr, which `--paddle` reads beside the neural recogniser
            # (`bench_system_read`, `recognize_image`, `run_ocr`, `tighten`). The whole Windows
            # backend's file, since a path cannot name a function: most changes to it are not the
            # recogniser's, and measure all the same.
            crates/host/src/backend/windows.rs
            # The subcommand's way in on both platforms (`ocr_bench`, `ocr_bench_paddle`), and
            # its way out: `release_ocr` and `end_now` decide how a process of the bench ends, and
            # so whether a leg goes red. The whole file again, for the same reason.
            crates/host/src/backend/mod.rs
            # `ocr-bench`, main's first subcommand, and the `exit` it ends by.
            crates/app/src/main.rs
            # The drawn pictures built into the executable, and the real plug-in captures with
            # their manifest, which both platforms read from the repository's copy.
            crates/host/bench-data/ocr
            # The neural recogniser's model and dictionary, built into the executable.
            crates/host/models
            # The ONNX Runtime the Mac's bundle carries, which the bench loads there.
            tools/onnxruntime-mac.txt
            # What puts that library, the model, `ocr-pictures` and the tester's
            # measure-text-recognition.command (which the macOS job runs with --help) into the
            # download the Macs measure.
            package-macos.sh
            # The two measurements' own steps.
            .github/workflows/macos-build.yml
            .github/workflows/windows-build.yml
          )
          # And the crates they are built from, by name. A change to one's entry in Cargo.lock
          # (its version, source or checksum) or in any Cargo.toml's dependencies measures; any
          # other dependency's does not. So does any change to the workspace's [profile] tables,
          # which decide how the measured executable is compiled.
          packages=(
            ort ort-sys          # the neural recogniser's binding, and the ONNX Runtime Windows downloads with it
            ndarray              # its tensors
            image png            # the pictures, decoded
            objc2-vision         # Vision
            objc2-core-ml        # the compute devices Vision is asked about
            objc2-core-graphics  # the CGImage Vision is handed
            windows              # Windows.Media.Ocr, and the bitmap it is handed
          )

          decide() {
            echo "measure=$1" >> "$GITHUB_OUTPUT"
            echo "OCR measurements: $2"
            echo "OCR measurements: $2" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$ASKED" = true ]; then
              decide true "measuring: asked by hand"
            else
              decide false "not measuring: not asked (a run started by hand measures only with its ocr-bench box ticked)"
            fi
            exit 0
          fi
          # Nothing else starts this workflow today; whatever does one day has no push to compare.
          cannot() { decide true "measuring: could not compare ($1)"; exit 0; }
          [ "$EVENT" = push ] || cannot "started by $EVENT, not a push"
          case "$BEFORE" in
            *[!0]*) ;;
            *) cannot "the push has no before: a new branch" ;;
          esac
          [ "$CREATED" != true ] || cannot "the push created the branch"
          [ "$FORCED" != true ] || cannot "a force push: its before is not the after's past"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || cannot "the push's before, $BEFORE, is not in this clone"
          git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" || cannot "the push's before, $BEFORE, is not an ancestor of $GITHUB_SHA"
          range="${BEFORE:0:7}..${GITHUB_SHA:0:7}"

          # `--no-renames`, so that a file moved off the list counts by its old path as well.
          paths=$(git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA" -- "${measured[@]}") \
            || cannot "git diff failed on $range"
          cargo=$(git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA" -- Cargo.lock Cargo.toml 'crates/*/Cargo.toml') \
            || cannot "git diff failed on $range"
          crates=""
          if [ -n "$cargo" ]; then
            # One line per Cargo file whose entries for the crates above differ, naming them.
            # A file that does not parse fails this, and the run measures.
            crates=$(python3 - "$BEFORE" "$GITHUB_SHA" "${packages[*]}" $cargo <<'PY'
          import json, subprocess, sys, tomllib

          before, after, names, files = sys.argv[1], sys.argv[2], set(sys.argv[3].split()), sys.argv[4:]

          def load(commit, path):
              shown = subprocess.run(["git", "show", f"{commit}:{path}"], capture_output=True)
              # Absent on one side: added or deleted by the push.
              return tomllib.loads(shown.stdout.decode("utf-8")) if shown.returncode == 0 else {}

          def entries(path, doc):
              if path == "Cargo.lock":
                  return {(p["name"], p.get("version"), p.get("source"), p.get("checksum"))
                          for p in doc.get("package", []) if p["name"] in names}
              kinds = ("dependencies", "dev-dependencies", "build-dependencies")
              tables = [(k, doc.get(k, {})) for k in kinds]
              tables += [(f"target.{t}.{k}", v.get(k, {})) for t, v in doc.get("target", {}).items() for k in kinds]
              tables.append(("workspace.dependencies", doc.get("workspace", {}).get("dependencies", {})))
              found = {("profile", json.dumps(doc.get("profile", {}), sort_keys=True))}
              for table, deps in tables:
                  for key, spec in deps.items():
                      name = spec.get("package", key) if isinstance(spec, dict) else key
                      if name in names:
                          found.add((table, name, json.dumps(spec, sort_keys=True)))
              return found

          for path in files:
              differ = entries(path, load(before, path)) ^ entries(path, load(after, path))
              if path == "Cargo.lock":
                  which = sorted({e[0] for e in differ})
              else:
                  which = sorted({"[profile]" if e[0] == "profile" else e[1] for e in differ})
              if which:
                  print(f"{path} ({', '.join(which)})")
          PY
            ) || cannot "Cargo's files could not be compared on $range"
          fi

          hits=$(printf '%s\n%s\n' "$paths" "$crates" | sed '/^$/d')
          if [ -z "$hits" ]; then
            decide false "not measuring: none of the measured paths changed in $range"
          else
            n=$(printf '%s\n' "$hits" | wc -l)
            more=""
            [ "$n" -gt 1 ] && more=" and $((n - 1)) more"
            decide true "measuring: $(printf '%s\n' "$hits" | head -n1)$more changed in $range"
            printf '%s\n' "$hits" | sed 's/^/  /'
          fi

  windows:
    name: Windows
    needs: [version, ocr]
    uses: ./.github/workflows/windows-build.yml
    with:
      artifact-prefix: ${{ needs.version.outputs.prefix }}
      commit: ${{ needs.version.outputs.commit }}
      ocr-bench: ${{ needs.ocr.outputs.measure == 'true' }}

  macos:
    name: macOS
    needs: [version, ocr]
    uses: ./.github/workflows/macos-build.yml
    # `actions: read` is for finding an earlier run of THIS workflow and downloading its macOS
    # build; see "Reuse the last build" in macos-build.yml. The called workflow asks for the
    # same two, and a call that grants less than it asks for does not start.
    permissions:
      contents: read
      actions: read
    with:
      artifact-prefix: ${{ needs.version.outputs.prefix }}
      commit: ${{ needs.version.outputs.commit }}
      ocr-bench: ${{ needs.ocr.outputs.measure == 'true' }}
