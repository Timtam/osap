name: Documentation

# Does the reference call anything the host does not provide?
#
# This runs on a push rather than manually, unlike the Pages deploy, because it needs nothing
# from GitHub beyond a runner — no Pages, no plan, no repository setting. The deploy is manual
# only because Pages has not been switched on in the repository's settings, which is a
# different problem; the repository itself has been public since 2026-09-12.
#
# The trigger is narrow on purpose. The check compares the examples in `docs/` with the bindings
# the host registers, every page's Errors tables with the reasons of errors.rs and the overlay
# runtime's errors.luau, and the Luau and page scripts of modules/, tools/ and examples/ with the
# error codes and status words (the lint in check-docs.ps1). Nothing else can change its answer,
# so nothing else should spend a runner on it.

on:
  push:
    paths:
      - 'docs/**'
      - 'crates/host/src/lib.rs'
      - 'crates/host/src/element_lua.rs'
      - 'crates/host/src/gamepad_api.rs'
      - 'crates/host/src/timers.rs'
      - 'crates/host/src/webview_lua.rs'
      - 'crates/host/src/window_prelude.luau'
      # host.errors' bindings, and the Reason table every page's Errors are held to.
      - 'crates/host/src/errors.rs'
      - 'crates/host/src/errors_lua.rs'
      # The runtime's reasons (errors.luau), and the code the lint reads.
      - 'modules/**'
      - 'tools/**'
      - 'examples/**'
      - 'check-docs.ps1'
      # The checkers' own source. Without this, a change to the scraper could break the check
      # and nothing would run it until the next docs edit — which is exactly what happened.
      - 'tools/api-index.py'
      - '.github/workflows/check-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/host/src/lib.rs'
      - 'crates/host/src/element_lua.rs'
      - 'crates/host/src/gamepad_api.rs'
      - 'crates/host/src/timers.rs'
      - 'crates/host/src/webview_lua.rs'
      - 'crates/host/src/window_prelude.luau'
      - 'crates/host/src/errors.rs'
      - 'crates/host/src/errors_lua.rs'
      - 'modules/**'
      - 'tools/**'
      - 'examples/**'
      - 'check-docs.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-names:
    name: Every documented host.* name exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pwsh is preinstalled on the GitHub runners, so this needs no setup step. The script
      # itself is written with forward slashes for exactly this reason.
      - name: Check the API reference, and what modules compare
        shell: pwsh
        run: ./check-docs.ps1

      # The index of all 87 entries, and the explicit anchor on every heading, are generated.
      # Left to drift they are worse than absent: an index that is missing the function you
      # are looking for reads as "this platform does not have it".
      - name: The index and the anchors are current
        run: python tools/api-index.py --check
