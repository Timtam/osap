region = [569, 38, 607, 60]
accept = ["DEF"]
must_read = true
what = "the PB RANGE read-out, under the macOS region's numbers: the whole well and a little chrome round it"
checked = "read off the picture as DEF; sforzando shows DEF (the instrument's default) or a number of semitones there; on Windows (ocr-bench --paddle, 2026-10-02) both recognisers read DEF"

[[picture]]
