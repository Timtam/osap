checked = "read off the picture as empty, the word sforzando shows before an instrument is loaded; on Windows (ocr-bench --paddle, 2026-10-02) both recognisers read empty"

[[picture]]
name = "mel-note-dash"
set = "ci"
plugin = "melodyne"
shot = "Melodyne-clean.png"
origin = [0, 0]
region = [220, 61, 287, 74]
accept = ["-", ""]
must_read = false
what = "the note inspector's first field with no note selected: one short dash; NOTE_REGION (modules/melodyne/src/main.luau)"
checked = "read off the picture as one short dash, three pixels on one row; the module expects a recogniser to drop it, so nothing is right as well; on Windows (ocr-bench --paddle, 2026-10-02) the neural recogniser read -, Windows.Media.Ocr nothing"

[[picture]]
