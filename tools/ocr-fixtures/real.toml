region = [220, 61, 287, 74]
accept = [""]
must_read = false
what = "the note inspector's first field drawn empty; NOTE_REGION"
checked = "no text in it: a flat field with its lighter top edge; on Windows (ocr-bench --paddle, 2026-10-02) both recognisers read nothing (Windows' blank guard answered)"

[[picture]]
name = "mel-gain"
