accept = ["0"]
must_read = true
what = "the TUNE read-out, a lone digit in a well; no module reads it, so the region is the well with its surround, clear of the label"
checked = "read off the picture as 0, a lone digit; sforzando shows the tuning as a whole number, 0 by default; on Windows (ocr-bench --paddle, 2026-10-02) the neural recogniser read 0 (score 0.55), Windows.Media.Ocr nothing"

[[picture]]
