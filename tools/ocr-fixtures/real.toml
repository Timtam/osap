shot = "Melodyne-4-clean.png"
origin = [0, 0]
region = [220, 61, 287, 74]
accept = ["0.00 dB"]
must_read = true
what = "the note inspector's first field showing an amplitude; NOTE_REGION"
checked = "read off the picture as 0.00 dB; Melodyne shows the amplitude with two decimals followed by dB; on Windows (ocr-bench --paddle, 2026-10-02) both recognisers read 0.00 dB"

[[picture]]
name = "mel-position"
set = "ci"
plugin = "melodyne"
shot = "Melodyne-4-clean.png"
origin = [0, 0]
region = [408, 12, 530, 34]
accept = ["14.1.1"]
must_read = true
what = "the transport's position read-out, bar.beat.tick in a larger type; TRANSPORT_REGION"
checked = "read off the picture as 14.1.1: bar, beat and tick, whole numbers separated by points; on Windows (ocr-bench --paddle, 2026-10-02) Windows.Media.Ocr read 14.1.1, the neural recogniser 4.1.1 (score 0.14), losing the first digit"

[[picture]]
name = "k8-voices"
set = "ci"
plugin = "kontakt"
shot = "Kontakt-8-in-a-DAW-Cinematic-Studio-Strings-Snapshot-menu-menu-before.png"
origin = [0, 0]
region = [555, 100, 625, 116]
accept = ["Voices: 0"]
must_read = true
what = "the instrument header's voice count with its icon in front; measured on the shot, the plug-in's content at (0, 0)"
checked = "read off the picture as a small icon, then Voices: and 0; Kontakt counts the playing voices there, 0 when nothing plays; on Windows (ocr-bench --paddle, 2026-10-02) neither read it right: Windows.Media.Ocr read Voices: without the 0, the neural recogniser In Voices: 0, the icon as letters"

