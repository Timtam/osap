# Real captures for `automation-platform ocr-bench --pictures DIR`, cut by crop.py (beside this
# file) out of the overlay runtime's calibration shots. Those shots are git-ignored
# (modules/*/calibration/): a calibrating run writes them on the machine that took them, so
# only that machine can cut these again. Every one here is a Windows capture at 1x.
#
# Two sets:
#   set = "ci"     value fields and plain control words, nothing else; committed to
#                  crates/host/bench-data/ocr/real/ with a manifest and a NOTICE naming the
#                  plug-ins, and read by CI with --pictures.
#   set = "local"  wordmarks, logos, preset and instrument names; written to
#                  crates/host/tests-data-local/ocr-real/, which is git-ignored, and read only on
#                  the machine that has the shots or on a tester's Mac it is handed to.
#
# Per picture:
#   shot       the calibration shot, a file in the calibration folder
#   origin     where the module's own frame starts in the shot, in pixels: sforzando's content
#              origin in its menu shots (the window frame and title bar above and left of it),
#              (0, 0) where the shot is the plug-in's content alone
#   region     x1, y1, x2, y2 from that origin, as the module's region is written (x2 and y2
#              not included); where no module reads the field, the field with its surround
#   accept     the answers that are right: "" is the answer "nothing"
#   must_read  whether a way of reading must read it right; false where nothing is accepted
#   what       what the field is, and where its region comes from
#   checked    how the accepted answers were checked. Both people on this project are blind:
#              each answer was read off the picture by a model, held against the range of
#              values the plug-in shows there, and held against what Windows.Media.Ocr and the
#              neural recogniser read on Windows (`ocr-bench --paddle --pictures`). A doubtful
#              one gets more than one accepted answer.

[plugins]
sforzando = "sforzando, by Plogue Art et Technologie Inc."
melodyne = "Melodyne, by Celemony Software GmbH"
kontakt = "Kontakt 8, by Native Instruments"
css = "Cinematic Studio Strings, by Cinematic Studio Series, in Kontakt 8"
diva = "Diva, by u-he"

[[picture]]
name = "sfz-polyphony"
set = "ci"
plugin = "sforzando"
shot = "sforzando-Polyphony-menu-before.png"
origin = [8, 51]
region = [486, 40, 516, 70]
accept = ["64"]
must_read = true
what = "the POLY. read-out, light digits in a black well; the module's Windows region (modules/sforzando/src/main.luau)"
checked = "read off the picture as 64; sforzando shows the polyphony as a whole number, 64 by default; on Windows (ocr-bench --paddle, 2026-10-02) the neural recogniser read 64, Windows.Media.Ocr nothing"

[[picture]]
name = "sfz-pitchbend"
set = "ci"
plugin = "sforzando"
shot = "sforzando-Pitchbend-range-menu-before.png"
origin = [8, 51]
region = [576, 40, 602, 60]
accept = ["DEF"]
must_read = true
what = "the PB RANGE read-out; the module's old Windows region, which starts inside the well (modules/sforzando/src/main.luau explains why the macOS one starts earlier)"
checked = "read off the picture as DEF; sforzando shows DEF (the instrument's default) or a number of semitones there; on Windows (ocr-bench --paddle, 2026-10-02) both recognisers read DEF"

[[picture]]
name = "sfz-pitchbend-wide"
