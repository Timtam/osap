origin = [0, 0]
region = [220, 61, 287, 74]
accept = ["0 ct"]
must_read = true
what = "the note inspector's first field showing a pitch deviation; NOTE_REGION"
checked = "read off the picture as 0 ct; Melodyne shows the deviation as a whole number of cents followed by ct; on Windows (ocr-bench --paddle, 2026-10-02) both recognisers read 0 ct"

[[picture]]
name = "mel-empty"
set = "ci"
