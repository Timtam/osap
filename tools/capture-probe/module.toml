id = "com.tool.captureprobe"
name = "Capture smoke"
version = "0.1.0"
license = "GPL-3.0-or-later"

[capabilities]
# The routes into backend/macos/capture.rs a handler waits for — pixel reads, snapshots and an
# OCR read, each taken on the screen-capture thread — plus the timer whose handlers ask for them
# and the log that says what came back. Deliberately nothing that needs an accessibility grant,
# which a CI runner does not have.
require = ["screen", "ocr", "log", "timer"]
