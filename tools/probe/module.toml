id = "com.tool.probe"
name = "Window probe"
version = "0.1.0"
license = "GPL-3.0-or-later"

[capabilities]
# `input` is here for `cursorPos` ALONE — reading where the pointer is. The probe runs over
# somebody's real plugin and never posts an event; see src/answers.luau.
# `resource` is for ONE thing: asking whether `probe-N.png` already exists, so the numbering
# resumes across launches instead of overwriting the previous run's picture. Reading only.
# `gamepad` is for src/gamepad.luau: it listens to game controllers and logs every event with
# how late it arrived. Observing only — nothing is ever sent to a pad or a game.
require = ["window", "screen", "ocr", "element", "input", "timer", "speech", "log", "hotkey", "resource", "gamepad"]
