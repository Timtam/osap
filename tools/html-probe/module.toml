id = "com.tool.html-probe"
name = "HTML page probe"
version = "0.1.0"
license = "GPL-3.0-or-later"
# The page is Windows-only in this stage (host.gui.webview answers "not supported on this
# platform yet" on a Mac), and so are the questions this probe asks: W1–W9 in TODO.md.
supported_os = ["windows"]
# The plug-in windows it shows its page beside are the ones daw-hosts knows, in every DAW there.
dependencies = ["com.platform.daw-hosts"]

[capabilities]
# `gui` for the page. `input` for W3's round-trip click and W10's ways of clicking (posted, the
# no-activate style); `element` for W10's element dump and accessibility press; `ocr` for W10's
# reads of the plug-in near the target before and after; `screen` for the pictures — W3's after
# its click, W10's baseline and change wait. `settings` for the switch that shows the page by
# itself (test W2 c), off by default.
require = ["gui", "window", "hotkey", "speech", "log", "input", "element", "ocr", "screen", "settings"]
