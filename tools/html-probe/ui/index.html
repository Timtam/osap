<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML probe</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="page.css">
<script src="page.js" defer></script>
</head>
<body>
<main>
<h1 id="heading">HTML probe</h1>
<p>A test page of the automation platform. Every key, every focus change and every button press on this page is written to the application's log.</p>
<h2>Actions</h2>
<p class="actions">
<button type="button" data-action="click-plugin">Click into the plug-in</button>
<button type="button" data-action="back">Back to the plug-in</button>
<button type="button" data-action="announce">Announce and change the live region</button>
<button type="button" data-action="switch" id="switch">Show as an application window</button>
</p>
<h2>Fields</h2>
<p><label for="search">Search</label> <input id="search" type="search" autocomplete="off"></p>
<p><label for="choice">Choice</label>
<select id="choice">
<option>First</option>
<option>Second</option>
<option>Third</option>
</select></p>
<h2>Status</h2>
<p id="live" aria-live="polite">Nothing announced yet.</p>
</main>
</body>
</html>
