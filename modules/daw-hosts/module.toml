id = "com.platform.daw-hosts"
name = "DAW host definitions"
version = "0.2.0"
license = "GPL-3.0-or-later"

# A code module: its source is evaluated inside every VM that depends on it, so the matchers
# arrive as real Lua tables rather than through a JSON round trip — and, unlike data, it can
# carry a function. The one it carries is `activate`, which the host runs in this module's own
# VM only, so the global shortcut it registers exists once instead of once per dependent.
code_module = true

[capabilities]
# `input` for exactly one click, and `timer` for the one deferred reading that follows it:
# the shortcut that puts the keyboard back into a plugin inside REAPER on macOS clicks into
# the plugin's panel when the window accepted the focus but kept the keyboard on its own FX
# list, then asks a quarter of a second later where the keyboard actually is. Whether the
# click achieves that is unmeasured; the module announces only what the later reading says.
# `element` for the one question the shortcut asks FIRST on macOS — the plugin's own
# focusable elements inside its panel, handed the keyboard by asking — before it falls back
# to the click. Without the capability the namespace is absent from this VM, and the
# shortcut's first press would have raised a module error instead of moving anything.
require = ["window", "hotkey", "speech", "log", "input", "timer", "element"]
