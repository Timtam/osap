id = "com.platform.soundiron"
name = "Soundiron"
version = "0.1.0"
engine_api = ">=0.1, <0.2"
entry = "src/main.luau"
license = "MIT"
dependencies = ["com.platform.kontakt"]

[capabilities]
# Inherits Kontakt's framework (the overlay machinery runs in this VM), so the
# effective capability surface is the union with Kontakt's.
require = ["window", "uia", "screen", "ocr", "input", "speech", "hotkey", "keys", "timer", "log", "path"]
