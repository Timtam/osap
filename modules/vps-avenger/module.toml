id = "com.platform.vps-avenger"
name = "VPS Avenger"
version = "0.5.0"
license = "GPL-3.0-or-later"
# The runtime's page support (O:addPage, O:inPlugin) came with version 0.6; `identify`'s `again`
# and O:watch's count of readings, which the header's read and the name after ◀ and ▶ use, with 0.7;
# the drawn menu test, which sees Avenger's popups painted inside its editor, and O.doubleClick's
# button, which the resets of Pan and Random Pitch use, with 0.8; a trip's hand-over of the
# keyboard, which the renames and Browse Presets use (src/handover.luau), with 0.9.
dependencies = ["com.platform.overlay >= 0.9", "com.platform.daw-hosts"]
# The catalog of Avenger's expansions (modules/vps-avenger-presets), when it is installed:
# the preset's expansion, category, oscillators and macros, and the neighbour ◀ and ▶ lead to,
# said marked as the database's (src/presets.luau). Without it the module is what it was.
optional_dependencies = ["com.platform.vps-avenger-presets"]
# No supported_os: the module is meant for both systems and names nothing only one of them has —
# a JUCE window's class for Avenger's own child window on Windows, the DAW's plug-in panel on a
# Mac (src/main.luau). Neither has met a real Avenger through this module yet: TODO.md,
# "VPS Avenger".

[capabilities]
# What this module's own code calls; the overlay runtime's calls are covered by its own manifest.
#   window  ownsPoint before a click of its own, recheck once the warning box's read has decided,
#           the window's title
#   ocr     Avenger's header (identity and zoom), the preset's name, the warning box; for the
#           page, the words of one picture of Avenger (src/read/open.luau), and a name renamed in
#           Avenger's editor, read back off a picture (src/handover.luau)
#   input   the clicks on ◀ and ▶, UNDO and the redo list's right click, an opener clicked again
#           (or Escape, for a right click's) to close a popup a choice left open, and the warning
#           box's YES the page answers; the oscillator strip's and the macros' clicks, right clicks
#           and double-clicks (src/act.luau); for a rename, the double-click that opens Avenger's
#           editor on a name field, and the click that selects an OSC tab before it (src/handover.luau)
#   speech  the new preset name, the refusals of its own clicks, and why the page key opened nothing
#   log     what was read, and where
#   screen  the screen's size, before a choice that opens Avenger's warning box; for the page, one
#           picture of Avenger and its grids, profiles and points (src/read); for an action of the
#           strip's or the macros', a picture of its part before the click and a change wait after
#           it (src/act.luau); for a rename, the field's pictures, the change waits that see
#           Avenger's editor open and closed, and the profiles of its edges (src/read/editor.luau);
#           the calibration pictures of the header, the warning box, the page's reads and the
#           editor, in a calibrating run only
#   path    where those pictures are written
#   gui     the page: the avenger_control project's panel, beside Avenger (src/page.luau, ui/);
#           its key is the overlay runtime's (O:addPage)
#   settings  the page's: its key, the expansions list, its sounds, the Mac page mode, and the
#           Drum SQ watcher's cadence
#   sound   Open.wav and Close.wav as the page comes and goes (sounds/, the project's)
require = ["window", "ocr", "input", "speech", "log", "screen", "path", "gui", "settings", "sound"]
