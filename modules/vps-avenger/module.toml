id = "com.platform.vps-avenger"
name = "VPS Avenger"
version = "0.15.0"
license = "GPL-3.0-or-later"
# The runtime's page support (O:addPage, O:inPlugin) came with version 0.6; `identify`'s `again`
# and O:watch's count of readings, which the header's read and the name after ◀ and ▶ use, with 0.7;
# the drawn menu test, which sees Avenger's popups painted inside its editor, and O.doubleClick's
# button, which the resets of Pan and Random Pitch use, with 0.8; a trip's hand-over of the
# keyboard, which the renames and Browse Presets use (src/handover.luau), with 0.9 — its `keys`
# kind the knobs turned from the page too (src/amount.luau); O:chooseMenuItem's `submenu`, which a drum
# slot's Copy and Swap choose their target slot in (src/actions/drums.luau), with 0.10; the runtime's
# error values and O.errors, whose codes every answer of the runtime's is compared by, with 0.11;
# O:holdKeys, which holds Page Up, Page Down, Return and Escape for a knob turned from the ring
# (src/ring.luau, src/amount.luau), with 0.13; O:afterDialog, after which the ring's Load preset and
# Save preset as say the name (src/main.luau), and the page's `openLater`, which lets the page key's
# reads be asked at once with callbacks (src/page.luau, src/read/open.luau), with 0.14; O.doubleClick
# as the host's one gesture (host.input.click's `clicks = 2`: on a Mac the second press marked as
# click 2, its callback once both clicks are out), which every knob's reset and the expansion
# browser's Load use (src/act.luau, src/main.luau, src/actions/browser.luau), with 0.15; a hand-over's
# and a hold's `swallow`, with which every hand-over of the module's — a knob held from the page or
# the ring, a rename, the browsers — swallows Tab and Shift+Tab, which switch Avenger's oscillators
# on Windows, and says once how it ends (src/act.luau, src/amount.luau, src/handover.luau), with 0.16.
dependencies = ["com.platform.overlay >= 0.16", "com.platform.daw-hosts"]
# The catalog of Avenger's expansions (modules/vps-avenger-presets), when it is installed:
# the preset's expansion, category, oscillators and macros, the names by which the ring's
# Oscillator stepper, Mute, Solo and the knobs' sentences name a tab whose name was not read
# (src/actions/osc.luau), and the page's lists, said and shown as they are; and the neighbour ◀ and
# ▶ lead to, marked as the database's where the screen's read failed or disagrees, as are a name it
# took a poor read for and the last position's name a Preset info says where it reads none
# (src/presets.luau). Without it the module is what it was.
optional_dependencies = ["com.platform.vps-avenger-presets"]
# No supported_os: the module is meant for both systems and names nothing only one of them has —
# a JUCE window's class for Avenger's own child window on Windows, the DAW's plug-in panel on a
# Mac (src/main.luau). Neither has met a real Avenger through this module yet: TODO.md,
# "VPS Avenger".

[capabilities]
# What this module's own code calls; the overlay runtime's calls are covered by its own manifest.
#   window  ownsPoint before a click of its own, recheck once the warning box's read has decided,
#           the window's title
#   ocr     Avenger's header (identity and zoom), the preset's name, the warning box; for the
#           page, the words of one picture of Avenger (src/read/open.luau) — on the Drums tab the
#           twelve drum slots' names among them (src/read/drums.luau) — and a name renamed in
#           Avenger's editor, read back off a picture (src/handover.luau); the sample editor's
#           menus' fields, the envelope's preset name, the sample browser's rows and a field typed
#           into (src/read/sample.luau, src/handover.luau), and DRUM SQ's SPEED
#           (src/read/drumsq.luau); the expansion browser's header — its view's caption and the
#           open expansion's name — once per picture (src/read/browser.luau), never its grid, its
#           categories, its preset rows or the view list a Close may open on the grid, which its
#           pixels tell
#   input   the clicks on ◀ and ▶, UNDO and the redo list's right click, an opener clicked again
#           (or Escape, for a right click's) to close a popup a choice left open, and the warning
#           box's YES the page answers; the oscillator strip's and the macros' clicks, right clicks
#           and double-clicks (src/act.luau); for a rename, the double-click that opens Avenger's
#           editor on a name field, and the click that selects an OSC tab before it (src/handover.luau);
#           for a knob turned from the page or the ring, its press held, one move per key and the release
#           (src/amount.luau); the Drums tab's clicks, double-clicks and a drum slot's menu with its
#           submenu (src/actions/drums.luau), a drum slot's Browse (src/handover.luau) and a drum
#           knob pressed and held (src/amount.luau); the sample editor's clicks, its menus opened
#           with the left button and its knobs' double-clicks (src/actions/sample.luau), a field
#           double-clicked, a browser row and the envelope's Menu and Preset (src/handover.luau);
#           DRUM SQ's clicks, right clicks, menus, and LENGTH's double-click and drag
#           (src/actions/drumsq.luau); the sample editor's and DRUM SQ's knobs pressed and held
#           (src/amount.luau); the expansion browser's view list opened with the left button, Close,
#           FAV, a tile, a category and a preset row clicked at their places and their scrollbars at
#           the tool's points, a row double-clicked, its star clicked (src/actions/browser.luau)
#   speech  the new preset name, the refusals of its own clicks, why the page key opened nothing,
#           the tool's sentences for a knob's amount (src/amount.luau, #6 to #11) and a drum slot's
#           Browse and a row of the sample browser (#13), the pattern DRUM SQ's watcher reads
#           selected (src/watch.luau), that an expansion is being looked for in the browser's grid by
#           its place (src/actions/browser.luau), that the page key changed, and that the
#           page was described again when its mode changed from it (src/page.luau)
#   log     what was read, and where
#   screen  the screen's size, before a choice that opens Avenger's warning box; for the page, one
#           picture of Avenger and its grids, profiles and points (src/read); for an action of the
#           strip's or the macros', a picture of its part before the click and a change wait after
#           it (src/act.luau); for a rename, the field's pictures, the change waits that see
#           Avenger's editor open and closed, and the profiles of its edges (src/read/editor.luau);
#           for a knob turned, its picture before the press and the change wait after Return, its
#           points read (src/amount.luau); the drumkit table's grids and its name column's profile
#           (src/read/drums.luau), and for a drum slot's Browse its name's picture and a change wait
#           after Return (src/handover.luau); the sample editor's tabs' captions' grid and points,
#           and its switches' grid (src/read/sample.luau); LENGTH's change waits
#           (src/actions/drumsq.luau); DRUM SQ's watcher's picture, its key's pending, and its
#           questions with callbacks (src/watch.luau); the expansion browser's pictures, its title
#           band's, its list bar's, the star column's and the stars' grids, the change waits after
#           a click and after every click on a scrollbar, and the profiles of the view list's place
#           before and after a Close where nothing told (src/actions/browser.luau, src/act.luau,
#           src/read/browser.luau);
#           the calibration pictures of the header, the warning box, the page's reads, the editor,
#           the knobs, the watcher and the browser, in a calibrating run only
#   path    where those pictures are written
#   gui     the page: the avenger_control project's panel, beside Avenger (src/page.luau, ui/);
#           its key is the overlay runtime's (O:addPage)
#   settings  the page's: its key, the expansions list, its sounds, the Mac page mode, the Drum
#           SQ watcher's cadence and the Expansion View stored — in the module's settings dialog
#           and in the page's own Settings section, which writes the same settings (src/page.luau)
#   sound   Open.wav and Close.wav as the page comes and goes, and Slider.wav at a knob's limit
#           (sounds/, the project's)
#   timer   DRUM SQ's watcher, at the `drumSqCadence` setting's pace (src/watch.luau); the overlay
#           runtime's own timers are covered by its manifest
require = ["window", "ocr", "input", "speech", "log", "screen", "path", "gui", "settings", "sound", "timer"]
