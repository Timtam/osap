id = "com.reahotkey.sforzando"
name = "Sforzando overlay"
# 0.2.3 asks no accessibility tree on a DAW's plug-in panel on a Mac: only the wordmark is read there.
version = "0.2.3"
license = "GPL-3.0-or-later"
# `identify`'s `again`, which the wordmark's read on a panel calls, came with the runtime's 0.7.
dependencies = ["com.platform.overlay >= 0.7", "com.platform.daw-hosts"]

[capabilities]
require = ["window", "ocr", "log", "element"]
