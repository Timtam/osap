id = "com.platform.komplete-kontrol"
name = "Komplete Kontrol"
version = "0.1.0"
engine_api = ">=0.1, <0.2"
entry = "src/main.luau"
license = "MIT"
# code_module: this module's code is evaluated inside a dependent's VM so it can import
# KK's exports (its standaloneWindow matcher) with functions/data intact — Kontakt
# optionally depends on this to detect itself hosted in a standalone KK window. Its
# `activate` side effect still runs only in its own VM.
code_module = true
dependencies = ["com.platform.overlay", "com.platform.daw-hosts"]
# Windows only, because everything it matches on is Windows vocabulary: the standalone
# window's NINormalWindow class, the #32770 dialogs, and the embedded control as the plain
# Win32 class pattern "Qt%d+.-QWindowIcon" — which on a Mac is compared with an
# AXRole/AXSubrole/AXIdentifier triple and never matches. Nobody has had Komplete Kontrol in
# front of a Mac through this module. Kontakt's optional import of it answers nil there, which
# Kontakt already handles (no in-KK cell, no standalone-KK host).
supported_os = ["windows"]

[capabilities]
require = ["window", "element", "input", "speech", "timer", "log", "settings", "path"]
