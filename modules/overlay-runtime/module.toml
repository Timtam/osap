id = "com.platform.overlay"
name = "Overlay runtime"
# 0.2.0 brought O:here, O:stillHere and O:toScreenRect's `whole`: a module that uses them
# depends on "com.platform.overlay >= 0.2", so an older runtime fails the module's load
# rather than its first call of one. 0.3.0 runs the overlay under handlers: a sentence's mark
# is taken before its control's hooks, a binding is first evaluated on the next tick, nothing
# but a stepper is read before a press, and the hooks asked on every scan run in a coroutine of
# the runtime's own (docs/api/overlay.md, "Where a hook runs"). Nothing a module calls is new.
# 0.3.1 reads with host.ocr.recognize and a callback, as the application asks now. 0.4.0 holds
# calibration as a setting of its own (Installed → Overlay runtime → Settings…), which a module
# asks with O.calibrating(), and so depends on "com.platform.overlay >= 0.4". 0.4.1 gives a static
# text a `hotkey`, which says it, and O:stillHere a `spoken` option, an announcement said rather than
# begun; a module that uses either depends on "com.platform.overlay >= 0.4.1". 0.4.2 checks that
# the overlay is still where a press was made before it clicks after reading a pixel (a hotspot
# toggle, a panel's reveal), reads a calibration shot's pixels in one read, and keeps an
# O.memoByEpoch answer under the epoch it was given in. Nothing a module calls is new. 0.5.0 holds
# the pixels a `when` answers from, O:probe, read in the handler before a scan, and read at every
# key after an act the module said would change them (O:expectChange) until they do; a module that
# uses either depends on "com.platform.overlay >= 0.5". A calibrating run's menu item shot is
# asked off the event loop, and the item is clicked once it is in. 0.5.1 lets go in front of one of
# this application's own windows (a window table's `own`) and asks nothing there, not even the
# window that lost the foreground; an overlay the arbiter elects while one of them has the keyboard
# (host.window.foreground()'s `own` when none is shown) does not come up. Nothing a module calls is
# new. 0.5.2 asks its accessibility menu tests with a callback, off the event loop, and keeps a
# test's last answer for one the plug-in did not answer. Nothing a module calls is new. 0.5.3
# waits for a calibrating run's picture before a press, which host.screen.snapshot takes on the
# screen-capture thread, and makes the press's click only while the overlay is still where the
# press was. Nothing a module calls is new. 0.5.4 drags a slider, and says where its thumb went,
# only while the overlay is still where the step began, its thumb searched for again after each
# search, which waits in a handler now. Nothing a module calls is new. 0.5.5 searches with
# host.screen.imageSearch — a callback where it must not wait, a template list where it reads a
# toggle — and takes its calibration pictures with host.screen.snapshot and a callback, where
# imageSearchAsync, imageSearchMulti and snapshotAsync are gone; a landmark gate keeps one search
# out by its key (host.screen.pending), so it asks again after its module was off, whose answers
# are dropped. Nothing a module calls is new. 0.5.6 gives an OCR button a `value` hook, which says
# what the text read means where a module knows how the recogniser misreads it. 0.6.0 gives an
# overlay a page: O:addPage, O:inPlugin and its trip, o.away, O:pageBack, O:pageKey and
# O:pageAgain. While the page is in front or a trip is under way, the overlay holds no keys and
# its onActivate and onDeactivate wait. A module that uses either depends on
# "com.platform.overlay >= 0.5.6" or ">= 0.6". 0.7.0 hands a stored `identify` a second argument,
# `again`, which asks the overlays of its binding to look again on the module's next turn, and
# counts readings in O:watch: a `read` may name the reading its value came from, and `done`,
# `onDone` and `onGiveUp` get how many in a row read the same; a module that uses either depends on
# "com.platform.overlay >= 0.7". On a Mac an empty focus chain keeps a stay in its window and begins
# none, and every `[deactivate]` line says which test failed. 0.8.0 sees a popup painted inside the
# plug-in: O.menuTests.drawn{ region }, which a menu test's new `before(o, press)` hook — asked at a
# press, before it counts, where a read waits — makes possible; `pressed` is handed the press; a
# choice is followed only by the test that placed its item, and an item clicked on a callback's
# answer counts as clicked between two ticks; and O.doubleClick takes `opts.button` and a callback
# after the second click. A module that uses either depends on "com.platform.overlay >= 0.8".
# 0.9.0 hands the keyboard to the plug-in inside a trip: trip:handOver{ kind = "typing" | "browse" |
# "keys" } holds the end keys and lets them through to the plug-in, or captures named keys for the
# module, ends on its key and the module's `ends`, on the page key or a window change, and calls
# `onEnd` once on every path. A module that uses it depends on "com.platform.overlay >= 0.9".
# 0.10.0 chooses in a submenu: O:chooseMenuItem's `submenu = { menuItem }` clicks the item that opens
# it once, after the test that placed it got ready through its new `chained` hook (newWindow and drawn
# have one), takes it as taken when that test answers a new popup, and chooses the submenu's item in
# that; `why` "no submenu" when none came. A module that uses it depends on "com.platform.overlay >= 0.10".
# 0.11.0 answers as the host does: every failure an error value with a code (docs/api/errors.md),
# made from the runtime's own reasons in src/errors.luau, and O.errors with its eight codes beside
# the host's. chooseMenuItem answers false and the error value at the call as well as to onDone, and
# raises on an overlay with no menu tests; stillHere, toScreen, toScreenRect, inPlugin, pageBack,
# pageKey, trip:afterMenu and trip:handOver answer error values, and so do onGiveUp, onBack and
# onDone; onShown and onClose hand on the page's; a hand-over's onEnd is (o, trip, how, info, err),
# `how` "ended", "done" or "given_up"; pageKey raises for a spec that is not a string;
# O.doubleClick and the calibration and capture methods answer why they did not. A module written
# against the old words no longer matches them, silently, and a lower bound does not protect it (a
# dependency is no upper bound); one that compares codes depends on "com.platform.overlay >= 0.11".
# 0.12.0 hands on the host's count of a key's quick repeats (`press`, docs/api/hotkey.md): a
# control's `onActivate(overlay, press)` gets the press of the hotkey that activated it, and
# O:activate takes it as a second argument; a hand-over's `onKey(overlay, trip, key, mods, press)`
# gets its key's. A module that reads it depends on "com.platform.overlay >= 0.12".
# 0.12.1 answers a trip:handOver refused because the plug-in is not in front with the give-up's own
# error value, the one onGiveUp hears (`moved_on` where another application's window is in front,
# which was `not_in_front`); O:calibrationCrop answers `not_in_front` on an overlay that is not
# active, and O:calibrationVerify `not_found` for a crop never written, where its search raised;
# a region function's three messages name the field without backticks. A module that relies on any
# of it depends on "com.platform.overlay >= 0.12.1". It tests a binding's DAW entries by their
# matcher keys alone, the entry's own fields left out, as host.window.test raises for a key no
# matcher has.
# 0.13.0 (the second Mac test of VPS Avenger, 2026-10-24): an empty focus chain begins a stay in the
# focus round a module's own click into the DAW's panel asked for (host.window.recheck's `entered`,
# daw-hosts' focus key) and in no other; the page key with the overlay not in front opens the page
# from a plug-in window of the binding whose `identify` says yes (O:addPage, case 5); the window of
# a press is brought back after a dialog it opened closed into the DAW's main window; a drawn popup
# answers its `print`, and one drawn as at an item's click is the click pending, not untaken, while
# a new window of the plug-in over the item's point is the item taken; and O:holdKeys takes keys for
# the module while the overlay is in front, Return included. A module that calls O:holdKeys depends
# on "com.platform.overlay >= 0.13".
# 0.14.0 (the second Mac test of VPS Avenger, its rest): O:afterDialog, the dialog an overlay's own
# press opened and the plug-in in front again after it, outside a trip; and O:addPage's
# `openLater`, a page's `open` that answers later, its show waiting for that answer. A module that
# uses either depends on "com.platform.overlay >= 0.14". And O:holdKeys' hold ends "left" where the
# overlay comes up on another window it also matches, and a press's menu window an item was clicked
# in is no item's dialog.
# 0.15.0 (the third Mac test of VPS Avenger, 2026-10-25): O.doubleClick is the host's double-click,
# host.input.click's `clicks = 2` — click states 1 and 2 on a Mac, the press held 20 ms and the
# second 60 ms after the first release, two clicks Windows counts itself — made on a thread of the
# host's, and its callback once both clicks are out. A second half the host did not send, the
# window at the point having changed after the first click, answers `covered` to the callback; a
# refusal at the call reaches the callback on a later turn, from the host. The runtime's 90 ms timer
# between two plain clicks is gone. A module that relies on it depends on
# "com.platform.overlay >= 0.15".
# 0.16.0 (2026-10-25, from the maintainer): a hold's and a trip's hand-over's `swallow = { keys, say
# }` — O:holdKeys and trip:handOver of every kind — takes keys that do nothing for as long as it
# lasts: captured with host.keys.capture's `menu = "taken"`, so a hand-over's menu flag leaves them
# swallowed, they reach neither the plug-in nor `onKey` nor the overlay's own claims of them, and
# the module's sentence of how it ends is said once, at the first of them; every end gives them back
# with the rest. VPS Avenger swallows Tab and Shift+Tab, which switch its oscillators on Windows. A
# module that uses it depends on "com.platform.overlay >= 0.16".
version = "0.16.0"
# Loaded into the VM of every module that depends on it, so its functions
# (O.new, O.container, the Overlay methods) are reachable via host.require.
code_module = true

[capabilities]
require = ["window", "element", "screen", "ocr", "input", "speech", "hotkey", "keys", "timer", "log", "path", "resource", "arbiter", "settings"]
