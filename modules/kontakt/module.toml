id = "com.platform.kontakt"
name = "Kontakt"
# 0.1.5 asks whether a window is a Komplete Kontrol, and which Kontakt it is, with a callback, off
# the event loop, and keeps the answers per window (src/detect.luau, "What a control is"). 0.1.6
# searches for the What's New close glyph and the resize grip with host.screen.imageSearch and a
# callback, where host.screen.imageSearchAsync is gone.
version = "0.1.6"
engine_api = ">=0.1, <0.2"
entry = "src/main.luau"
license = "MIT"
# Inherited by sample-library modules: this module's framework (the base overlay
# + library()) is evaluated inside each library's VM via host.require.
code_module = true
dependencies = ["com.platform.overlay >= 0.5", "com.platform.daw-hosts"]
# Optional: if Komplete Kontrol is also installed, import its standalone-window matcher
# so a Kontakt nested inside a standalone KK is detected as a host. Not required — bare
# Kontakt (in a DAW, no KK) loads fine without it, and host.tryRequire returns nil then.
optional_dependencies = ["com.platform.komplete-kontrol"]

[capabilities]
require = ["window", "element", "screen", "ocr", "input", "speech", "keys", "timer", "log", "path"]
