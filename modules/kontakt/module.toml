id = "com.platform.kontakt"
name = "Kontakt"
version = "0.1.0"
engine_api = ">=0.1, <0.2"
entry = "src/main.luau"
license = "MIT"
# Inherited by sample-library modules: this module's framework (the base overlay
# + library()) is evaluated inside each library's VM via host.require.
code_module = true
dependencies = ["com.platform.overlay", "com.platform.daw-hosts"]
# Optional: if Komplete Kontrol is also installed, import its standalone-window matcher
# so a Kontakt nested inside a standalone KK is detected as a host. Not required — bare
# Kontakt (in a DAW, no KK) loads fine without it, and host.tryRequire returns nil then.
optional_dependencies = ["com.platform.komplete-kontrol"]

[capabilities]
require = ["window", "uia", "screen", "ocr", "input", "speech", "keys", "timer", "log", "path"]
