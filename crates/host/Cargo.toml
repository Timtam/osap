[package]
name = "host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mlua = { version = "0.11.6", features = ["luau", "error-send"] }
module-manifest = { path = "../module-manifest" }
rodio = "0.20"
tts = { version = "0.26.3", features = ["tolk"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Foundation", "Security_Cryptography", "Win32_System_WinRT", "Storage_Streams"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_Graphics_Gdi"] }
