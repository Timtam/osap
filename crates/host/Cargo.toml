[package]
name = "host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Template matching is embarrassingly parallel — every candidate position is independent —
# and a batch is one task per installed sample library. See spawn_image_worker.
rayon = "1"
mlua = { version = "0.11.6", features = ["luau", "error-send", "serialize"] }
module-manifest = { path = "../module-manifest" }
rodio = "0.20"
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ureq = "3"
zip = "2"
toml = "1.1.2"
tts = { version = "0.26.3", features = ["tolk"] }
wxdragon = "0.9.15"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Foundation", "Security_Cryptography", "Win32_System_WinRT", "Storage_Streams", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant"] }
# Secondary OCR engine (in-process, FFI): PaddleOCR recognition model via ONNX
# Runtime, used as a fallback for text Windows.Media.Ocr won't read (lone digits).
ort = { version = "=2.0.0-rc.10", features = ["download-binaries", "copy-dylibs", "ndarray"] }
ndarray = "0.16"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

# --- macOS ---------------------------------------------------------------------------
# Kept identical to crates/macos-check/Cargo.toml, which is what type-checks this code
# from a Windows machine. A feature enabled there and missing here would mean the check
# passes and the real Mac build does not.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = ["NSString", "NSArray", "NSValue", "NSGeometry", "NSDictionary", "NSError", "NSData", "NSRunLoop", "NSThread", "NSObjCRuntime", "NSEnumerator", "NSURL", "NSProcessInfo", "NSNotification", "NSOperation", "NSAppleScript", "NSDate", "NSRange", "block2"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
features = ["NSWorkspace", "NSRunningApplication", "NSScreen", "NSApplication", "NSResponder", "NSGraphics", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSEvent", "objc2-core-foundation"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3"
features = ["CFBase", "CFString", "CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFCGTypes", "CFData", "CFMachPort"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3"
features = ["CGBase", "CGEvent", "CGEventTypes", "CGEventSource", "CGDirectDisplay", "CGDisplayConfiguration", "CGWindow", "CGWindowLevel", "CGImage", "CGGeometry", "CGRemoteOperation", "CGColorSpace", "CGDataProvider", "CGContext", "CGBitmapContext", "CGError", "libc", "objc2"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-vision]
version = "0.3"
features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes", "VNGeometry", "VNError", "VNUtils", "VNRequestRevisionProviding", "objc2-core-graphics", "objc2-core-foundation"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-application-services]
version = "0.3"
features = ["AXUIElement", "AXValue", "AXError", "AXAttributeConstants", "AXRoleConstants", "AXNotificationConstants", "AXActionConstants", "AXValueConstants", "HIServices", "Processes"]
