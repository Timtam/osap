[package]
name = "host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Template matching is embarrassingly parallel — every candidate position is independent —
# and a batch is one task per installed sample library. See spawn_image_worker.
rayon = "1"
# Pinned: the guard (src/vm_guard.rs) writes Luau's interrupt field behind mlua's back — mlua's
# own interrupt procedure, saved once and written back when a callback runs too long — so any
# other mlua is a decision, not an update. `vm_guard_tests::mlua_pin` fails in CI when mlua changes
# how it uses that field; module-manifest's dev-dependency is pinned with it, for one mlua.
mlua = { version = "=0.11.6", features = ["luau", "error-send", "serialize"] }
module-manifest = { path = "../module-manifest" }
# `host.sound` (sound.rs): rodio's device sink and decoders. Playback and the four formats
# sound.md names, all four Symphonia's; not the defaults' microphone (recording), MP4/AAC, or
# dither, which brings rand.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "flac", "vorbis", "mp3"] }
# Only for `realtime`: the audio thread at the multimedia class scheduler's "Audio" priority on
# Windows, or time-critical when that is refused, as cpal 0.15.3 raised it without being asked;
# cpal 0.17 and later do it only with this feature. Nothing on macOS. It must be the cpal rodio
# uses, or the feature misses the stream that plays (sound.rs, `one_cpal_in_the_build`). Adds
# audio_thread_priority (MPL-2.0, as Symphonia is).
cpal = { version = "0.18.2", features = ["realtime"] }
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
# `float_roundtrip`: `host.json.decode` reads a number as the double nearest to it, as .NET,
# Python and JavaScript do. The default parser reads about one fraction in ten a unit in the
# last place off, which moved a window region's edge by a pixel (json.rs,
# `fractions_read_back_exactly`). By serde_json's own figure it parses such numbers about half
# as fast.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Two users: the settings store's atomic replace (settings.rs, `replace_file`: a temporary
# file of its own beside the store, flushed, then renamed over it), and the staging folder an
# install or update is unpacked into before it replaces the installed module (registry.rs,
# `install_one`: removed on every way out, error or panic). Already in the lock file:
# native-tls uses it on macOS.
tempfile = "3.27"
ureq = "3"
toml = "1.1.2"
# Lexical `..` removal for `host.include` (lib.rs, `include_target`): `std::path::absolute`
# keeps `..` on Unix, which let an include leave the module folder on macOS.
path-clean = "1.0.1"
# A branch name in the raw.githubusercontent.com path (registry.rs, `fetch_manifest`). Already
# in the build under ureq; the same version.
percent-encoding = "2.3"
# `host.screen.cells` (cells.rs): the predicate string's parser, on winnow's combinators —
# already compiled in, under toml, at this version — and hex, the one format cells are
# exchanged in. crates/macos-check borrows cells.rs and lists both again.
winnow = "1.0.3"
hex = "0.4.3"
# The strict option readers of `host.screen.cells` and `matchCells` (lib.rs): serde through
# mlua's `serialize` feature, with the path of whatever was wrong (`states[3].cells`).
serde_path_to_error = "0.1.20"

# The module window (gui.rs) and the Windows page frames (webview_win.rs). 0.9.23 builds
# wxWidgets 3.3.4, and skips a handler that a nested event loop re-enters — which is why the
# timer tick opens no dialog itself (gui.rs, `later`).
wxdragon = "0.9.23"
# The tick's resets on every way out of a handler, a panic's included (gui.rs). Already in the
# lock file, at this version, under mlua's parking_lot.
scopeguard = "1.2"

# The single-instance guard's "show the manager" request: a named pipe on Windows, a
# Unix-domain socket on macOS (instance.rs, which says why not wxWidgets' own IPC).
interprocess = "2.4.4"
# The backend that lets our dependencies' diagnostics reach the log (logging.rs), and the
# header's OS line. Both are borrowed by crates/macos-check through logging.rs.
log = "0.4"
os_info = { version = "3.15", default-features = false }
# Whether the log's path still names the file this copy writes into, before a rotation moves it
# (logging.rs, `Fs::still_names`): a headless copy beside the running one may have moved it
# already. Already in the lock file, at this version, under walkdir; borrowed by crates/macos-check
# through logging.rs, so it is declared there too.
same-file = "1.0.6"
# Which recognition language a read gets (ocr/lang.rs): BCP 47 negotiation against the list the
# platform's engine offers, with CLDR's likely subtags so "de" finds "de-DE" and "zh-TW" finds
# "zh-Hant". Borrowed by crates/macos-check through that file, so it is declared there too.
fluent-langneg = { version = "0.14.2", features = ["cldr"] }
# Whether a recognition language is written in the Latin script (ocr/lang.rs, `latin_script`):
# CLDR's likely subtags, which `fluent-langneg`'s "cldr" brings already, at the version in the lock.
icu_locid_transform = "1.5"
# Which script a letter of a reading belongs to (ocr/lang.rs, `non_latin_letter`): Unicode's Script
# property, already in the lock at this version under `url`'s IDNA.
icu_properties = "2.2"
# `host.gui.webview` (webview.rs): the Content-Type a page's file is served with, from its
# extension. WebView2 refuses a module script served with a type that is not JavaScript's. Pure,
# so crates/macos-check borrows webview.rs and declares it too.
mime_guess = "2.0.5"
# The origin of a module's pages (webview.rs, `scheme_for`): 64 bits of SHA-256 of the module's
# id, so no id can be chosen to share another module's origin. Also what the `host.screen.cells`
# golden test (cells_golden_tests.rs) checks its frame with. Was a dev-dependency; already in the
# lock file.
sha2 = "0.11"

[dev-dependencies]
# Archives for the install tests (registry.rs), written in the test rather than checked in.
# Unpacking itself is module_manifest::unpack_zip; the features match that crate's.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
# Speech through the screen reader, compiled from source and linked statically — see
# docs/prism-speech-design.md. Windows only: macOS reaches VoiceOver through
# speech/voiceover.rs, which is better than prism's own VoiceOver backend.
prism-sys = { path = "../prism-sys" }
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Foundation", "Foundation_Collections", "Security_Cryptography", "Win32_System_WinRT", "Storage_Streams", "System_UserProfile", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant",
    # Desktop duplication (backend/dxgi.rs), for the modules that declare `[screen] capture =
    # "duplication"`. Gdi is here because the crate gates DXGI_OUTPUT_DESC on it (its HMONITOR).
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11"] }
# Secondary OCR engine (in-process, FFI): PaddleOCR recognition model via ONNX
# Runtime, used as a fallback for text Windows.Media.Ocr won't read (lone digits).
# `download-binaries` links pyke's static build of ONNX Runtime 1.31 in (ort-sys's
# build/download/dist.tsv names it, licences/onnxruntime/SOURCE.txt its notices), fetched over
# `tls-native`, since without default features the download needs one TLS feature named; and
# `copy-dylibs` puts its DirectML.dll beside the executable. API level 22, the Mac's, so that the
# one source file both compile (backend/paddle_ocr.rs) sees one `ort`. Default features off for
# that level, and for ndarray, which nothing here uses: tensors go in and come out as slices.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-22"] }
# ort reports through `tracing` (ONNX Runtime's own messages included); the `log` feature turns
# its events into `log` records while no tracing subscriber is installed, which none is, so they
# reach logging.rs's backend with everything else.
tracing = { version = "0.1", default-features = false, features = ["log"] }
# XInput, loaded at run time, with the ordinal-100 Guide read and the vendor and product ids
# of XInputGetCapabilitiesEx: the loader under gilrs and Bevy (backend/gamepad/xinput.rs).
rusty-xinput = "1.3"
# Gamepad (backend/gamepad): `Win32_UI_Input_XboxController` for XInput's constants only — the
# DLL itself is loaded at run time, never linked — and `Win32_Security`, without which
# windows-sys hides `CreateWaitableTimerExW`, the high-resolution timer the 4 ms poll needs.
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_XboxController", "Win32_Security",
    # Only for the live duplication test's window (DwmFlush, transitions off); see backend/dxgi.rs.
    "Win32_Graphics_Dwm",
    # The single-instance guard (instance.rs): the user's SID and the session id for the names,
    # and FileSystem for the flags the second start opens the pipe with (overlapped, at
    # identification level).
    "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem",
    # `GetTickCount`, for how late the keyboard hook ran against the key event it was handed:
    # both are on the tick clock, and the pairing of a late hook with its WM_HOTKEY needs that.
    "Win32_System_SystemInformation",
    # The keyboard hook's watch (backend/hook_watch_thread.rs): suspend/resume notifications, and
    # which desktop has the keyboard (the lock screen and a UAC prompt's secure desktop).
    "Win32_System_Power", "Win32_System_StationsAndDesktops",
    # What a page's WebView2 processes hold in memory, for the `[gui]` line (webview_win.rs).
    "Win32_System_ProcessStatus",
    # The WebView2 environment the host creates itself, without waiting, in the user's display
    # language as wry sets it (`GetUserDefaultUILanguage`, `LCIDToLocaleName`; webview_win.rs).
    "Win32_Globalization"] }
# `host.gui.webview` on Windows (webview_win.rs): WebView2 in a wx tool window of our own,
# through the Tauri team's wry — the data folder beside the executable, a scheme served from the
# module's folder with real response headers, asynchronous messages both ways. Default features
# off: they are WebKitGTK's, for Linux. Its `windows` is 0.62 where ours is 0.58, so a second
# `windows` is built; nothing of it reaches the macOS build (this table is Windows-only). The Mac's
# table names the same release.
wry = { version = "0.57.1", default-features = false }
# What wry does not offer, on the same COM objects it hands out: host-to-page messages as JSON
# (`PostWebMessageAsJson`, no script built from strings), whether the runtime is installed, a
# page's processes failing, and its process list. The versions wry itself uses.
webview2-com = "0.39.1"
windows-core = "0.62"
# The pipe's security descriptor is written as SDDL, and interprocess takes it as widestring's
# `U16CStr` (instance.rs). Already in the lock through interprocess.
widestring = "1"

# --- macOS ---------------------------------------------------------------------------
# Kept identical to crates/macos-check/Cargo.toml, which is what type-checks this code
# from a Windows machine. A feature enabled there and missing here would mean the check
# passes and the real Mac build does not.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
# The neural recogniser (backend/paddle_ocr.rs), the same model and the same `ort` as on Windows,
# but ONNX Runtime is Microsoft's own universal dylib in Contents/Frameworks, opened at run time
# (`load-dynamic`) rather than linked. 1.22 because it is among the last releases with an Intel
# half (1.23.2, Microsoft's last universal archive, needs macOS 13.4; 1.24 has none), and
# `api-22` is the level this `ort` asks of it: it refuses an older library itself, and
# backend/paddle_ocr.rs a newer one. It needs macOS 13.3, where the application starts from 12.3
# — linked, it would stop it from starting below 13.3; loaded, the recogniser is simply missing
# there. tract, pure Rust, was measured against it first: the same readings, but 7.6 times the
# time; and its build script assembles kernels with a C compiler for the target, which
# `check-macos.ps1` on Windows does not have (tools/paddle-engines). Without `download-binaries`
# the build downloads nothing: ort-sys's build script returns at once. The same version as
# Windows': Cargo allows one package that links "onnxruntime" in the whole graph (TODO.md).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "load-dynamic", "api-22"] }
tracing = { version = "0.1", default-features = false, features = ["log"] }
# `host.gui.webview` on the Mac (stage 4, TODO.md): WKWebView through wry, as WebView2 is on
# Windows, and the same release as Windows'. Not before 0.57.1: 0.57.0 activates the application
# for every web view it builds (src/wkwebview/mod.rs), which takes the front from the DAW while
# nothing of ours is in front; 0.57.1 carries the fix, #1866, which leaves the activation and the
# first responder alone for a web view built hidden or without the keyboard. The macOS workflow
# refuses a Mac build whose wry is older. wry's manifest turns on two features of objc2 for the
# whole Mac build, for as long as wry is in it: `exception`, whose helper is one Objective-C file
# a build script compiles, so check-macos.ps1 needs a clang that can compile for macOS (it says
# where it looks); and `disable-encoding-assertions` (wry's data store identifier crashes without
# it), which ends objc2's check of each message's types against the runtime's, a check only debug
# builds make, so a debug build on a Mac makes it for no code of ours either.
wry = { version = "0.57.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = ["NSString", "NSArray", "NSValue", "NSGeometry", "NSDictionary", "NSError", "NSData", "NSRunLoop", "NSThread", "NSObjCRuntime", "NSEnumerator", "NSURL", "NSProcessInfo", "NSNotification", "NSOperation", "NSAppleScript", "NSAppleEventDescriptor", "objc2-core-services", "NSDate", "NSRange", "block2",
    # The user's preferred languages, for the OCR language a read without `lang` gets (ocr/lang.rs).
    "NSLocale",
    # WebKit's version for the log, and this application's identifier for `page-check`'s look at
    # the folders WebKit makes under ~/Library (backend/macos/page.rs, page_check.rs).
    "NSBundle"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
features = ["NSWorkspace", "NSRunningApplication", "NSScreen", "NSApplication", "NSResponder", "NSGraphics", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSEvent", "NSWindow", "objc2-core-foundation",
    # The panel `page-check` shows as a page's will be (backend/macos/page_check.rs).
    "NSPanel",
    # The views of the Mac's page window (stage 4, TODO.md); a WKWebView is one.
    "NSView",
    # What `page-check` sends a page and reads back (backend/macos/page_check.rs): key events made
    # in-process (their constructor takes a graphics context), a menu with the items wxWidgets'
    # Apple menu has, and the pasteboard a copy and a paste go through.
    "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSPasteboard"]

# What the Mac's page window asks of WebKit beyond wry (stage 4, TODO.md): the content rule list
# that refuses every load outside the module's scheme, compiled into a store in the portable
# folder; host-to-page messages through callAsyncJavaScript in a content world, the message an
# argument and never a script made from it; the preferences and a data store that keeps nothing.
# The version wry asks for, and its default features off as wry has them: the default is
# the whole framework.
[target.'cfg(target_os = "macos")'.dependencies.objc2-web-kit]
version = "0.3.2"
default-features = false
features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore", "WKContentWorld", "WKFrameInfo", "WKPreferences", "WKWebsiteDataStore"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3"
features = ["CFBase", "CFString", "CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFCGTypes", "CFData", "CFMachPort",
    # The alert a second start shows when it gives up (instance.rs), before wxWidgets exists.
    "CFUserNotification", "CFDate", "CFURL",
    # The keyboard-layout change (backend/macos/layout.rs): a distributed notification that has
    # to arrive while this accessory application is in the background. AppKit suspends those for
    # an application that is not active, and only the CF observer can ask for DeliverImmediately;
    # the NSDistributedNotificationCenter block form cannot.
    "CFNotificationCenter",
    # VoiceOver's AppleScript box (speech/voiceover.rs): its preference, read and never written.
    "CFPreferences"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3"
features = ["CGBase", "CGEvent", "CGEventTypes", "CGEventSource", "CGDirectDisplay", "CGDisplayConfiguration", "CGWindow", "CGWindowLevel", "CGImage", "CGGeometry", "CGRemoteOperation", "CGColorSpace", "CGDataProvider", "CGContext", "CGBitmapContext", "CGError", "libc", "objc2"]

# ScreenCaptureKit, for the one call that replaces CGWindowListCreateImage. That function is
# marked obsoleted in the macOS 15 SDK — C and Objective-C projects no longer compile against
# it — and a Mac on a newer macOS is where the next session runs. `captureImageInRect:` arrived
# in macOS 15.2 and is asked of the runtime before it is used (see backend/macos/capture.rs);
# the framework itself exists from macOS 12.3, so linking it costs the oldest supported Mac
# nothing.
[target.'cfg(target_os = "macos")'.dependencies.objc2-screen-capture-kit]
version = "0.3"
default-features = false
features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager",
    # The Screen Recording request's own capture request: asking for the shareable content is what
    # TCC counts as a request to capture, and what puts the application into that list (perm.rs).
    "SCShareableContent"]

# IOKit's two Input Monitoring calls, `IOHIDCheckAccess` and `IOHIDRequestAccess` (backend/macos/
# perm.rs), with their request and access types as named constants. They were looked up by name
# with a hand-written request number, and that number was the posting side's — the Accessibility
# half of the same check — so the application never read Input Monitoring at all. Both calls
# exist from macOS 10.15, below the oldest macOS this application starts on.
[target.'cfg(target_os = "macos")'.dependencies.objc2-io-kit]
version = "0.3"
default-features = false
features = ["std", "hidsystem"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-vision]
version = "0.3"
features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes", "VNGeometry", "VNError", "VNUtils", "VNRequestRevisionProviding", "objc2-core-graphics", "objc2-core-foundation",
    # `ocr-bench` pins a request to a compute device (`setComputeDevice:forComputeStage:`, macOS 14
    # and later, asked of the runtime before it is used) and lists what Vision offers per stage.
    "objc2-core-ml"]

# The compute devices those two calls take and return, by their protocol only. Not the
# `MLAllComputeDevices` function, which exists from macOS 14 and would stop the application from
# starting on 12 and 13 if it were imported: `ocr-bench` looks it up by name (backend/macos/ocr/
# bench.rs), and the macOS workflow checks that it is not imported.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-ml]
version = "0.3"
default-features = false
features = ["std", "MLComputeDeviceProtocol"]

# For the one question `objc2-foundation` cannot answer on its own: whether this application
# is ALLOWED to send Apple Events to VoiceOver. `AEDeterminePermissionToAutomateTarget` both
# asks and, with its own flag, prompts — so no fake event has to be sent to raise the dialog.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-services]
version = "0.3"
default-features = false
features = ["AE", "AEDataModel", "AppleEvents"]

# AVFoundation's speech synthesiser, which replaced `tts`. Not for the dependency count:
# `tts` cannot reach Personal Voice, and a voice the user recorded of themselves is worth a
# hand-written wrapper to somebody who listens to a synthesiser all day. See speech/avspeech.rs.
[target.'cfg(target_os = "macos")'.dependencies.objc2-avf-audio]
version = "0.3"
default-features = false
features = ["std", "block2", "AVSpeechSynthesis"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-application-services]
version = "0.3"
features = ["AXUIElement", "AXValue", "AXError", "AXAttributeConstants", "AXRoleConstants", "AXNotificationConstants", "AXActionConstants", "AXValueConstants", "HIServices", "Processes"]

# Game controllers, observed from the background (backend/gamepad/apple.rs). `dispatch2` is
# what exposes `handlerQueue`, and the three subclasses are for the touchpad, the paddles and
# the share button, which the extended profile does not carry.
[target.'cfg(target_os = "macos")'.dependencies.objc2-game-controller]
version = "0.3"
default-features = false
features = ["std", "block2", "dispatch2", "GCController", "GCExtendedGamepad", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad", "GCPhysicalInputProfile", "GCDevice", "GCDualShockGamepad", "GCDualSenseGamepad", "GCXboxGamepad"]
