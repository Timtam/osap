[package]
name = "host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Template matching is embarrassingly parallel — every candidate position is independent —
# and a batch is one task per installed sample library. See spawn_image_worker.
rayon = "1"
mlua = { version = "0.11.6", features = ["luau", "error-send", "serialize"] }
module-manifest = { path = "../module-manifest" }
rodio = "0.20"
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# Two users: the settings store's atomic replace (settings.rs, `replace_file`: a temporary
# file of its own beside the store, flushed, then renamed over it), and the staging folder an
# install or update is unpacked into before it replaces the installed module (registry.rs,
# `install_one`: removed on every way out, error or panic). Already in the lock file:
# native-tls uses it on macOS.
tempfile = "3.27"
ureq = "3"
toml = "1.1.2"
# Lexical `..` removal for `host.include` (lib.rs, `include_target`): `std::path::absolute`
# keeps `..` on Unix, which let an include leave the module folder on macOS.
path-clean = "1.0.1"
# A branch name in the raw.githubusercontent.com path (registry.rs, `fetch_manifest`). Already
# in the build under ureq; the same version.
percent-encoding = "2.3"

wxdragon = "0.9.15"

# The single-instance guard's "show the manager" request: a named pipe on Windows, a
# Unix-domain socket on macOS (instance.rs, which says why not wxWidgets' own IPC).
interprocess = "2.4.4"
# The backend that lets our dependencies' diagnostics reach the log (logging.rs), and the
# header's OS line. Both are borrowed by crates/macos-check through logging.rs.
log = "0.4"
os_info = { version = "3.15", default-features = false }

[dev-dependencies]
# Archives for the install tests (registry.rs), written in the test rather than checked in.
# Unpacking itself is module_manifest::unpack_zip; the features match that crate's.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
# Speech through the screen reader, compiled from source and linked statically — see
# docs/prism-speech-design.md. Windows only: macOS reaches VoiceOver through
# speech/voiceover.rs, which is better than prism's own VoiceOver backend.
prism-sys = { path = "../prism-sys" }
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Foundation", "Foundation_Collections", "Security_Cryptography", "Win32_System_WinRT", "Storage_Streams", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant",
    # Desktop duplication (backend/dxgi.rs), for the modules that declare `[screen] capture =
    # "duplication"`. Gdi is here because the crate gates DXGI_OUTPUT_DESC on it (its HMONITOR).
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11"] }
# Secondary OCR engine (in-process, FFI): PaddleOCR recognition model via ONNX
# Runtime, used as a fallback for text Windows.Media.Ocr won't read (lone digits).
ort = { version = "=2.0.0-rc.10", features = ["download-binaries", "copy-dylibs", "ndarray"] }
ndarray = "0.16"
# ort reports through `tracing` (ONNX Runtime's own messages included); the `log` feature turns
# its events into `log` records while no tracing subscriber is installed, which none is, so they
# reach logging.rs's backend with everything else.
tracing = { version = "0.1", default-features = false, features = ["log"] }
# XInput, loaded at run time, with the ordinal-100 Guide read and the vendor and product ids
# of XInputGetCapabilitiesEx: the loader under gilrs and Bevy (backend/gamepad/xinput.rs).
rusty-xinput = "1.3"
# Gamepad (backend/gamepad): `Win32_UI_Input_XboxController` for XInput's constants only — the
# DLL itself is loaded at run time, never linked — and `Win32_Security`, without which
# windows-sys hides `CreateWaitableTimerExW`, the high-resolution timer the 4 ms poll needs.
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_XboxController", "Win32_Security",
    # Only for the live duplication test's window (DwmFlush, transitions off); see backend/dxgi.rs.
    "Win32_Graphics_Dwm",
    # The single-instance guard (instance.rs): the user's SID and the session id for the names,
    # and FileSystem for the flags the second start opens the pipe with (overlapped, at
    # identification level).
    "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem",
    # `GetTickCount`, for how late the keyboard hook ran against the key event it was handed:
    # both are on the tick clock, and the pairing of a late hook with its WM_HOTKEY needs that.
    "Win32_System_SystemInformation"] }
# The pipe's security descriptor is written as SDDL, and interprocess takes it as widestring's
# `U16CStr` (instance.rs). Already in the lock through interprocess.
widestring = "1"

# --- macOS ---------------------------------------------------------------------------
# Kept identical to crates/macos-check/Cargo.toml, which is what type-checks this code
# from a Windows machine. A feature enabled there and missing here would mean the check
# passes and the real Mac build does not.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = ["NSString", "NSArray", "NSValue", "NSGeometry", "NSDictionary", "NSError", "NSData", "NSRunLoop", "NSThread", "NSObjCRuntime", "NSEnumerator", "NSURL", "NSProcessInfo", "NSNotification", "NSOperation", "NSAppleScript", "NSAppleEventDescriptor", "objc2-core-services", "NSDate", "NSRange", "block2"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
features = ["NSWorkspace", "NSRunningApplication", "NSScreen", "NSApplication", "NSResponder", "NSGraphics", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSEvent", "NSWindow", "objc2-core-foundation"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3"
features = ["CFBase", "CFString", "CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFCGTypes", "CFData", "CFMachPort",
    # The alert a second start shows when it gives up (instance.rs), before wxWidgets exists.
    "CFUserNotification", "CFDate", "CFURL",
    # The keyboard-layout change (backend/macos/layout.rs): a distributed notification that has
    # to arrive while this accessory application is in the background. AppKit suspends those for
    # an application that is not active, and only the CF observer can ask for DeliverImmediately;
    # the NSDistributedNotificationCenter block form cannot.
    "CFNotificationCenter"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3"
features = ["CGBase", "CGEvent", "CGEventTypes", "CGEventSource", "CGDirectDisplay", "CGDisplayConfiguration", "CGWindow", "CGWindowLevel", "CGImage", "CGGeometry", "CGRemoteOperation", "CGColorSpace", "CGDataProvider", "CGContext", "CGBitmapContext", "CGError", "libc", "objc2"]

# ScreenCaptureKit, for the one call that replaces CGWindowListCreateImage. That function is
# marked obsoleted in the macOS 15 SDK — C and Objective-C projects no longer compile against
# it — and a Mac on a newer macOS is where the next session runs. `captureImageInRect:` arrived
# in macOS 15.2 and is asked of the runtime before it is used (see backend/macos/capture.rs);
# the framework itself exists from macOS 12.3, so linking it costs the oldest supported Mac
# nothing.
[target.'cfg(target_os = "macos")'.dependencies.objc2-screen-capture-kit]
version = "0.3"
default-features = false
features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-vision]
version = "0.3"
features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes", "VNGeometry", "VNError", "VNUtils", "VNRequestRevisionProviding", "objc2-core-graphics", "objc2-core-foundation"]

# For the one question `objc2-foundation` cannot answer on its own: whether this application
# is ALLOWED to send Apple Events to VoiceOver. `AEDeterminePermissionToAutomateTarget` both
# asks and, with its own flag, prompts — so no fake event has to be sent to raise the dialog.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-services]
version = "0.3"
default-features = false
features = ["AE", "AEDataModel", "AppleEvents"]

# AVFoundation's speech synthesiser, which replaced `tts`. Not for the dependency count:
# `tts` cannot reach Personal Voice, and a voice the user recorded of themselves is worth a
# hand-written wrapper to somebody who listens to a synthesiser all day. See speech/avspeech.rs.
[target.'cfg(target_os = "macos")'.dependencies.objc2-avf-audio]
version = "0.3"
default-features = false
features = ["std", "block2", "AVSpeechSynthesis"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-application-services]
version = "0.3"
features = ["AXUIElement", "AXValue", "AXError", "AXAttributeConstants", "AXRoleConstants", "AXNotificationConstants", "AXActionConstants", "AXValueConstants", "HIServices", "Processes"]

# Game controllers, observed from the background (backend/gamepad/apple.rs). `dispatch2` is
# what exposes `handlerQueue`, and the three subclasses are for the touchpad, the paddles and
# the share button, which the extended profile does not carry.
[target.'cfg(target_os = "macos")'.dependencies.objc2-game-controller]
version = "0.3"
default-features = false
features = ["std", "block2", "dispatch2", "GCController", "GCExtendedGamepad", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad", "GCPhysicalInputProfile", "GCDevice", "GCDualShockGamepad", "GCDualSenseGamepad", "GCXboxGamepad"]
