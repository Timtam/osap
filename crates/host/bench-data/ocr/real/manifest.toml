accept = ["DEF"]
must_read = true
platform = "windows"
source = "sforzando, by Plogue Art et Technologie Inc.: the PB RANGE read-out; the module's old Windows region, which starts inside the well (modules/sforzando/src/main.luau explains why the macOS one starts earlier). Cut from the Windows calibration shot sforzando-Pitchbend-range-menu-before.png, region 576,40,602,60 from (8,51)"
checked = "read off the picture as DEF; sforzando shows DEF (the instrument's default) or a number of semitones there; on Windows (ocr-bench --paddle, 2026-10-02) both recognisers read DEF"

