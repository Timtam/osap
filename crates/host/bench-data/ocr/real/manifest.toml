# What each picture in this folder is, for `automation-platform ocr-bench --pictures`.
# Written by tools/ocr-fixtures/crop.py from tools/ocr-fixtures/real.toml; change that and
# run it again rather than editing this. Each is <name>@<scale>x.png beside this file.

[[picture]]
name = "sfz-polyphony"
scale = 1
w_pt = 30
h_pt = 30
accept = ["64"]
must_read = true
platform = "windows"
source = "sforzando, by Plogue Art et Technologie Inc.: the POLY. read-out, light digits in a black well; the module's Windows region (modules/sforzando/src/main.luau). Cut from the Windows calibration shot sforzando-Polyphony-menu-before.png, region 486,40,516,70 from (8,51)"
checked = "read off the picture as 64; sforzando shows the polyphony as a whole number, 64 by default; on Windows (ocr-bench --paddle, 2026-10-02) the neural recogniser read 64, Windows.Media.Ocr nothing"

[[picture]]
name = "sfz-pitchbend"
