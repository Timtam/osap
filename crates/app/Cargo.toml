[package]
name = "app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "automation-platform"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
# The commit this executable is compiled from (see BUILT_FROM in main.rs). A proc macro that
# runs `git describe` and makes the crate depend on `.git/logs/HEAD` and `.git/index`, so a new
# commit rebuilds this crate even when no Rust changed. Here rather than in `host` on purpose:
# this crate is the small one, and a commit then costs a relink rather than a host rebuild.
git-version = "0.3.9"
host = { path = "../host" }

# Only to re-attach the parent terminal when the management subcommands are run from one —
# the windows subsystem otherwise leaves the process with no console at all. Same version
# the host crate already pulls in, so this adds nothing to the build.
[target.'cfg(windows)'.dependencies]
# Not called from here. Named so that cargo hands this crate prism-sys's link metadata —
# `DEP_PRISM_DELAYLOAD`, which only a direct dependent receives — because the executable is
# built here and it is the executable that has to delay-load those imports. See build.rs.
prism-sys = { path = "../prism-sys" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
