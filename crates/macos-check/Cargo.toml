# Type-checks the macOS backend from a Windows machine.
#
# The macOS backend is being written BLIND — there is no Mac to run it on yet. Code that
# has never been compiled is not an implementation, it is a guess, so this crate exists to
# turn the guess into something the compiler has agreed with:
#
#   cargo check --target aarch64-apple-darwin -p macos-check
#
# That works from Windows because `check` never links: rustup's aarch64-apple-darwin std
# plus the objc2 crates (pure Rust bindings, no build scripts that need Apple tooling) are
# all the front end needs. One build script does compile C: the helper of objc2's `exception`
# feature, which wry turns on, one Objective-C file that includes no header — so any clang that
# compiles for macOS compiles it without Apple's SDK, and check-macos.ps1 finds Visual Studio's.
# The check cannot catch a wrong constant, a wrong coordinate convention, or a call that is
# legal and does the wrong thing — but it catches every misremembered signature, and on a
# blind port that is most of the mistakes.
#
# Why a separate crate rather than checking `host` for the Mac target: `host` depends on
# wxdragon, whose build script compiles wxWidgets itself and cannot do that for macOS from
# a Windows host. So this crate pulls in the two files that matter — the backend and the
# logging it writes to — via #[path], and nothing else.
#
# It is empty on every platform but macOS, so a Windows build walks straight past it.
[package]
name = "macos-check"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

# Kept in one place, because the real crate needs the identical set: `host` declares these
# again under [target.'cfg(target_os = "macos")'.dependencies], and a feature enabled here
# but missing there would make this crate check code that the real build cannot compile.
[target.'cfg(target_os = "macos")'.dependencies]
# `speech/mod.rs` returns `anyhow::Result` from its constructor, and borrowing the whole
# module rather than its two macOS leaves is what makes the WIRING checkable from here —
# which one line of that wiring immediately needed.
anyhow = "1"
# `logging.rs` routes the `log` facade into the file and names the OS through os_info;
# `instance.rs` speaks interprocess. All three are in host's [dependencies] (every platform),
# so they are repeated here rather than mirrored from a macOS-only table.
log = "0.4"
os_info = { version = "3.15", default-features = false }
interprocess = "2.4.4"
# `logging.rs` asks whether the log's path still names its open file before it rotates it.
same-file = "1.0.6"
# `cells.rs` (host.screen.cells) parses its predicate with winnow and exchanges cells as hex;
# both are in host's [dependencies], so they are repeated here like the three above.
winnow = "1.0.3"
hex = "0.4.3"
# ocr/lang.rs is borrowed: which recognition language a read gets. The same version and feature as
# host's [dependencies].
fluent-langneg = { version = "0.14.2", features = ["cldr"] }
# ocr/lang.rs's script questions: as host's [dependencies].
icu_locid_transform = "1.5"
icu_properties = "2.2"
# webview.rs is borrowed: `host.gui.webview`'s rules, and the answer a Mac gives today. It encodes
# and decodes URL paths, types a page's files and hashes a module's id into its origin; all three
# are in host's [dependencies] (percent-encoding at the version ureq brings, mime_guess and sha2
# for webview.rs), so they are repeated here.
percent-encoding = "2.3"
mime_guess = "2.0.5"
sha2 = "0.11"
# `page-check` says whether a message the host was handed is JSON (backend/macos/page_check.rs,
# `handed_text`). In host's [dependencies], at this version and feature.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# ocr/bench.rs reads the manifest of the pictures `--pictures` names, and ocr/paddle_pre.rs crops
# and resizes for the neural recogniser. Both in host's [dependencies], at these versions.
toml = "1.1.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
# The neural recogniser (backend/paddle_ocr.rs): as host's macOS table, ONNX Runtime opened at run
# time. Without `download-binaries` the check downloads nothing and links nothing.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic"] }
ndarray = "0.16"
tracing = { version = "0.1", default-features = false, features = ["log"] }
# `host.gui.webview` on the Mac: as host's macOS table, wry from 0.57.1 on, the first release with
# its activation fix (#1866); host's comment says why. Its objc2 `exception` feature compiles one
# Objective-C file in a build script, the one C compile of this check, which is why
# check-macos.ps1 looks for a clang.
wry = { version = "0.57.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = ["NSString", "NSArray", "NSValue", "NSGeometry", "NSDictionary", "NSError", "NSData", "NSRunLoop", "NSThread", "NSObjCRuntime", "NSEnumerator", "NSURL", "NSProcessInfo", "NSNotification", "NSOperation", "NSAppleScript", "NSAppleEventDescriptor", "objc2-core-services", "NSDate", "NSRange", "block2",
    # The user's preferred languages, for the OCR language a read without `lang` gets (ocr/lang.rs).
    "NSLocale",
    # WebKit's version for the log, and this application's identifier for `page-check`'s look at
    # the folders WebKit makes under ~/Library (backend/macos/page.rs, page_check.rs).
    "NSBundle"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
features = ["NSWorkspace", "NSRunningApplication", "NSScreen", "NSApplication", "NSResponder", "NSGraphics", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSEvent", "NSWindow", "objc2-core-foundation",
    # The panel `page-check` shows as a page's will be (backend/macos/page_check.rs).
    "NSPanel",
    # The views of the Mac's page window (stage 4, TODO.md); a WKWebView is one.
    "NSView",
    # What `page-check` sends a page and reads back (backend/macos/page_check.rs): key events made
    # in-process (their constructor takes a graphics context), a menu with the items wxWidgets'
    # Apple menu has, and the pasteboard a copy and a paste go through.
    "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSPasteboard"]

# What the Mac's page window asks of WebKit beyond wry: as host's macOS table, which says what for.
[target.'cfg(target_os = "macos")'.dependencies.objc2-web-kit]
version = "0.3.2"
default-features = false
features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore", "WKContentWorld", "WKFrameInfo", "WKPreferences", "WKWebsiteDataStore"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3"
features = ["CFBase", "CFString", "CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFCGTypes", "CFData", "CFMachPort",
    # The alert a second start shows when it gives up (instance.rs), before wxWidgets exists.
    "CFUserNotification", "CFDate", "CFURL",
    # The keyboard-layout change (backend/macos/layout.rs): a distributed notification that has
    # to arrive while this accessory application is in the background. AppKit suspends those for
    # an application that is not active, and only the CF observer can ask for DeliverImmediately;
    # the NSDistributedNotificationCenter block form cannot.
    "CFNotificationCenter",
    # VoiceOver's AppleScript box (speech/voiceover.rs): its preference, read and never written.
    "CFPreferences"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3"
features = ["CGBase", "CGEvent", "CGEventTypes", "CGEventSource", "CGDirectDisplay", "CGDisplayConfiguration", "CGWindow", "CGWindowLevel", "CGImage", "CGGeometry", "CGRemoteOperation", "CGColorSpace", "CGDataProvider", "CGContext", "CGBitmapContext", "CGError", "libc", "objc2"]

# ScreenCaptureKit, for the one call that replaces CGWindowListCreateImage. That function is
# marked obsoleted in the macOS 15 SDK — C and Objective-C projects no longer compile against
# it — and a Mac on a newer macOS is where the next session runs. `captureImageInRect:` arrived
# in macOS 15.2 and is asked of the runtime before it is used (see backend/macos/capture.rs);
# the framework itself exists from macOS 12.3, so linking it costs the oldest supported Mac
# nothing.
[target.'cfg(target_os = "macos")'.dependencies.objc2-screen-capture-kit]
version = "0.3"
default-features = false
features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager",
    # The Screen Recording request's own capture request: asking for the shareable content is what
    # TCC counts as a request to capture, and what puts the application into that list (perm.rs).
    "SCShareableContent"]

# IOKit's two Input Monitoring calls, `IOHIDCheckAccess` and `IOHIDRequestAccess` (backend/macos/
# perm.rs), with their request and access types as named constants. They were looked up by name
# with a hand-written request number, and that number was the posting side's — the Accessibility
# half of the same check — so the application never read Input Monitoring at all. Both calls
# exist from macOS 10.15, below the oldest macOS this application starts on.
[target.'cfg(target_os = "macos")'.dependencies.objc2-io-kit]
version = "0.3"
default-features = false
features = ["std", "hidsystem"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-vision]
version = "0.3"
features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes", "VNGeometry", "VNError", "VNUtils", "VNRequestRevisionProviding", "objc2-core-graphics", "objc2-core-foundation",
    # `ocr-bench` pins a request to a compute device (`setComputeDevice:forComputeStage:`, macOS 14
    # and later, asked of the runtime before it is used) and lists what Vision offers per stage.
    "objc2-core-ml"]

# The compute devices those two calls take and return, by their protocol only. Not the
# `MLAllComputeDevices` function, which exists from macOS 14 and would stop the application from
# starting on 12 and 13 if it were imported: `ocr-bench` looks it up by name (backend/macos/ocr/
# bench.rs), and the macOS workflow checks that it is not imported.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-ml]
version = "0.3"
default-features = false
features = ["std", "MLComputeDeviceProtocol"]

# For the one question `objc2-foundation` cannot answer on its own: whether this application
# is ALLOWED to send Apple Events to VoiceOver. `AEDeterminePermissionToAutomateTarget` both
# asks and, with its own flag, prompts — so no fake event has to be sent to raise the dialog.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-services]
version = "0.3"
default-features = false
features = ["AE", "AEDataModel", "AppleEvents"]

# AVFoundation's speech synthesiser, which replaced `tts`. Not for the dependency count:
# `tts` cannot reach Personal Voice, and a voice the user recorded of themselves is worth a
# hand-written wrapper to somebody who listens to a synthesiser all day. See speech/avspeech.rs.
[target.'cfg(target_os = "macos")'.dependencies.objc2-avf-audio]
version = "0.3"
default-features = false
features = ["std", "block2", "AVSpeechSynthesis"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-application-services]
version = "0.3"
features = ["AXUIElement", "AXValue", "AXError", "AXAttributeConstants", "AXRoleConstants", "AXNotificationConstants", "AXActionConstants", "AXValueConstants", "HIServices", "Processes"]

# Game controllers, observed from the background (backend/gamepad/apple.rs). `dispatch2` is
# what exposes `handlerQueue`, and the three subclasses are for the touchpad, the paddles and
# the share button, which the extended profile does not carry.
[target.'cfg(target_os = "macos")'.dependencies.objc2-game-controller]
version = "0.3"
default-features = false
features = ["std", "block2", "dispatch2", "GCController", "GCExtendedGamepad", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad", "GCPhysicalInputProfile", "GCDevice", "GCDualShockGamepad", "GCDualSenseGamepad", "GCXboxGamepad"]
